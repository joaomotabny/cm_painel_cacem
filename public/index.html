<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000; color: #ff9900; font-family: 'VT323', monospace; 
            margin: 0; padding: 20px; overflow: hidden;
            text-shadow: 0 0 8px rgba(255, 153, 0, 0.5);
            height: 100vh; display: flex; flex-direction: column;
        }

        .header { 
            font-size: 45px; border-bottom: 3px solid #ff9900; 
            padding-bottom: 5px; margin-bottom: 10px;
            display: flex; justify-content: space-between; flex-shrink: 0;
        }

        /* Área central limitada para não empurrar o rodapé */
        #list { flex-grow: 1; overflow: hidden; }

        .row { 
            display: flex; align-items: center; 
            border-bottom: 1px solid rgba(255, 153, 0, 0.1); 
            height: 90px;
        }
        .col-line { width: 15%; font-size: 75px; font-weight: bold; }
        .col-dest { width: 50%; font-size: 55px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .col-time { width: 35%; text-align: right; font-size: 60px; }
        .diff-min { font-size: 40px; margin-right: 15px; opacity: 0.8; }

        /* Rodapé Fixo */
        .footer {
            height: 70px; line-height: 70px; background: #0a0a0a;
            border-top: 3px solid #ff9900; margin-top: auto;
            overflow: hidden; position: relative; flex-shrink: 0;
        }

        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            font-size: 40px;
            position: absolute;
            will-change: transform;
            animation: marquee-flat 25s linear infinite;
        }

        @keyframes marquee-flat {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        @keyframes blinker { 50% { opacity: 0; } }
        .blink { animation: blinker 1s linear infinite; color: #ff3333; }
    </style>
</head>
<body>
    <div class="header">
        <span>Cacém - Av. Bons Amigos</span>
        <span id="clock">00:00:00</span>
    </div>

    <div id="list">Sincronizando...</div>

    <div class="footer">
        <div class="marquee-content" id="info-bar">A carregar informações meteorológicas para Agualva-Cacém...</div>
    </div>

    <script>
        function setClock() {
            const now = new Date();
            document.getElementById('clock').innerHTML = now.toLocaleTimeString('pt-PT');
        }

        function getWeatherIcon(code) {
            if (code <= 1) return "☀️ Limpo";
            if (code <= 3) return "☁️ Nublado";
            if (code <= 65) return "🌧️ Chuvoso";
            return "⛅ Variável";
        }

        async function updateWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.7705&longitude=-9.2995&current_weather=true');
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                const cond = getWeatherIcon(data.current_weather.weathercode);
                const date = new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
                
                document.getElementById('info-bar').innerHTML = 
                    `HOJE: ${date} • AGUALVA-CACÉM: ${temp}ºC • ${cond} • TENHA UMA BOA VIAGEM! • `;
            } catch (e) {
                document.getElementById('info-bar').innerHTML = "Informação temporariamente indisponível";
            }
        }

        async function updateBoard() {
            const stopIds = ['170459', '172500']; 
            const targetLines = ['1211', '2605'];
            try {
                const results = await Promise.all(stopIds.map(id => 
                    fetch(`https://api.carrismetropolitana.pt/stops/${id}/realtime`).then(res => res.json())
                ));
                let all = [].concat(...results);
                const now = new Date();

                let filtered = all.filter(d => targetLines.includes(d.line_id) && 
                    (d.estimated_arrival_unix || d.scheduled_arrival_unix) > (Date.now()/1000 - 60));

                filtered.sort((a, b) => (a.scheduled_arrival_unix) - (b.scheduled_arrival_unix));

                let html = '';
                // Limitado a 5 linhas para garantir visibilidade
                filtered.slice(0, 5).forEach(d => {
                    const arrivalUnix = d.estimated_arrival_unix || d.scheduled_arrival_unix;
                    const diffMin = Math.floor((new Date(arrivalUnix * 1000) - now) / 60000);
                    let displayTime = (d.estimated_arrival || d.scheduled_arrival).substring(0,5);

                    let timeDisplay = diffMin <= 0 ? `<span class="blink">A chegar</span>` : `<span class="diff-min">${diffMin}m</span><span>${displayTime}</span>`;

                    html += `<div class="row">
                        <span class="col-line">${d.line_id}</span>
                        <span class="col-dest">${d.headsign}</span>
                        <span class="col-time">${timeDisplay}</span>
                    </div>`;
                });
                document.getElementById('list').innerHTML = html || '<div class="row" style="opacity:0.5">Sem serviços agora</div>';
            } catch (e) { }
        }

        setInterval(setClock, 1000);
        setInterval(updateBoard, 30000);
        setInterval(updateWeather, 600000);
        
        setClock(); updateBoard(); updateWeather();
    </script>
</body>
</html>
