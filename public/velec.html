<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Painel VELEC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  background: #050505;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}


/* ==================================================
   PAINEL
   ================================================== */

.panel {
  position: relative;

  width: min(98vw, 1500px);
  aspect-ratio: 2.65 / 1;

  background:
    linear-gradient(
      145deg,
      #16202a,
      #0c1117 55%,
      #18212a
    );

  border: 2px solid #29343c;
  border-radius: 8px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.9),
    inset 0 0 30px rgba(255,255,255,.025);

  padding: 4.8% 5.5% 5.5%;
}


/* ==================================================
   SUPORTES
   ================================================== */

.mount {
  position: absolute;

  top: -14%;

  width: 5%;
  height: 15%;

  background:
    linear-gradient(
      90deg,
      #090b0d,
      #333b41,
      #090b0d
    );

  border-radius: 8px 8px 0 0;
}

.mount.left {
  left: 23%;
}

.mount.center {
  left: 48%;

  background:
    linear-gradient(
      90deg,
      #777,
      #d0cbc0,
      #888
    );
}

.mount.right {
  right: 18%;
}


/* ==================================================
   ECRÃS
   ================================================== */

.screens {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    64% 32%;

  gap: 4%;
}


/* ==================================================
   PAINEL ESQUERDO
   ================================================== */

.left-display {
  position: relative;

  overflow: hidden;

  border: 8px solid #070a0b;

  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      #334a49 0%,
      #20312f 30%,
      #111c1a 100%
    );

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.85),
    inset 0 0 8px rgba(255,255,255,.15);
}


.left-display::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  z-index: 20;

  background:
    linear-gradient(
      110deg,
      transparent 35%,
      rgba(255,255,255,.08) 48%,
      transparent 58%
    );
}


/* ==================================================
   LABELS
   ================================================== */

.hora-label,
.destino-label {
  position: absolute;

  left: 7%;

  color: #dfdeb3;

  font-size:
    clamp(18px, 3vw, 54px);

  font-weight: 700;

  letter-spacing: .02em;

  z-index: 5;
}

.hora-label {
  top: 8%;
}

.destino-label {
  top: 48%;
}


/* ==================================================
   HORA FLIP-DOT
   ================================================== */

.hora {
  position: absolute;

  left: 7%;
  top: 24%;

  display: flex;

  align-items: center;

  gap: clamp(6px, .8vw, 16px);

  z-index: 5;
}


.hora-grupo {
  display: flex;

  align-items: center;

  gap: clamp(2px, .25vw, 5px);

  --dot:
    clamp(2px, .55vw, 8px);

  --dot-gap:
    clamp(.6px, .08vw, 1.8px);

  --char-gap:
    clamp(2px, .18vw, 4px);
}


.h-separator {
  color: #dbd8b6;

  font-size:
    clamp(20px, 2.8vw, 47px);

  font-family: Arial, sans-serif;

  font-weight: 400;
}


/* ==================================================
   DESTINO FLIP-DOT
   ================================================== */

.destino {
  position: absolute;

  left: 7%;
  right: 25%;

  bottom: 10%;

  z-index: 5;

  overflow: hidden;
}


.destino-grupo {
  display: flex;

  align-items: center;

  gap: var(--char-gap);

  width: 100%;

  --dot:
    clamp(1.2px, .35vw, 5px);

  --dot-gap:
    clamp(.4px, .055vw, 1.2px);

  --char-gap:
    clamp(1px, .12vw, 3px);
}


/* ==================================================
   MÓDULO 5x7
   ================================================== */

.dot-character {
  flex: 0 0 auto;

  display: grid;

  grid-template-columns:
    repeat(5, var(--dot));

  grid-template-rows:
    repeat(7, var(--dot));

  gap: var(--dot-gap);

  padding:
    calc(var(--dot-gap) * 1.3);

  border-radius:
    calc(var(--dot) * .45);

  background:
    linear-gradient(
      180deg,
      #161b17,
      #080b08
    );

  border:
    1px solid rgba(0,0,0,.85);

  box-shadow:
    inset 0 0
    calc(var(--dot) * .8)
    rgba(0,0,0,.9),

    0
    calc(var(--dot) * .25)
    calc(var(--dot) * .45)
    rgba(0,0,0,.65);
}


/* PONTO APAGADO */

.dot {
  width: var(--dot);
  height: var(--dot);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #252b25 0%,
      #141914 48%,
      #060806 100%
    );

  box-shadow:
    inset 0 0
    calc(var(--dot) * .18)
    rgba(255,255,255,.04);
}


/* PONTO ACESO */

.dot.on {
  background:
    radial-gradient(
      circle at 38% 32%,
      #fff658 0%,
      #f3dc16 35%,
      #b99e00 72%,
      #6c5b00 100%
    );

  box-shadow:
    0 0
    calc(var(--dot) * .8)
    rgba(255,226,20,.45),

    inset 0 0
    calc(var(--dot) * .18)
    rgba(255,255,255,.45);
}


/* ==================================================
   VIA 3
   ================================================== */

.via {
  position: absolute;

  right: 5%;
  top: 12%;

  width: 20%;

  aspect-ratio: 1 / 1;

  border:
    clamp(3px, .5vw, 8px)
    solid #d9f343;

  border-radius: 8%;

  display: flex;

  justify-content: center;
  align-items: center;

  color: #d9f343;

  font-family:
    Arial,
    sans-serif;

  font-weight: 500;

  font-size:
    clamp(55px, 10vw, 170px);

  line-height: 1;

  text-shadow:
    0 0 12px
    rgba(200,255,50,.35);

  box-shadow:
    inset 0 0 15px rgba(190,255,50,.07),
    0 0 6px rgba(190,255,50,.15);

  z-index: 5;
}


/* ==================================================
   CRT
   ================================================== */

.crt-frame {
  position: relative;

  background: #050606;

  border-radius: 6px;

  padding: 5%;

  box-shadow:
    inset 0 0 18px #000;
}


.crt {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 10%;

  padding:
    7% 8% 5%;

  background:
    radial-gradient(
      ellipse at center,
      #17301c 0%,
      #0c2011 55%,
      #030904 100%
    );

  color: #c9ef35;

  font-family:
    "VT323",
    monospace;

  box-shadow:
    inset 0 0 30px rgba(0,0,0,.95),
    inset 0 0 60px rgba(0,0,0,.6);
}


.crt::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  z-index: 10;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 1px,
      transparent 3px
    );

  opacity: .45;
}


/* ==================================================
   PARAGENS
   ================================================== */

.stops {
  position: relative;

  z-index: 2;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  column-gap: 8%;

  height: 75%;
}


.stop-column {
  display: flex;

  flex-direction: column;

  gap: 0;
}


.stop {
  height: 10%;

  white-space: nowrap;

  overflow: hidden;

  font-size:
    clamp(14px, 1.55vw, 31px);

  line-height: 1;

  text-shadow:
    0 0 4px
    rgba(200,239,53,.28);
}


/* ==================================================
   COMBOIO SEGUINTE
   ================================================== */

.next-train {
  position: absolute;

  z-index: 3;

  left: 8%;
  right: 8%;
  bottom: 7%;

  display: grid;

  grid-template-columns:
    auto 1fr auto;

  align-items: baseline;

  column-gap: 5%;
}


.next-label {
  font-size:
    clamp(9px, .8vw, 17px);

  white-space: nowrap;

  letter-spacing: .02em;
}


.next-destination,
.next-time {
  font-size:
    clamp(19px, 2vw, 39px);

  white-space: nowrap;

  line-height: 1;
}


.next-destination {
  text-align: left;
}


.next-time {
  text-align: right;
}


/* ==================================================
   MOBILE
   ================================================== */

@media (max-width: 700px) {

  .panel {
    width: 100vw;

    border-radius: 0;

    padding-left: 2%;
    padding-right: 2%;
  }


  .screens {
    grid-template-columns:
      64% 34%;

    gap: 2%;
  }


  .left-display {
    border-width: 3px;
  }


  .crt-frame {
    padding: 3%;
  }


  .hora-grupo {
    --dot:
      clamp(1.8px, .52vw, 3px);

    --dot-gap:
      clamp(.5px, .08vw, 1px);

    --char-gap:
      clamp(1px, .15vw, 2px);
  }


  .destino-grupo {
    --dot:
      clamp(1px, .32vw, 2px);

    --dot-gap:
      clamp(.35px, .05vw, .7px);

    --char-gap:
      clamp(.7px, .1vw, 1.5px);
  }


  .stop {
    font-size:
      clamp(7px, 2.1vw, 15px);
  }


  .next-label {
    font-size:
      clamp(5px, 1.1vw, 9px);
  }


  .next-destination,
  .next-time {
    font-size:
      clamp(9px, 2.5vw, 18px);
  }

}

</style>
</head>


<body>

<div class="panel">

  <div class="mount left"></div>

</div>

/* ==================================================
   MATRIZ 5x7
   ================================================== */

const FONT = {

"A":["01110","10001","10001","11111","10001","10001","10001"],
"B":["11110","10001","10001","11110","10001","10001","11110"],
"C":["01111","10000","10000","10000","10000","10000","01111"],

" ":["00000","00000","00000","00000","00000","00000","00000"]

};



/* ==================================================
   DESENHAR FLIP-DOT
   ================================================== */

function desenharDotText(
  elemento,
  texto
) {

  elemento.innerHTML = "";


  const textoFinal =
    String(texto)
      .toUpperCase();


  for (
    const caracter of textoFinal
  ) {

    const pattern =
      FONT[caracter] ||
      FONT[" "];


    const character =
      document.createElement(
        "div"
      );


    character.className =
      "dot-character";


    for (
      let linha = 0;
      linha < 7;
      linha++
    ) {

      for (
        let coluna = 0;
        coluna < 5;
        coluna++
      ) {

        const dot =
          document.createElement(
            "div"
          );


        dot.className =
          "dot";


        if (
          pattern[linha][coluna] === "1"
        ) {

          dot.classList.add(
            "on"
          );

        }


        character.appendChild(
          dot
        );

      }

    }


    elemento.appendChild(
      character
    );

  }

}



/* ==================================================
   NORMALIZAR DESTINO
   ================================================== */

function normalizarDestino(
  destino
) {

  if (!destino) {
    return "";
  }


  const texto =
    String(destino)
      .toUpperCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .trim();


  if (
    texto.includes("ORIENTE")
  ) {

    return "LISBOA-ORIENTE";

  }


  if (
    texto.includes("ALVERCA")
  ) {

    return "ALVERCA";

  }


  if (
    texto.includes("SANTA APOLONIA") ||
    texto.includes("S.APOLONIA") ||
    texto.includes("S. APOLONIA") ||
    texto.includes("LISBOA-S.A")
  ) {

    return "LISBOA-S.A";

  }


  return "";

}



/* ==================================================
   HORA
   ================================================== */

function mostrarHora(
  hora
) {

  const horas =
    document.getElementById(
      "horaHoras"
    );


  const minutos =
    document.getElementById(
      "horaMinutos"
    );


  if (!hora) {

    desenharDotText(
      horas,
      "--"
    );


    desenharDotText(
      minutos,
      "--"
    );


    return;

  }


  const partes =
    String(hora)
      .trim()
      .split(":");


  desenharDotText(
    horas,
    partes[0] || "--"
  );


  desenharDotText(
    minutos,
    partes[1] || "--"
  );

}
