<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Painel VELEC</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}


/* ==================================================
   PAINEL
================================================== */

.panel {
  position: relative;

  width: min(98vw, 1500px);
  aspect-ratio: 2.65 / 1;

  background:
    linear-gradient(
      145deg,
      #16202a,
      #0c1117 55%,
      #18212a
    );

  border: 2px solid #29343c;
  border-radius: 8px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.9),
    inset 0 0 30px rgba(255,255,255,.025);

  padding: 4.8% 5.5% 5.5%;
}


/* ==================================================
   SUPORTES
================================================== */

.mount {
  position: absolute;

  top: -14%;

  width: 5%;
  height: 15%;

  background:
    linear-gradient(
      90deg,
      #090b0d,
      #333b41,
      #090b0d
    );

  border-radius: 8px 8px 0 0;
}

.mount.left {
  left: 23%;
}

.mount.center {
  left: 48%;

  background:
    linear-gradient(
      90deg,
      #777,
      #d0cbc0,
      #888
    );
}

.mount.right {
  right: 18%;
}


/* ==================================================
   ECRÃS
================================================== */

.screens {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    64% 32%;

  gap: 4%;
}


/* ==================================================
   PAINEL ESQUERDO
================================================== */

.left-display {
  position: relative;

  overflow: hidden;

  border: 8px solid #070a0b;
  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      #334a49 0%,
      #20312f 30%,
      #111c1a 100%
    );

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.85),
    inset 0 0 8px rgba(255,255,255,.15);
}


.left-display::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 20;
  pointer-events: none;

  background:
    linear-gradient(
      110deg,
      transparent 35%,
      rgba(255,255,255,.08) 48%,
      transparent 58%
    );
}


/* ==================================================
   HORA / DESTINO
================================================== */

.hora-label,
.destino-label {
  position: absolute;

  left: 7%;

  color: #dfdeb3;

  font-size:
    clamp(18px, 3vw, 54px);

  font-weight: 700;

  letter-spacing: .02em;

  z-index: 5;
}


.hora-label {
  top: 8%;
}


.destino-label {
  top: 48%;
}


/* ==================================================
   HORA FLIP-DOT
================================================== */

.hora {
  position: absolute;

  left: 7%;
  top: 24%;

  display: flex;

  align-items: center;

  gap:
    clamp(6px, .8vw, 16px);

  z-index: 5;
}


.hora-grupo {
  display: flex;

  align-items: center;

  gap:
    clamp(2px, .25vw, 5px);

  --dot:
    clamp(2px, .55vw, 8px);

  --dot-gap:
    clamp(.6px, .08vw, 1.8px);
}


.h-separator {
  color: #dbd8b6;

  font-size:
    clamp(20px, 2.8vw, 47px);

  font-family:
    Arial,
    sans-serif;

  font-weight: 400;
}


/* ==================================================
   DESTINO FLIP-DOT
================================================== */

/*
  ALTERAÇÃO:

  Antes terminava nos 24%.

  Agora vai praticamente até
  ao fim do painel, porque o
  quadrado da linha 3 está por cima.
*/

.destino {
  position: absolute;

  left: 7%;
  right: 5%;

  bottom: 8%;

  overflow: hidden;

  z-index: 5;
}


.destino-grupo {
  display: flex;

  align-items: center;

  gap:
    clamp(1px, .15vw, 3px);

  width: 100%;

  /*
    ALTERAÇÃO:
    dots maiores
  */

  --dot:
    clamp(1.5px, .43vw, 6px);

  --dot-gap:
    clamp(.4px, .065vw, 1.3px);
}


/* ==================================================
   CARÁCTER FLIP-DOT 5x7
================================================== */

.dot-character {
  flex:
    0 0 auto;

  display: grid;

  grid-template-columns:
    repeat(5, var(--dot));

  grid-template-rows:
    repeat(7, var(--dot));

  gap:
    var(--dot-gap);

  padding:
    calc(
      var(--dot-gap) * 1.3
    );

  background:
    linear-gradient(
      180deg,
      #171c17,
      #080b08
    );

  border:
    1px solid
    rgba(0,0,0,.85);

  border-radius:
    calc(
      var(--dot) * .45
    );

  box-shadow:
    inset
    0 0
    calc(var(--dot) * .8)
    rgba(0,0,0,.9),

    0
    calc(var(--dot) * .25)
    calc(var(--dot) * .45)
    rgba(0,0,0,.65);
}


/* ponto desligado */

.dot {
  width:
    var(--dot);

  height:
    var(--dot);

  border-radius:
    50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #252b25 0%,
      #141914 48%,
      #060806 100%
    );
}


/* ponto ligado */

.dot.on {
  background:
    radial-gradient(
      circle at 38% 32%,
      #fff658 0%,
      #f3dc16 35%,
      #b99e00 72%,
      #6c5b00 100%
    );

  box-shadow:
    0 0
    calc(var(--dot) * .7)
    rgba(255,226,20,.4);
}


/* ==================================================
   VIA
================================================== */

.via {
  position: absolute;

  right: 5%;
  top: 12%;

  width: 20%;

  aspect-ratio:
    1 / 1;

  border:
    clamp(3px, .5vw, 8px)
    solid #d9f343;

  border-radius:
    8%;

  display: flex;

  justify-content: center;
  align-items: center;

  color:
    #d9f343;

  font-family:
    Arial,
    sans-serif;

  font-weight:
    500;

  font-size:
    clamp(55px, 10vw, 170px);

  line-height:
    1;

  text-shadow:
    0 0 12px
    rgba(200,255,50,.35);

  box-shadow:
    inset
    0 0 15px
    rgba(190,255,50,.07),

    0 0 6px
    rgba(190,255,50,.15);

  z-index:
    5;
}


/* ==================================================
   CRT
================================================== */

.crt-frame {
  position: relative;

  background:
    #050606;

  border-radius:
    6px;

  padding:
    5%;

  box-shadow:
    inset
    0 0 18px
    #000;
}


.crt {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius:
    10%;

  padding:
    7% 8% 5%;

  background:
    radial-gradient(
      ellipse at center,
      #17301c 0%,
      #0c2011 55%,
      #030904 100%
    );

  color:
    #c9ef35;

  font-family:
    "Courier New",
    monospace;

  font-weight:
    bold;

  box-shadow:
    inset
    0 0 30px
    rgba(0,0,0,.95),

    inset
    0 0 60px
    rgba(0,0,0,.6);
}


.crt::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events:
    none;

  z-index:
    10;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    );

  opacity:
    .4;
}


/* ==================================================
   PARAGENS
================================================== */

.stops {
  position: relative;

  z-index:
    2;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  column-gap:
    8%;

  height:
    75%;
}


.stop-column {
  display: flex;

  flex-direction:
    column;
}


.stop {
  height:
    10%;

  white-space:
    nowrap;

  overflow:
    hidden;

  font-size:
    clamp(11px, 1.25vw, 24px);

  line-height:
    1;

  text-shadow:
    0 0 3px
    rgba(200,239,53,.3);
}


/* ==================================================
   COMBOIO SEGUINTE
================================================== */

.next-train {
  position: absolute;

  z-index:
    3;

  left:
    8%;

  right:
    8%;

  bottom:
    7%;

  display:
    grid;

  grid-template-columns:
    auto minmax(0, 1fr) auto;

  align-items:
    baseline;

  column-gap:
    4%;
}


.next-label {
  font-size:
    clamp(7px, .65vw, 13px);

  white-space:
    nowrap;
}


.next-destination {
  font-size:
    clamp(15px, 1.6vw, 31px);

  white-space:
    nowrap;

  overflow:
    hidden;

  line-height:
    1;

  text-align:
    left;
}


.next-time {
  font-size:
    clamp(15px, 1.6vw, 31px);

  white-space:
    nowrap;

  line-height:
    1;

  text-align:
    right;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

  .panel {
    width:
      100vw;

    border-radius:
      0;

    padding-left:
      2%;

    padding-right:
      2%;
  }


  .screens {
    grid-template-columns:
      64% 34%;

    gap:
      2%;
  }


  .left-display {
    border-width:
      3px;
  }


  .crt-frame {
    padding:
      3%;
  }


  .hora-grupo {

    --dot:
      clamp(
        1.8px,
        .52vw,
        3px
      );

    --dot-gap:
      clamp(
        .5px,
        .08vw,
        1px
      );

  }


  /*
    DESTINO MAIOR NO IPHONE
  */

  .destino-grupo {

    --dot:
      clamp(
        1.25px,
        .40vw,
        2.7px
      );

    --dot-gap:
      clamp(
        .35px,
        .055vw,
        .8px
      );

  }


  .stop {
    font-size:
      clamp(
        5px,
        1.45vw,
        11px
      );
  }


  .next-label {
    font-size:
      clamp(
        4px,
        .8vw,
        7px
      );
  }


  .next-destination,
  .next-time {
    font-size:
      clamp(
        7px,
        1.7vw,
        13px
      );
  }


  .next-train {
    column-gap:
      3%;
  }

}

</style>
</head>


<body>

<div class="panel">

  <div class="mount left"></div>

  <div class="mount center"></div>

  <div class="mount right"></div>


  <div class="screens">


    <!-- PAINEL ESQUERDO -->

    <section class="left-display">


      <div class="hora-label">
        HORA
      </div>


      <div class="hora">

        <div
          class="hora-grupo"
          id="horaHoras"
        ></div>


        <span class="h-separator">
          h
        </span>


        <div
          class="hora-grupo"
          id="horaMinutos"
        ></div>

      </div>


      <div class="destino-label">
        DESTINO
      </div>


      <div class="destino">

        <div
          class="destino-grupo"
          id="destinoAtual"
        ></div>

      </div>


      <div class="via">
        3
      </div>


    </section>



    <!-- CRT -->

    <section class="crt-frame">

      <div class="crt">


        <div class="stops">

          <div
            class="stop-column"
            id="coluna1"
          ></div>


          <div
            class="stop-column"
            id="coluna2"
          ></div>

        </div>


        <div class="next-train">


          <div class="next-label">
            COMB.SEGUINTE
          </div>


          <div
            class="next-destination"
            id="proximoDestino"
          >
            ----
          </div>


          <div
            class="next-time"
            id="proximaHora"
          >
            --:--
          </div>


        </div>

      </div>

    </section>


  </div>

</div>



<script>

/* ==================================================
   CONFIG
================================================== */

const API_URL =
  "/api/partidas";


const REFRESH_INTERVAL =
  30000;


const CACHE_KEY =
  "velec-partidas-v2";


const CACHE_MAX_AGE =
  5 * 60 * 1000;


let temDadosVisiveis =
  false;



/* ==================================================
   PARAGENS
================================================== */

const PARAGENS = {

  "LISBOA-ORIENTE": [

    "MASSAMA",
    "MONTE ABRAÃO",
    "QUELUZ BELAS",
    "AMADORA",
    "REBOLEIRA",
    "S.CR-DAMAIA",
    "BENFICA",
    "SETE RIOS",
    "ENTRECAMPOS",
    "ROMA-AREEIRO",
    "BRAÇO PRATA"

  ],


  "ALVERCA": [

    "MASSAMA",
    "MONTE ABRAÃO",
    "QUELUZ BELAS",
    "AMADORA",
    "REBOLEIRA",
    "S.CR-DAMAIA",
    "BENFICA",
    "SETE RIOS",
    "ENTRECAMPOS",
    "ROMA-AREEIRO",
    "BRAÇO PRATA",
    "LISBOA-ORIENTE",
    "MOSCAVIDE",
    "SACAVEM",
    "BOBADELA",
    "S.IRIA",
    "PÓVOA"

  ],


  "LISBOA-S.A": [

    "SETE RIOS",
    "ENTRECAMPOS"

  ]

};



/* ==================================================
   MATRIZ 5x7
================================================== */

const FONT = {

"A":["01110","10001","10001","11111","10001","10001","10001"],
"B":["11110","10001","10001","11110","10001","10001","11110"],
"C":["01111","10000","10000","10000","10000","10000","01111"],
"D":["11110","10001","10001","10001","10001","10001","11110"],
"E":["11111","10000","10000","11110","10000","10000","11111"],
"F":["11111","10000","10000","11110","10000","10000","10000"],
"G":["01111","10000","10000","10111","10001","10001","01111"],
"H":["10001","10001","10001","11111","10001","10001","10001"],
"I":["11111","00100","00100","00100","00100","00100","11111"],
"J":["00111","00010","00010","00010","10010","10010","01100"],
"K":["10001","10010","10100","11000","10100","10010","10001"],
"L":["10000","10000","10000","10000","10000","10000","11111"],
"M":["10001","11011","10101","10101","10001","10001","10001"],
"N":["10001","11001","10101","10011","10001","10001","10001"],
"O":["01110","10001","10001","10001","10001","10001","01110"],
"P":["11110","10001","10001","11110","10000","10000","10000"],
"Q":["01110","10001","10001","10001","10101","10010","01101"],
"R":["11110","10001","10001","11110","10100","10010","10001"],
"S":["01111","10000","10000","01110","00001","00001","11110"],
"T":["11111","00100","00100","00100","00100","00100","00100"],
"U":["10001","10001","10001","10001","10001","10001","01110"],
"V":["10001","10001","10001","10001","10001","01010","00100"],
"W":["10001","10001","10001","10101","10101","10101","01010"],
"X":["10001","10001","01010","00100","01010","10001","10001"],
"Y":["10001","10001","01010","00100","00100","00100","00100"],
"Z":["11111","00001","00010","00100","01000","10000","11111"],

"0":["01110","10001","10011","10101","11001","10001","01110"],
"1":["00100","01100","00100","00100","00100","00100","01110"],
"2":["01110","10001","00001","00010","00100","01000","11111"],
"3":["11110","00001","00001","01110","00001","00001","11110"],
"4":["00010","00110","01010","10010","11111","00010","00010"],
"5":["11111","10000","10000","11110","00001","00001","11110"],
"6":["01110","10000","10000","11110","10001","10001","01110"],
"7":["11111","00001","00010","00100","01000","01000","01000"],
"8":["01110","10001","10001","01110","10001","10001","01110"],
"9":["01110","10001","10001","01111","00001","00001","01110"],

"-":["00000","00000","00000","11111","00000","00000","00000"],

" ":["00000","00000","00000","00000","00000","00000","00000"]

};



/* ==================================================
   DESENHAR FLIP-DOT
================================================== */

function desenharDotText(
  elemento,
  texto
) {

  const fragmento =
    document.createDocumentFragment();


  elemento.innerHTML =
    "";


  texto =
    String(texto)
      .toUpperCase();


  for (
    const caracter of texto
  ) {

    const pattern =
      FONT[caracter] ||
      FONT[" "];


    const character =
      document.createElement(
        "div"
      );


    character.className =
      "dot-character";


    for (
      let linha = 0;
      linha < 7;
      linha++
    ) {

      for (
        let coluna = 0;
        coluna < 5;
        coluna++
      ) {

        const dot =
          document.createElement(
            "div"
          );


        dot.className =
          pattern[linha][coluna] === "1"
            ? "dot on"
            : "dot";


        character.appendChild(
          dot
        );

      }

    }


    fragmento.appendChild(
      character
    );

  }


  elemento.appendChild(
    fragmento
  );

}



/* ==================================================
   NORMALIZAR DESTINO
================================================== */

function normalizarDestino(
  destino
) {

  if (!destino) {
    return "";
  }


  const texto =
    String(destino)
      .toUpperCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .trim();


  if (
    texto.includes(
      "ORIENTE"
    )
  ) {

    return "LISBOA-ORIENTE";

  }


  if (
    texto.includes(
      "ALVERCA"
    )
  ) {

    return "ALVERCA";

  }


  if (
    texto.includes(
      "SANTA APOLONIA"
    )

    ||

    texto.includes(
      "S.APOLONIA"
    )

    ||

    texto.includes(
      "S. APOLONIA"
    )

    ||

    texto.includes(
      "LISBOA-S.A"
    )
  ) {

    return "LISBOA-S.A";

  }


  return "";

}



/* ==================================================
   HORA
================================================== */

function mostrarHora(
  hora
) {

  const horas =
    document.getElementById(
      "horaHoras"
    );


  const minutos =
    document.getElementById(
      "horaMinutos"
    );


  if (!hora) {

    desenharDotText(
      horas,
      "--"
    );


    desenharDotText(
      minutos,
      "--"
    );


    return;

  }


  const partes =
    String(hora)
      .trim()
      .split(":");


  desenharDotText(
    horas,
    partes[0] || "--"
  );


  desenharDotText(
    minutos,
    partes[1] || "--"
  );

}



/* ==================================================
   CRT: 10 CARACTERES NAS PARAGENS
================================================== */

function limitarCRT(
  texto
) {

  return String(texto)
    .toUpperCase()
    .slice(
      0,
      10
    );

}



/* ==================================================
   COMBOIO SEGUINTE

   Cortamos 3 caracteres ao
   LISBOA-ORIENTE:

   LISBOA-ORIENTE
   ↓
   LISBOA-ORIE
================================================== */

function limitarProximoDestino(
  texto
) {

  const destino =
    String(texto)
      .toUpperCase();


  if (
    destino.length >
    11
  ) {

    return destino.slice(
      0,
      11
    );

  }


  return destino;

}



/* ==================================================
   PARAGENS
================================================== */

function mostrarParagens(
  destino
) {

  const lista =
    PARAGENS[destino] || [];


  const coluna1 =
    document.getElementById(
      "coluna1"
    );


  const coluna2 =
    document.getElementById(
      "coluna2"
    );


  coluna1.innerHTML =
    "";


  coluna2.innerHTML =
    "";


  const corte =
    Math.ceil(
      lista.length / 2
    );


  const esquerda =
    lista.slice(
      0,
      corte
    );


  const direita =
    lista.slice(
      corte
    );


  esquerda.forEach(
    paragem => {

      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "stop";


      linha.textContent =
        limitarCRT(
          paragem
        );


      coluna1.appendChild(
        linha
      );

    }
  );


  direita.forEach(
    paragem => {

      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "stop";


      linha.textContent =
        limitarCRT(
          paragem
        );


      coluna2.appendChild(
        linha
      );

    }
  );

}



/* ==================================================
   ATUALIZAR PAINEL
================================================== */

function atualizarPainel(
  lista
) {

  const comboios =
    lista

      .map(
        comboio => {

          const destino =
            normalizarDestino(
              comboio.destino ||
              comboio.destination ||
              comboio.destinoOriginal
            );


          return {

            ...comboio,

            destinoPainel:
              destino

          };

        }
      )

      .filter(
        comboio =>
          comboio.destinoPainel
      );


  if (
    comboios.length === 0
  ) {

    if (
      !temDadosVisiveis
    ) {

      mostrarHora(
        null
      );


      desenharDotText(

        document.getElementById(
          "destinoAtual"
        ),

        "SEM PARTIDAS"

      );

    }


    return;

  }



  /* ==================================================
     COMBOIO ATUAL
  ================================================== */

  const atual =
    comboios[0];


  mostrarHora(
    atual.hora
  );


  desenharDotText(

    document.getElementById(
      "destinoAtual"
    ),

    atual.destinoPainel

  );


  mostrarParagens(
    atual.destinoPainel
  );



  /* ==================================================
     COMBOIO SEGUINTE
  ================================================== */

  const seguinte =
    comboios[1];


  if (
    seguinte
  ) {

    document
      .getElementById(
        "proximoDestino"
      )
      .textContent =
        limitarProximoDestino(
          seguinte.destinoPainel
        );


    document
      .getElementById(
        "proximaHora"
      )
      .textContent =
        seguinte.hora ||
        "--:--";

  }


  else {

    document
      .getElementById(
        "proximoDestino"
      )
      .textContent =
        "----";


    document
      .getElementById(
        "proximaHora"
      )
      .textContent =
        "--:--";

  }


  temDadosVisiveis =
    true;

}



/* ==================================================
   CACHE LOCAL
================================================== */

function carregarCacheLocal() {

  try {

    const bruto =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!bruto) {
      return;
    }


    const cache =
      JSON.parse(
        bruto
      );


    if (
      !cache ||
      !Array.isArray(
        cache.lista
      ) ||
      !cache.guardadoEm
    ) {

      return;

    }


    const idade =
      Date.now() -
      cache.guardadoEm;


    if (
      idade >
      CACHE_MAX_AGE
    ) {

      return;

    }


    atualizarPainel(
      cache.lista
    );

  }


  catch (
    erro
  ) {

    console.log(
      "Cache ignorado"
    );

  }

}



function guardarCacheLocal(
  lista
) {

  try {

    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify({

        guardadoEm:
          Date.now(),

        lista:
          lista

      })

    );

  }


  catch (
    erro
  ) {

  }

}



/* ==================================================
   API
================================================== */

async function carregarPartidas() {

  try {

    const resposta =
      await fetch(
        API_URL
      );


    if (
      !resposta.ok
    ) {

      throw new Error(
        "HTTP " +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    const lista =
      Array.isArray(
        dados
      )

      ? dados

      : (

        Array.isArray(
          dados.partidas
        )

        ? dados.partidas

        : []

      );


    if (
      lista.length >
      0
    ) {

      guardarCacheLocal(
        lista
      );

    }


    atualizarPainel(
      lista
    );

  }


  catch (
    erro
  ) {

    console.error(
      "Erro API:",
      erro
    );


    if (
      !temDadosVisiveis
    ) {

      mostrarHora(
        null
      );


      desenharDotText(

        document.getElementById(
          "destinoAtual"
        ),

        "SEM LIGACAO"

      );

    }

  }

}



/* ==================================================
   ARRANQUE
================================================== */

carregarCacheLocal();


if (
  !temDadosVisiveis
) {

  mostrarHora(
    null
  );


  desenharDotText(

    document.getElementById(
      "destinoAtual"
    ),

    "----------"

  );

}


carregarPartidas();


setInterval(

  carregarPartidas,

  REFRESH_INTERVAL

);

</script>
