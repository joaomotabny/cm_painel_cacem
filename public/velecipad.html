<title>Painel VELEC iPad</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  overflow: hidden;
  background: #050505;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}


/* ==================================================
   PAINEL

   Versão feita para iPad/Safari antigo:
   - sem aspect-ratio
   - sem clamp() nos elementos importantes
   - sem min()
================================================== */

.panel {
  position: relative;

  width: 98vw;
  height: 34vw;

  max-width: 1500px;
  max-height: 520px;

  background:
    linear-gradient(
      145deg,
      #17222c,
      #0b1117 55%,
      #18232c
    );

  border: 2px solid #293640;
  border-radius: 7px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.92),
    inset 0 0 30px rgba(255,255,255,.025);

  padding:
    2.5% 2.2% 2.6%;
}


/* ==================================================
   SUPORTES
================================================== */

.mount {
  position: absolute;

  top: -17%;

  width: 4.8%;
  height: 18%;

  background:
    linear-gradient(
      90deg,
      #080a0c,
      #323b42,
      #080a0c
    );

  border-radius:
    8px 8px 0 0;
}

.mount.left {
  left: 23%;
}

.mount.center {
  left: 48%;

  background:
    linear-gradient(
      90deg,
      #777,
      #d4d0c5,
      #888
    );
}

.mount.right {
  right: 18%;
}


/* ==================================================
   ECRÃS
================================================== */

.screens {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    64% 34%;

  grid-column-gap: 2%;
}


/* ==================================================
   PAINEL ESQUERDO
================================================== */

.left-display {
  position: relative;

  overflow: hidden;

  border:
    4px solid #070a0b;

  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      #344c4b 0%,
      #233633 35%,
      #101b19 100%
    );

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.88),
    inset 0 0 8px rgba(255,255,255,.14);
}


.left-display::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 20;

  pointer-events: none;

  background:
    linear-gradient(
      108deg,
      transparent 33%,
      rgba(255,255,255,.025) 40%,
      rgba(255,255,255,.09) 48%,
      transparent 59%
    );
}


/* ==================================================
   LABELS
================================================== */

.hora-label,
.destino-label {
  position: absolute;

  left: 7%;

  color: #deddb6;

  font-weight: 700;
  letter-spacing: .01em;

  font-size: 3vw;

  z-index: 5;
}


.hora-label {
  top: 7%;
}


.destino-label {
  top: 46%;
}


/* ==================================================
   HORA
================================================== */

.hora {
  position: absolute;

  left: 7%;
  top: 23%;

  display: flex;

  align-items: center;

  z-index: 5;
}


.hora-grupo {
  display: flex;

  align-items: center;

  /*
    Tamanho fixo dos dots para
    funcionar corretamente no iPad.
  */

  --dot: 5px;
  --dot-gap: 1px;
}


.hora .hora-grupo:first-child {
  margin-right: 10px;
}


.hora .hora-grupo:last-child {
  margin-left: 10px;
}


.h-separator {
  color: #d8d5b3;

  font-family:
    Arial,
    sans-serif;

  font-weight: 400;

  font-size: 3vw;
}


/* ==================================================
   DESTINO
================================================== */

.destino {
  position: absolute;

  left: 7%;
  right: 2%;

  top: 63%;

  overflow: hidden;

  z-index: 5;
}


.destino-grupo {
  display: flex;

  align-items: center;

  /*
    Ligeiramente menor do que
    a hora para LISBOA-ORIENTE caber.
  */

  --dot: 4.2px;
  --dot-gap: .85px;

  width: 100%;
}


/* ==================================================
   MATRIZ 5x7
================================================== */

.dot-character {
  flex: 0 0 auto;

  display: grid;

  grid-template-columns:
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot);

  grid-template-rows:
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot);

  grid-gap:
    var(--dot-gap);

  padding: 1px;

  margin-right: 3px;

  border:
    1px solid rgba(0,0,0,.9);

  border-radius: 2px;

  background:
    linear-gradient(
      180deg,
      #161c17,
      #070a07
    );

  box-shadow:
    inset 0 0 4px rgba(0,0,0,.95),
    0 1px 2px rgba(0,0,0,.7);
}


.destino-grupo .dot-character {
  margin-right: 2px;
}


.dot-character:last-child {
  margin-right: 0;
}


/* DOT APAGADO */

.dot {
  width: var(--dot);
  height: var(--dot);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #252b25 0%,
      #141914 48%,
      #060806 100%
    );
}


/* DOT ACESO */

.dot.on {
  background:
    radial-gradient(
      circle at 38% 32%,
      #fff864 0%,
      #f4df18 33%,
      #bd9f00 70%,
      #685700 100%
    );

  box-shadow:
    0 0 4px
    rgba(255,225,20,.48);
}


/* ==================================================
   LINHA 3

   Sem aspect-ratio para compatibilidade.
================================================== */

.via {
  position: absolute;

  right: 5%;
  top: 9%;

  width: 20%;
  height: 42%;

  display: flex;

  align-items: center;
  justify-content: center;

  border:
    5px solid #d9f343;

  border-radius: 7%;

  color: #d9f343;

  font-family:
    Arial,
    sans-serif;

  font-weight: 500;

  font-size: 10vw;

  line-height: 1;

  text-shadow:
    0 0 12px
    rgba(200,255,50,.35);

  box-shadow:
    inset 0 0 15px
    rgba(190,255,50,.07),

    0 0 6px
    rgba(190,255,50,.15);

  z-index: 5;
}


/* ==================================================
   CRT EXTERIOR
================================================== */

.crt-frame {
  position: relative;

  background: #040505;

  border-radius: 6px;

  padding: 3%;

  box-shadow:
    inset 0 0 20px #000;
}


/* ==================================================
   CRT
================================================== */

.crt {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 10%;

  padding:
    6% 7% 5%;

  background:
    radial-gradient(
      ellipse at center,
      #17341c 0%,
      #0d2412 52%,
      #030904 100%
    );

  color: #c9ef35;

  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  letter-spacing: .015em;

  text-shadow:
    0 0 3px
    rgba(200,239,53,.34);

  box-shadow:
    inset 0 0 30px
    rgba(0,0,0,.95),

    inset 0 0 65px
    rgba(0,0,0,.65);
}


/* SOMBRA / CURVATURA */

.crt::before {
  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 8;

  background:
    radial-gradient(
      ellipse at center,
      transparent 48%,
      rgba(0,0,0,.12) 70%,
      rgba(0,0,0,.45) 100%
    );
}


/* SCANLINES */

.crt::after {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 10;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    );

  opacity: .45;
}


/* ==================================================
   PARAGENS
================================================== */

.stops {
  position: relative;

  z-index: 2;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  grid-column-gap: 5%;

  height: 76%;
}


.stop-column {
  display: flex;

  flex-direction: column;
}


.stop {
  height: 10%;

  white-space: nowrap;

  overflow: hidden;

  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  font-size: 2.35vw;

  line-height: .90;

  letter-spacing: .01em;

  text-shadow:
    0 0 4px
    rgba(200,239,53,.34);
}


/* ALVERCA */

.stops.muitas .stop {
  font-size: 1.95vw;

  line-height: .88;
}


/* ==================================================
   COMBOIO SEGUINTE
================================================== */

.next-train {
  position: absolute;

  z-index: 3;

  left: 7%;
  right: 7%;
  bottom: 6%;

  display: grid;

  grid-template-columns:
    auto minmax(0,1fr) auto;

  grid-column-gap: 3%;

  align-items: baseline;
}


.next-label {
  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  font-size: .9vw;

  line-height: 1;

  white-space: nowrap;

  opacity: .85;
}


.next-destination,
.next-time {
  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  font-size: 2.25vw;

  line-height: .9;

  white-space: nowrap;
}


.next-destination {
  overflow: hidden;

  text-align: left;
}


.next-time {
  text-align: right;
}


/* ==================================================
   IPAD LANDSCAPE
================================================== */

@media (min-width: 900px) {

  .panel {
    width: 98vw;
    height: 33vw;
  }


  .hora-label,
  .destino-label {
    font-size: 2.8vw;
  }


  .h-separator {
    font-size: 2.7vw;
  }


  .hora-grupo {
    --dot: 6px;
    --dot-gap: 1.2px;
  }


  .destino-grupo {
    --dot: 5.3px;
    --dot-gap: 1px;
  }


  .dot-character {
    margin-right: 4px;
  }


  .destino-grupo .dot-character {
    margin-right: 3px;
  }


  .stop {
    font-size: 2.1vw;
  }


  .stops.muitas .stop {
    font-size: 1.8vw;
  }


  .next-label {
    font-size: .75vw;
  }


  .next-destination,
  .next-time {
    font-size: 2vw;
  }


  .via {
    font-size: 9vw;
  }

}


/* ==================================================
   IPAD PORTRAIT / MAIS ESTREITO
================================================== */

@media (max-width: 899px) {

  .panel {
    width: 99vw;
    height: 35vw;

    padding:
      2.3% 1.8% 2.4%;
  }


  .screens {
    grid-template-columns:
      64% 34%;

    grid-column-gap: 2%;
  }


  .hora-label,
  .destino-label {
    font-size: 3.2vw;
  }


  .h-separator {
    font-size: 3.1vw;
  }


  .via {
    border-width: 4px;

    font-size: 10vw;
  }


  .stop {
    font-size: 2.55vw;
  }


  .stops.muitas .stop {
    font-size: 2.1vw;
  }


  .next-label {
    font-size: 1vw;
  }


  .next-destination,
  .next-time {
    font-size: 2.45vw;
  }

}

/* ==================================================
   DESENHAR MATRIZ
================================================== */

function desenharDotText(
  elemento,
  texto
) {


  const fragmento =
    document.createDocumentFragment();


  elemento.innerHTML =
    "";


  texto =
    String(texto)
      .toUpperCase();


  for (
    let i = 0;
    i < texto.length;
    i++
  ) {


    const caracter =
      texto.charAt(i);


    const pattern =
      FONT[caracter] ||
      FONT[" "];


    const character =
      document.createElement(
        "div"
      );


    character.className =
      "dot-character";


    for (
      let linha = 0;
      linha < 7;
      linha++
    ) {


      for (
        let coluna = 0;
        coluna < 5;
        coluna++
      ) {


        const dot =
          document.createElement(
            "div"
          );


        dot.className =

          pattern[linha][coluna] === "1"

          ? "dot on"

          : "dot";


        character.appendChild(
          dot
        );


      }

    }


    fragmento.appendChild(
      character
    );


  }


  elemento.appendChild(
    fragmento
  );

}



/* ==================================================
   NORMALIZAR DESTINO
================================================== */

function normalizarDestino(
  destino
) {


  if (!destino) {

    return "";

  }


  const texto =

    String(destino)

      .toUpperCase()

      .normalize("NFD")

      .replace(
        /[\u0300-\u036f]/g,
        ""
      )

      .trim();


  if (
    texto.indexOf("ORIENTE") !== -1
  ) {

    return "LISBOA-ORIENTE";

  }


  if (
    texto.indexOf("ALVERCA") !== -1
  ) {

    return "ALVERCA";

  }


  if (

    texto.indexOf("SANTA APOLONIA") !== -1 ||

    texto.indexOf("S.APOLONIA") !== -1 ||

    texto.indexOf("S. APOLONIA") !== -1 ||

    texto.indexOf("LISBOA-S.A") !== -1 ||

    texto.indexOf("LIS-S.APOL") !== -1

  ) {

    return "LISBOA-S.A";

  }


  return "";

}

   HORA
================================================== */

function mostrarHora(
  hora
) {


  const horas =
    document.getElementById(
      "horaHoras"
    );


  const minutos =
    document.getElementById(
      "horaMinutos"
    );


  if (!hora) {


    desenharDotText(
      horas,
      "--"
    );


    desenharDotText(
      minutos,
      "--"
    );


    return;


  }


  const partes =
    String(hora)
      .trim()
      .split(":");


  desenharDotText(
    horas,
    partes[0] || "--"
  );


  desenharDotText(
    minutos,
    partes[1] || "--"
  );

}



/* ==================================================
   LIMITES CRT
================================================== */

function limitarCRT(
  texto
) {


  return String(texto)
    .toUpperCase()
    .slice(
      0,
      10
    );

}



function limitarProximoDestino(
  texto
) {


  return String(texto)
    .toUpperCase()
    .slice(
      0,
      11
    );

}



/* ==================================================
   PARAGENS
================================================== */

function mostrarParagens(
  destino
) {


  const lista =
    PARAGENS[destino] || [];


  const coluna1 =
    document.getElementById(
      "coluna1"
    );


  const coluna2 =
    document.getElementById(
      "coluna2"
    );


  const stops =
    document.getElementById(
      "stops"
    );


  if (
    lista.length > 12
  ) {


    stops.className =
      "stops muitas";


  }

  else {


    stops.className =
      "stops";


  }


  coluna1.innerHTML =
    "";


  coluna2.innerHTML =
    "";


  const corte =
    Math.ceil(
      lista.length / 2
    );


  const esquerda =
    lista.slice(
      0,
      corte
    );


  const direita =
    lista.slice(
      corte
    );


  esquerda.forEach(
    function (
      paragem
    ) {


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "stop";


      linha.textContent =
        limitarCRT(
          paragem
        );


      coluna1.appendChild(
        linha
      );


    }
  );


  direita.forEach(
    function (
      paragem
    ) {


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "stop";


      linha.textContent =
        limitarCRT(
          paragem
        );


      coluna2.appendChild(
        linha
      );


    }
  );

}



/* ==================================================
   PREPARAR COMBOIOS
================================================== */

function prepararComboios(
  lista
) {


  return lista

    .map(
      function (
        comboio
      ) {


        const destino =
          normalizarDestino(

            comboio.destino ||

            comboio.destination ||

            comboio.destinoOriginal

          );


        const copia =
          {};


        for (
          const chave in comboio
        ) {


          copia[chave] =
            comboio[chave];


        }


        copia.destinoPainel =
          destino;


        return copia;


      }
    )


    .filter(
      function (
        comboio
      ) {


        return Boolean(
          comboio.destinoPainel
        );


      }
    );

}



/* ==================================================
   ATUALIZAR PAINEL
================================================== */

function atualizarPainel(
  lista
) {


  const comboios =
    prepararComboios(
      lista
    );


  if (
    comboios.length === 0
  ) {


    /*
      Se já temos dados no ecrã,
      NÃO apagamos o painel só
      porque uma atualização veio vazia.
    */


    if (
      !temDadosVisiveis
    ) {


      mostrarHora(
        null
      );


      desenharDotText(

        document.getElementById(
          "destinoAtual"
        ),

        "SEM PARTIDAS"

      );


    }


    return false;


  }



  /* COMBOIO ATUAL */


  const atual =
    comboios[0];


  mostrarHora(
    atual.hora
  );


  desenharDotText(

    document.getElementById(
      "destinoAtual"
    ),

    atual.destinoPainel

  );


  mostrarParagens(
    atual.destinoPainel
  );



  /* COMBOIO SEGUINTE */


  const seguinte =
    comboios[1];


  if (
    seguinte
  ) {


    document
      .getElementById(
        "proximoDestino"
      )
      .textContent =

        limitarProximoDestino(
          seguinte.destinoPainel
        );


    document
      .getElementById(
        "proximaHora"
      )
      .textContent =

        seguinte.hora ||

        "--:--";


  }

  else {


    document
      .getElementById(
        "proximoDestino"
      )
      .textContent =
        "----";


    document
      .getElementById(
        "proximaHora"
      )
      .textContent =
        "--:--";


  }


  temDadosVisiveis =
    true;


  return true;

}



/* ==================================================
   CACHE LOCAL
================================================== */

function carregarCacheLocal() {


  try {


    const bruto =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!bruto) {

      return false;

    }


    const cache =
      JSON.parse(
        bruto
      );


    if (

      !cache ||

      !Array.isArray(
        cache.lista
      ) ||

      !cache.guardadoEm

    ) {


      return false;


    }


    const idade =
      Date.now() -
      cache.guardadoEm;


    if (
      idade >
      CACHE_MAX_AGE
    ) {


      return false;


    }


    return atualizarPainel(
      cache.lista
    );


  }

  catch (
    erro
  ) {


    return false;


  }

}



function guardarCacheLocal(
  lista
) {


  try {


    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify({

        guardadoEm:
          Date.now(),

        lista:
          lista

      })

    );


  }

  catch (
    erro
  ) {

  }

}



/* ==================================================
   OBTER LISTA DA RESPOSTA
================================================== */

function obterLista(
  dados
) {


  if (
    Array.isArray(
      dados
    )
  ) {


    return dados;


  }


  if (

    dados &&

    Array.isArray(
      dados.partidas
    )

  ) {


    return dados.partidas;


  }


  return [];

}



/* ==================================================
   CARREGAR PARTIDAS

   Primeiro tenta:
   /api/partidas

   Se falhar ou vier vazio:
   /api/partidas-todas
================================================== */

async function carregarPartidas() {


  let encontrou =
    false;


  for (
    let i = 0;
    i < API_URLS.length;
    i++
  ) {


    try {


      const resposta =
        await fetch(

          API_URLS[i] +
          "?t=" +
          Date.now(),

          {
            cache:
              "no-store"
          }

        );


      if (
        !resposta.ok
      ) {


        continue;


      }


      const dados =
        await resposta.json();


      const lista =
        obterLista(
          dados
        );


      if (
        lista.length === 0
      ) {


        continue;


      }


      if (
        atualizarPainel(
          lista
        )
      ) {


        guardarCacheLocal(
          lista
        );


        encontrou =
          true;


        break;


      }


    }

    catch (
      erro
    ) {


      console.log(

        "Falha em " +
        API_URLS[i],

        erro

      );


    }


  }



  /*
    Só mostra SEM PARTIDAS se:

    - nenhuma API devolveu dados
    - não temos cache válida
    - ainda não existem dados visíveis
  */


  if (

    !encontrou &&

    !temDadosVisiveis

  ) {


    mostrarHora(
      null
    );


    desenharDotText(

      document.getElementById(
        "destinoAtual"
      ),

      "SEM PARTIDAS"

    );


    document
      .getElementById(
        "coluna1"
      )
      .innerHTML =
        "";


    document
      .getElementById(
        "coluna2"
      )
      .innerHTML =
        "";


    document
      .getElementById(
        "proximoDestino"
      )
      .textContent =
        "----";


    document
      .getElementById(
        "proximaHora"
      )
      .textContent =
        "--:--";


  }

}



/* ==================================================
   ARRANQUE
================================================== */

carregarCacheLocal();


if (
  !temDadosVisiveis
) {


  mostrarHora(
    null
  );


  desenharDotText(

    document.getElementById(
      "destinoAtual"
    ),

    "A CARREGAR"

  );


}


carregarPartidas();


setInterval(

  carregarPartidas,

  REFRESH_INTERVAL

);

</script>
