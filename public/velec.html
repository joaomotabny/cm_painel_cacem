<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Painel VELEC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }


    /* ==================================================
       PAINEL
       ================================================== */

    .panel {
      position: relative;

      width: min(98vw, 1500px);
      aspect-ratio: 2.65 / 1;

      background:
        linear-gradient(
          145deg,
          #16202a,
          #0c1117 55%,
          #18212a
        );

      border: 2px solid #29343c;
      border-radius: 8px;

      box-shadow:
        0 30px 90px rgba(0,0,0,.9),
        inset 0 0 30px rgba(255,255,255,.025);

      padding: 4.8% 5.5% 5.5%;
    }


    /* ==================================================
       SUPORTES
       ================================================== */

    .mount {
      position: absolute;

      top: -14%;

      width: 5%;
      height: 15%;

      background:
        linear-gradient(
          90deg,
          #090b0d,
          #333b41,
          #090b0d
        );

      border-radius: 8px 8px 0 0;
    }

    .mount.left {
      left: 23%;
    }

    .mount.center {
      left: 48%;

      background:
        linear-gradient(
          90deg,
          #777,
          #d0cbc0,
          #888
        );
    }

    .mount.right {
      right: 18%;
    }


    /* ==================================================
       ECRÃS
       ================================================== */

    .screens {
      width: 100%;
      height: 100%;

      display: grid;

      grid-template-columns:
        64% 32%;

      gap: 4%;
    }


    /* ==================================================
       PAINEL ESQUERDO
       ================================================== */

    .left-display {
      position: relative;

      overflow: hidden;

      border: 8px solid #070a0b;

      border-radius: 5px;

      background:
        linear-gradient(
          180deg,
          #334a49 0%,
          #20312f 30%,
          #111c1a 100%
        );

      box-shadow:
        inset 0 0 35px rgba(0,0,0,.85),
        inset 0 0 8px rgba(255,255,255,.15);
    }


    .left-display::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 20;

      background:
        linear-gradient(
          110deg,
          transparent 35%,
          rgba(255,255,255,.08) 48%,
          transparent 58%
        );
    }


    /* ==================================================
       LABELS
       ================================================== */

    .hora-label,
    .destino-label {
      position: absolute;

      left: 7%;

      color: #dfdeb3;

      font-size:
        clamp(18px, 3vw, 54px);

      font-weight: 700;

      letter-spacing: .02em;
    }

    .hora-label {
      top: 8%;
    }

    .destino-label {
      top: 48%;
    }


    /* ==================================================
       HORA FLIPDOT
       ================================================== */

    .hora {
      position: absolute;

      left: 7%;
      top: 23%;

      height: 22%;

      display: flex;

      align-items: center;

      gap: 1.5%;
    }


    .flip-group {
      display: flex;

      align-items: center;

      gap: .06em;
    }


    /*
       Cada carácter é um módulo independente.
    */

    .flip-char {
      position: relative;

      display: inline-flex;

      justify-content: center;
      align-items: center;

      width: .72em;
      height: 1em;

      overflow: hidden;

      border:
        1px solid rgba(0,0,0,.85);

      border-radius:
        .06em;

      background:
        radial-gradient(
          circle,
          rgba(55,62,50,.65) 0 14%,
          transparent 16%
        );

      background-size:
        .14em .14em;

      background-color:
        #111711;

      box-shadow:
        inset 0 0 .08em #000,
        0 .03em .05em rgba(0,0,0,.8);

      font-family:
        "VT323",
        monospace;

      font-size:
        clamp(43px, 6vw, 100px);

      line-height: 1;
    }


    /*
       O carácter iluminado também é feito de pontos.
    */

    .flip-char .lit {
      position: relative;

      z-index: 2;

      color: transparent;

      background:
        radial-gradient(
          circle,
          #ffea19 0 35%,
          #d6bf00 38% 52%,
          transparent 55%
        );

      background-size:
        .13em .13em;

      -webkit-background-clip: text;
      background-clip: text;

      filter:
        drop-shadow(
          0 0 2px rgba(255,225,0,.35)
        );
    }


    .hora .h {
      color: #dbd8b6;

      font-size:
        clamp(21px, 2.8vw, 47px);

      margin:
        0 .12em;

      font-family:
        Arial,
        sans-serif;

      font-weight:
        400;
    }


    /* ==================================================
       DESTINO FLIPDOT
       ================================================== */

    .destino {
      position: absolute;

      left: 7%;
      right: 25%;

      bottom: 9%;

      display: flex;

      align-items: center;

      height: 23%;

      overflow: hidden;
    }


    .destino .flip-group {
      width: 100%;

      gap: .025em;
    }


    .destino .flip-char {
      flex:
        1 1 0;

      min-width:
        0;

      max-width:
        .76em;

      font-size:
        clamp(27px, 4.2vw, 71px);
    }


    /*
       Para espaços também mostramos
       um módulo apagado.
    */

    .flip-char.space .lit {
      visibility: hidden;
    }


    /* ==================================================
       VIA
       ================================================== */

    .via {
      position: absolute;

      right: 5%;
      top: 12%;

      width: 20%;

      aspect-ratio:
        1 / 1;

      border:
        clamp(3px, .5vw, 8px)
        solid #d9f343;

      border-radius:
        8%;

      display: flex;

      justify-content: center;
      align-items: center;

      color: #d9f343;

      font-family:
        Arial,
        sans-serif;

      font-weight:
        500;

      font-size:
        clamp(55px, 10vw, 170px);

      line-height:
        1;

      text-shadow:
        0 0 12px
        rgba(200,255,50,.35);

      box-shadow:
        inset 0 0 15px rgba(190,255,50,.07),
        0 0 6px rgba(190,255,50,.15);
    }


    /* ==================================================
       CRT DIREITO
       ================================================== */

    .crt-frame {
      position: relative;

      background:
        #050606;

      border-radius:
        6px;

      padding:
        5%;

      box-shadow:
        inset 0 0 18px #000;
    }


    .crt {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius:
        10%;

      padding:
        7% 8% 5%;

      background:
        radial-gradient(
          ellipse at center,
          #17301c 0%,
          #0c2011 55%,
          #030904 100%
        );

      color:
        #c9ef35;

      font-family:
        "VT323",
        monospace;

      box-shadow:
        inset 0 0 30px rgba(0,0,0,.95),
        inset 0 0 60px rgba(0,0,0,.6);
    }


    .crt::before {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 5;

      background:
        radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0,0,0,.18) 78%,
          rgba(0,0,0,.5) 100%
        );
    }


    .crt::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 6;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.03) 0px,
          rgba(255,255,255,.03) 1px,
          transparent 1px,
          transparent 3px
        );

      opacity:
        .45;
    }


    /* ==================================================
       PARAGENS
       ================================================== */

    .stops {
      position: relative;

      z-index: 2;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      column-gap:
        8%;

      height:
        75%;
    }


    .stop-column {
      display: flex;

      flex-direction: column;

      gap: 0;
    }


    .stop {
      height: 10%;

      white-space:
        nowrap;

      overflow:
        hidden;

      font-size:
        clamp(14px, 1.55vw, 31px);

      line-height:
        1;

      text-shadow:
        0 0 4px
        rgba(200,239,53,.28);
    }


    /* ==================================================
       COMBOIO SEGUINTE
       ================================================== */

    .next-train {
      position: absolute;

      z-index: 3;

      left: 8%;
      right: 8%;
      bottom: 7%;

      display: grid;

      grid-template-columns:
        auto 1fr auto;

      align-items:
        baseline;

      column-gap:
        5%;
    }


    .next-label {
      font-size:
        clamp(9px, .8vw, 17px);

      white-space:
        nowrap;

      letter-spacing:
        .02em;
    }


    .next-destination,
    .next-time {
      font-size:
        clamp(19px, 2vw, 39px);

      white-space:
        nowrap;

      line-height:
        1;
    }


    .next-destination {
      text-align:
        left;
    }

    .next-time {
      text-align:
        right;
    }


    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 700px) {

      .panel {
        width: 100vw;

        border-radius:
          0;

        padding-left:
          2%;

        padding-right:
          2%;
      }


      .screens {
        grid-template-columns:
          64% 34%;

        gap:
          2%;
      }


      .left-display {
        border-width:
          3px;
      }


      .crt-frame {
        padding:
          3%;
      }


      .stop {
        font-size:
          clamp(7px, 2.1vw, 15px);
      }


      .next-label {
        font-size:
          clamp(5px, 1.1vw, 9px);
      }


      .next-destination,
      .next-time {
        font-size:
          clamp(9px, 2.5vw, 18px);
      }


      .destino .flip-char {
        font-size:
          clamp(14px, 4vw, 28px);
      }


      .hora .flip-char {
        font-size:
          clamp(23px, 6vw, 42px);
      }


      .hora .h {
        font-size:
          clamp(12px, 3vw, 22px);
      }
    }

  </style>
</head>


<body>

<div class="panel">

  <div class="mount left"></div>

  <div class="mount center"></div>

  <div class="mount right"></div>


  <div class="screens">


    <!-- ==================================================
         PAINEL ESQUERDO
         ================================================== -->

    <section class="left-display">

      <div class="hora-label">
        HORA
      </div>


      <div class="hora">

        <div
          class="flip-group"
          id="horaHoras"
        ></div>

        <span class="h">
          h
        </span>

        <div
          class="flip-group"
          id="horaMinutos"
        ></div>

      </div>


      <div class="destino-label">
        DESTINO
      </div>


      <div class="destino">

        <div
          class="flip-group"
          id="destinoAtual"
        ></div>

      </div>


      <div class="via">
        3
      </div>

    </section>



    <!-- ==================================================
         CRT
         ================================================== -->

    <section class="crt-frame">

      <div class="crt">

        <div class="stops">

          <div
            class="stop-column"
            id="coluna1"
          ></div>

          <div
            class="stop-column"
            id="coluna2"
          ></div>

        </div>


        <div class="next-train">

          <div class="next-label">
            COMB.SEGUINTE
          </div>


          <div
            class="next-destination"
            id="proximoDestino"
          >
            ----
          </div>


          <div
            class="next-time"
            id="proximaHora"
          >
            --:--
          </div>

        </div>

      </div>

    </section>

  </div>

</div>


<script>

  const API_URL =
    "https://cmpainelcacem.vercel.app/api/partidas";


  const REFRESH_INTERVAL =
    30000;



  /* ==================================================
     PARAGENS
     ================================================== */

  const PARAGENS = {

    "LISBOA-ORIENTE": [

      "MASSAMA",
      "MONTE ABRAÃO",
      "QUELUZ BELAS",
      "AMADORA",
      "REBOLEIRA",
      "S.CR-DAMAIA",

      "BENFICA",
      "SETE RIOS",
      "ENTRECAMPOS",
      "ROMA-AREEIRO",
      "BRAÇO PRATA"

    ],


    "ALVERCA": [

      "MASSAMA",
      "MONTE ABRAÃO",
      "QUELUZ BELAS",
      "AMADORA",
      "REBOLEIRA",
      "S.CR-DAMAIA",

      "BENFICA",
      "SETE RIOS",
      "ENTRECAMPOS",
      "ROMA-AREEIRO",
      "BRAÇO PRATA",

      "LISBOA-ORIENTE",
      "MOSCAVIDE",
      "SACAVEM",
      "BOBADELA",
      "S.IRIA",
      "PÓVOA"

    ],


    "LISBOA-S.A": [

      "SETE RIOS",
      "ENTRECAMPOS"

    ]

  };



  /* ==================================================
     NORMALIZAR DESTINO
     ================================================== */

  function normalizarDestino(
    destino
  ) {

    if (!destino) {
      return "";
    }


    const texto =
      String(destino)
        .toUpperCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .trim();


    if (
      texto.includes(
        "ORIENTE"
      )
    ) {

      return "LISBOA-ORIENTE";

    }


    if (
      texto.includes(
        "ALVERCA"
      )
    ) {

      return "ALVERCA";

    }


    if (
      texto.includes(
        "SANTA APOLONIA"
      )

      ||

      texto.includes(
        "S.APOLONIA"
      )

      ||

      texto.includes(
        "S. APOLONIA"
      )

      ||

      texto.includes(
        "LISBOA-S.A"
      )
    ) {

      return "LISBOA-S.A";

    }


    return "";

  }



  /* ==================================================
     FLIPDOT
     ================================================== */

  function desenharFlipdot(
    elemento,
    texto
  ) {

    elemento.innerHTML =
      "";


    texto =
      String(texto)
        .toUpperCase();


    for (
      const caracter of texto
    ) {

      const modulo =
        document.createElement(
          "span"
        );


      modulo.className =
        "flip-char";


      if (
        caracter === " "
      ) {

        modulo.classList.add(
          "space"
        );

      }


      const aceso =
        document.createElement(
          "span"
        );


      aceso.className =
        "lit";


      aceso.textContent =
        caracter === " "
          ? " "
          : caracter;


      modulo.appendChild(
        aceso
      );


      elemento.appendChild(
        modulo
      );

    }

  }



  /* ==================================================
     HORA
     ================================================== */

  function mostrarHora(
    hora
  ) {

    const horas =
      document.getElementById(
        "horaHoras"
      );


    const minutos =
      document.getElementById(
        "horaMinutos"
      );


    if (!hora) {

      desenharFlipdot(
        horas,
        "--"
      );


      desenharFlipdot(
        minutos,
        "--"
      );


      return;

    }


    const partes =
      String(hora)
        .trim()
        .split(":");


    desenharFlipdot(
      horas,
      partes[0] || "--"
    );


    desenharFlipdot(
      minutos,
      partes[1] || "--"
    );

  }



  /* ==================================================
     LIMITE CRT
     ================================================== */

  function limitarCRT(
    texto
  ) {

    return String(texto)
      .toUpperCase()
      .slice(
        0,
        10
      );

  }



  /* ==================================================
     PARAGENS
     ================================================== */

  function mostrarParagens(
    destino
  ) {

    const lista =
      PARAGENS[destino] || [];


    const coluna1 =
      document.getElementById(
        "coluna1"
      );


    const coluna2 =
      document.getElementById(
        "coluna2"
      );


    coluna1.innerHTML =
      "";


    coluna2.innerHTML =
      "";


    const corte =
      Math.ceil(
        lista.length / 2
      );


    const esquerda =
      lista.slice(
        0,
        corte
      );


    const direita =
      lista.slice(
        corte
      );


    esquerda.forEach(
      paragem => {

        const linha =
          document.createElement(
            "div"
          );


        linha.className =
          "stop";


        linha.textContent =
          limitarCRT(
            paragem
          );


        coluna1.appendChild(
          linha
        );

      }
    );


    direita.forEach(
      paragem => {

        const linha =
          document.createElement(
            "div"
          );


        linha.className =
          "stop";


        linha.textContent =
          limitarCRT(
            paragem
          );


        coluna2.appendChild(
          linha
        );

      }
    );

  }



  /* ==================================================
     ATUALIZAR PAINEL
     ================================================== */

  function atualizarPainel(
    lista
  ) {

    const comboios =
      lista

        .map(
          comboio => {

            const destino =
              normalizarDestino(

                comboio.destino

                ||

                comboio.destination

                ||

                comboio.destinoOriginal

              );


            return {

              ...comboio,

              destinoPainel:
                destino

            };

          }
        )

        .filter(
          comboio =>
            comboio.destinoPainel
        );


    if (
      comboios.length === 0
    ) {

      mostrarHora(
        null
      );


      desenharFlipdot(

        document.getElementById(
          "destinoAtual"
        ),

        "SEM PARTIDAS"

      );


      document
        .getElementById(
          "coluna1"
        )
        .innerHTML =
          "";


      document
        .getElementById(
          "coluna2"
        )
        .innerHTML =
          "";


      document
        .getElementById(
          "proximoDestino"
        )
        .textContent =
          "----";


      document
        .getElementById(
          "proximaHora"
        )
        .textContent =
          "--:--";


      return;

    }



    /* ==================================================
       COMBOIO ATUAL
       ================================================== */

    const atual =
      comboios[0];


    mostrarHora(
      atual.hora
    );


    desenharFlipdot(

      document.getElementById(
        "destinoAtual"
      ),

      atual.destinoPainel

    );


    mostrarParagens(
      atual.destinoPainel
    );



    /* ==================================================
       COMBOIO SEGUINTE
       ================================================== */

    const seguinte =
      comboios[1];


    if (
      seguinte
    ) {

      document
        .getElementById(
          "proximoDestino"
        )
        .textContent =
          seguinte.destinoPainel;


      document
        .getElementById(
          "proximaHora"
        )
        .textContent =
          seguinte.hora ||
          "--:--";

    }

    else {

      document
        .getElementById(
          "proximoDestino"
        )
        .textContent =
          "----";


      document
        .getElementById(
          "proximaHora"
        )
        .textContent =
          "--:--";

    }

  }



  /* ==================================================
     API
     ================================================== */

  async function carregarPartidas() {

    try {

      const resposta =
        await fetch(

          API_URL +
          "?t=" +
          Date.now(),

          {
            method:
              "GET",

            cache:
              "no-store",

            headers: {

              "Accept":
                "application/json"

            }
          }

        );


      if (
        !resposta.ok
      ) {

        throw new Error(
          "HTTP " +
          resposta.status
        );

      }


      const dados =
        await resposta.json();


      let lista =
        [];


      if (
        Array.isArray(
          dados
        )
      ) {

        lista =
          dados;

      }


      else if (
        Array.isArray(
          dados.partidas
        )
      ) {

        lista =
          dados.partidas;

      }


      else if (
        Array.isArray(
          dados.data
        )
      ) {

        lista =
          dados.data;

      }


      else if (
        Array.isArray(
          dados.results
        )
      ) {

        lista =
          dados.results;

      }


      atualizarPainel(
        lista
      );

    }


    catch (
      erro
    ) {

      console.error(
        "ERRO API:",
        erro
      );


      mostrarHora(
        null
      );


      desenharFlipdot(

        document.getElementById(
          "destinoAtual"
        ),

        "SEM LIGACAO"

      );

    }

  }



  /* ==================================================
     ARRANQUE
     ================================================== */

  mostrarHora(
    null
  );


  desenharFlipdot(

    document.getElementById(
      "destinoAtual"
    ),

    "----------"

  );


  carregarPartidas();


  setInterval(

    carregarPartidas,

    REFRESH_INTERVAL

  );

</script>

</body>
</html>
