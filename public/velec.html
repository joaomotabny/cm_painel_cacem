<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Painel VELEC</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  background: #050505;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}


/* ==================================================
   PAINEL
   ================================================== */

.panel {
  position: relative;

  width: min(98vw, 1500px);
  aspect-ratio: 2.65 / 1;

  background:
    linear-gradient(
      145deg,
      #16202a,
      #0c1117 55%,
      #18212a
    );

  border: 2px solid #29343c;
  border-radius: 8px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.9),
    inset 0 0 30px rgba(255,255,255,.025);

  padding: 4.8% 5.5% 5.5%;
}


/* ==================================================
   SUPORTES
   ================================================== */

.mount {
  position: absolute;

  top: -14%;

  width: 5%;
  height: 15%;

  background:
    linear-gradient(
      90deg,
      #090b0d,
      #333b41,
      #090b0d
    );

  border-radius: 8px 8px 0 0;
}

.mount.left {
  left: 23%;
}

.mount.center {
  left: 48%;

  background:
    linear-gradient(
      90deg,
      #777,
      #d0cbc0,
      #888
    );
}

.mount.right {
  right: 18%;
}


/* ==================================================
   ECRÃS
   ================================================== */

.screens {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    64% 32%;

  gap: 4%;
}


/* ==================================================
   PAINEL ESQUERDO
   ================================================== */

.left-display {
  position: relative;

  overflow: hidden;

  border: 8px solid #070a0b;

  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      #334a49 0%,
      #20312f 30%,
      #111c1a 100%
    );

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.85),
    inset 0 0 8px rgba(255,255,255,.15);
}


.left-display::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  z-index: 20;

  background:
    linear-gradient(
      110deg,
      transparent 35%,
      rgba(255,255,255,.07) 48%,
      transparent 58%
    );
}


/* ==================================================
   LABELS
   ================================================== */

.hora-label,
.destino-label {
  position: absolute;

  left: 7%;

  color: #dfdeb3;

  font-size:
    clamp(18px, 3vw, 54px);

  font-weight: 700;

  letter-spacing: .02em;
}

.hora-label {
  top: 8%;
}

.destino-label {
  top: 48%;
}


/* ==================================================
   HORA
   ================================================== */

.hora {
  position: absolute;

  left: 7%;
  top: 23%;

  display: flex;

  align-items: center;

  gap: .5em;
}


.flip-group {
  display: flex;

  gap: .08em;
}


/* ==================================================
   MÓDULO FLIP-DOT LEVE
   ================================================== */

.flip-char {
  display: flex;

  align-items: center;
  justify-content: center;

  width: .72em;
  height: 1em;

  color: #f4df18;

  background:
    repeating-linear-gradient(
      to bottom,
      #151a15 0px,
      #151a15 4px,
      #0a0d0a 4px,
      #0a0d0a 6px
    );

  border:
    1px solid #050705;

  border-radius:
    .05em;

  box-shadow:
    inset 0 0 .08em #000,
    0 .035em .06em rgba(0,0,0,.8);

  font-family:
    "Courier New",
    monospace;

  font-weight:
    900;

  font-size:
    clamp(38px, 5.7vw, 94px);

  line-height: 1;

  text-shadow:
    0 0 3px rgba(255,225,20,.45);
}


.flip-char.space {
  color: transparent;
}


/* H */

.h-separator {
  color: #d8d4ae;

  font-size:
    clamp(20px, 2.7vw, 44px);

  font-weight:
    400;
}


/* ==================================================
   DESTINO
   ================================================== */

.destino {
  position: absolute;

  left: 7%;
  right: 25%;

  bottom: 9%;

  display: flex;

  align-items: center;

  overflow: hidden;
}


.destino .flip-group {
  width: 100%;

  gap: .025em;
}


.destino .flip-char {
  flex: 1 1 0;

  min-width: 0;

  max-width: .74em;

  font-size:
    clamp(25px, 4vw, 67px);
}


/* ==================================================
   VIA
   ================================================== */

.via {
  position: absolute;

  right: 5%;
  top: 12%;

  width: 20%;

  aspect-ratio:
    1 / 1;

  border:
    clamp(3px, .5vw, 8px)
    solid #d9f343;

  border-radius: 8%;

  display: flex;

  justify-content: center;
  align-items: center;

  color: #d9f343;

  font-family:
    Arial,
    sans-serif;

  font-weight: 500;

  font-size:
    clamp(55px, 10vw, 170px);

  line-height: 1;

  text-shadow:
    0 0 12px rgba(200,255,50,.35);

  box-shadow:
    inset 0 0 15px rgba(190,255,50,.07),
    0 0 6px rgba(190,255,50,.15);
}


/* ==================================================
   CRT
   ================================================== */

.crt-frame {
  position: relative;

  background: #050606;

  border-radius: 6px;

  padding: 5%;

  box-shadow:
    inset 0 0 18px #000;
}


.crt {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 10%;

  padding:
    7% 8% 5%;

  background:
    radial-gradient(
      ellipse at center,
      #17301c 0%,
      #0c2011 55%,
      #030904 100%
    );

  color: #c9ef35;

  font-family:
    "Courier New",
    monospace;

  font-weight: 700;

  box-shadow:
    inset 0 0 30px rgba(0,0,0,.95),
    inset 0 0 60px rgba(0,0,0,.6);
}


.crt::after {
  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 10;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    );

  opacity: .35;
}


/* ==================================================
   PARAGENS
   ================================================== */

.stops {
  position: relative;

  z-index: 2;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  column-gap: 8%;

  height: 75%;
}


.stop-column {
  display: flex;

  flex-direction: column;

  gap: 0;
}


.stop {
  height: 10%;

  white-space: nowrap;

  overflow: hidden;

  font-size:
    clamp(11px, 1.25vw, 24px);

  line-height: 1;

  text-shadow:
    0 0 3px rgba(200,239,53,.25);
}


/* ==================================================
   COMBOIO SEGUINTE
   ================================================== */

.next-train {
  position: absolute;

  z-index: 3;

  left: 8%;
  right: 8%;

  bottom: 7%;

  display: grid;

  grid-template-columns:
    auto 1fr auto;

  align-items: baseline;

  column-gap: 5%;
}


.next-label {
  font-size:
    clamp(7px, .65vw, 13px);

  white-space: nowrap;

  font-weight: 700;
}


.next-destination,
.next-time {
  font-size:
    clamp(15px, 1.6vw, 31px);

  white-space: nowrap;

  line-height: 1;
}


.next-destination {
  text-align: left;
}


.next-time {
  text-align: right;
}


/* ==================================================
   MOBILE
   ================================================== */

@media (max-width: 700px) {

  .panel {
    width: 100vw;

    border-radius: 0;

    padding-left: 2%;
    padding-right: 2%;
  }


  .screens {
    grid-template-columns:
      64% 34%;

    gap: 2%;
  }


  .left-display {
    border-width: 3px;
  }


  .crt-frame {
    padding: 3%;
  }


  .hora {
    gap: .25em;
  }


  .flip-char {
    font-size:
      clamp(20px, 5.7vw, 40px);
  }


  .h-separator {
    font-size:
      clamp(11px, 2.8vw, 20px);
  }


  .destino .flip-char {
    font-size:
      clamp(13px, 3.8vw, 27px);
  }


  .stop {
    font-size:
      clamp(5px, 1.45vw, 11px);
  }


  .next-label {
    font-size:
      clamp(4px, .8vw, 7px);
  }


  .next-destination,
  .next-time {
    font-size:
      clamp(7px, 1.7vw, 13px);
  }

}

</style>
</head>


<body>


<div class="panel">

  <div class="mount left"></div>

  <div class="mount center"></div>

  <div class="mount right"></div>


  <div class="screens">


    <!-- ESQUERDA -->

    <section class
