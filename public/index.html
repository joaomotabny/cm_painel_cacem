<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black"
>

<meta
  name="theme-color"
  content="#020803"
>

<title>Partidas — Agualva-Cacém</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
  rel="stylesheet"
>


<style>

/* ==================================================
   RESET
================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #020302;

}


body {

  display: flex;

  align-items: center;
  justify-content: center;

  font-family:
    "VT323",
    monospace;

}



/* ==================================================
   MONITOR
================================================== */

.monitor {

  position: relative;

  width:
    min(98vw, 1200px);

  height:
    min(94vh, 760px);

  padding:
    clamp(10px, 2vw, 26px);

  background:
    linear-gradient(
      145deg,
      #151b18 0%,
      #080b09 45%,
      #030403 100%
    );

  border:
    2px solid #262d29;

  border-radius:
    clamp(12px, 2vw, 28px);

  box-shadow:

    0 35px 110px
    rgba(0,0,0,.95),

    inset 0 0 30px
    rgba(255,255,255,.035);

}



/* ==================================================
   CRT
================================================== */

.crt {

  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius:
    7% / 10%;

  padding:
    5% 7% 4%;

  color:
    #c9ef35;

  background:

    radial-gradient(
      ellipse at center,
      #16361d 0%,
      #0b2512 52%,
      #020803 100%
    );

  box-shadow:

    inset 0 0 45px
    rgba(0,0,0,.92),

    inset 0 0 110px
    rgba(0,0,0,.75);

}



/* ==================================================
   VINHETA
================================================== */

.crt::before {

  content: "";

  position: absolute;
  inset: 0;

  z-index: 20;

  pointer-events: none;

  background:

    radial-gradient(
      ellipse at center,

      transparent 42%,

      rgba(0,0,0,.10) 65%,

      rgba(0,0,0,.60) 100%
    );

}



/* ==================================================
   SCANLINES
================================================== */

.crt::after {

  content: "";

  position: absolute;
  inset: 0;

  z-index: 30;

  pointer-events: none;

  opacity: .44;

  background:

    repeating-linear-gradient(

      to bottom,

      rgba(255,255,255,.025)
      0,

      rgba(255,255,255,.025)
      1px,

      transparent
      1px,

      transparent
      4px

    );

}



/* ==================================================
   CONTEÚDO
================================================== */

.content {

  position: relative;

  z-index: 5;

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

}



/* ==================================================
   ESTAÇÃO
================================================== */

.station {

  text-align: center;

  font-size:
    clamp(24px, 4vw, 60px);

  line-height: .88;

  letter-spacing:
    .035em;

  text-shadow:
    0 0 7px
    rgba(200,239,53,.42);

}



/* ==================================================
   PARTIDAS
================================================== */

.title {

  margin-top:
    clamp(3px, .6vh, 8px);

  text-align: center;

  font-size:
    clamp(15px, 2.3vw, 34px);

  line-height: 1;

  letter-spacing:
    .18em;

}



/* ==================================================
   CABEÇALHO
================================================== */

.header {

  display: grid;

  grid-template-columns:
    20% 64% 16%;

  align-items: center;

  margin-top:
    clamp(10px, 1.8vh, 20px);

  padding-bottom:
    clamp(3px, .5vh, 6px);

  border-bottom:
    1px solid
    rgba(201,239,53,.42);

  font-size:
    clamp(14px, 2vw, 29px);

  line-height: 1;

}


.header .via {

  text-align: right;

}



/* ==================================================
   LISTA
================================================== */

.departures {

  flex: 1;

  display: flex;

  flex-direction: column;

  min-height: 0;

}



/* ==================================================
   PARTIDA
================================================== */

.departure {

  display: grid;

  grid-template-columns:
    20% 64% 16%;

  align-items: center;

  flex:
    1 1 0;

  min-height: 0;

  font-size:
    clamp(21px, 3.25vw, 50px);

  line-height: .84;

  letter-spacing:
    .01em;

  text-shadow:
    0 0 6px
    rgba(200,239,53,.36);

}


.departure .time {

  white-space: nowrap;

}


.departure .destination {

  white-space: nowrap;

  overflow: hidden;

  text-overflow: clip;

}


.departure .platform {

  text-align: right;

  white-space: nowrap;

}



/* ==================================================
   RODAPÉ
================================================== */

.footer {

  height:
    clamp(11px, 1.7vh, 20px);

  margin-top:
    clamp(2px, .4vh, 5px);

  text-align: right;

  font-size:
    clamp(7px, .9vw, 12px);

  line-height: 1;

  opacity: .56;

}



/* ==================================================
   FLICKER CRT
================================================== */

@keyframes flicker {

  0% {
    opacity: 1;
  }

  96% {
    opacity: 1;
  }

  97% {
    opacity: .992;
  }

  98% {
    opacity: 1;
  }

  99% {
    opacity: .986;
  }

  100% {
    opacity: 1;
  }

}


.crt {

  animation:
    flicker 7s infinite;

}



/* ==================================================
   IPHONE LANDSCAPE
================================================== */

@media
(max-height: 500px)
and
(orientation: landscape) {

  .monitor {

    width: 100vw;
    height: 100vh;

    padding:
      7px 10px;

    border: 0;

    border-radius: 0;

  }


  .crt {

    padding:
      3.5% 6% 3%;

    border-radius:
      6% / 13%;

  }


  .station {

    font-size:
      clamp(20px, 4.2vw, 36px);

  }


  .title {

    margin-top: 1px;

    font-size:
      clamp(12px, 2.3vw, 19px);

  }


  .header {

    margin-top: 5px;

    padding-bottom: 2px;

    font-size:
      clamp(10px, 1.8vw, 16px);

  }


  .departure {

    font-size:
      clamp(17px, 3.05vw, 27px);

  }


  .footer {

    height: 8px;

    margin-top: 1px;

    font-size: 6px;

  }

}



/* ==================================================
   IPHONE PORTRAIT
================================================== */

@media
(max-width: 700px)
and
(orientation: portrait) {

  .monitor {

    width: 96vw;
    height: 80vh;

    padding: 10px;

  }


  .crt {

    padding:
      9% 8% 7%;

  }


  .header,
  .departure {

    grid-template-columns:
      23% 61% 16%;

  }


  .departure {

    font-size:
      clamp(20px, 6vw, 34px);

  }

}

</style>

</head>



<body>


<div class="monitor">


  <div class="crt">


    <div class="content">


      <div class="station">
        AGUALVA-CACÉM
      </div>


      <div class="title">
        PARTIDAS
      </div>


      <div class="header">


        <div>
          HORA
        </div>


        <div>
          DESTINO
        </div>


        <div class="via">
          VIA
        </div>


      </div>


      <div
        class="departures"
        id="departures"
      >
      </div>


      <div
        class="footer"
        id="footer"
      >
        A ACTUALIZAR
      </div>


    </div>


  </div>


</div>



<script>

/* ==================================================
   CONFIGURAÇÃO
================================================== */

const API_URL =
  "/api/partidas-todas";


const REFRESH_INTERVAL =
  30000;


const CACHE_KEY =
  "crt-partidas-agualva-v2";


const CACHE_MAX_AGE =
  5 * 60 * 1000;



/* ==================================================
   NÚMERO DE PARTIDAS
================================================== */

function numeroLinhas() {

  /*
    iPhone deitado:
    8 partidas.

    Ecrãs maiores:
    10 partidas.
  */

  if (
    window.innerHeight < 500 &&
    window.innerWidth > window.innerHeight
  ) {

    return 8;

  }


  return 10;

}



/* ==================================================
   NORMALIZAR DESTINO
   Segurança extra caso a API devolva
   o nome completo.
================================================== */

function normalizarDestino(
  destino
) {

  if (!destino) {
    return "--------";
  }


  const texto =
    String(destino)
      .toUpperCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .trim();


  if (
    texto.includes("ROSSIO")
  ) {

    return "LIS-ROSSIO";

  }


  if (
    texto.includes("ORIENTE")
  ) {

    return "LIS-ORIENTE";

  }


  if (
    texto.includes("SANTA APOLONIA") ||
    texto.includes("S.APOLONIA") ||
    texto.includes("S. APOLONIA")
  ) {

    return "LIS-S.APOL";

  }


  if (
    texto.includes("MELECAS")
  ) {

    return "MELEÇAS";

  }


  if (
    texto.includes("SINTRA")
  ) {

    return "SINTRA";

  }


  if (
    texto.includes("ALVERCA")
  ) {

    return "ALVERCA";

  }


  if (
    texto.includes("CALDAS")
  ) {

    return "CALDAS RAINHA";

  }


  /*
    Se a API já devolveu a abreviatura
    correta, mantém como está.
  */

  return String(destino)
    .toUpperCase();

}



/* ==================================================
   VIA
================================================== */

function obterVia(
  partida
) {

  /*
    Se a API já enviar a via,
    usamos esse valor.
  */

  if (
    partida.via !== undefined &&
    partida.via !== null &&
    String(partida.via).trim() !== ""
  ) {

    return String(
      partida.via
    );

  }


  /*
    Fallback baseado no destino.
  */

  const destino =
    normalizarDestino(
      partida.destino ||
      partida.destinoOriginal
    );


  const vias = {

    "SINTRA": "2",

    "MELEÇAS": "1",

    "LIS-ORIENTE": "3",

    "ALVERCA": "3",

    "LIS-ROSSIO": "4",

    "LIS-S.APOL": "3",

    "CALDAS RAINHA": "1"

  };


  return vias[destino] || "-";

}



/* ==================================================
   MOSTRAR PARTIDAS
================================================== */

function mostrarPartidas(
  lista
) {

  const container =
    document.getElementById(
      "departures"
    );


  container.innerHTML =
    "";


  const limite =
    numeroLinhas();


  const partidas =
    lista.slice(
      0,
      limite
    );


  partidas.forEach(
    partida => {


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "departure";



      /* HORA */

      const hora =
        document.createElement(
          "div"
        );


      hora.className =
        "time";


      hora.textContent =
        partida.hora ||
        "--:--";



      /* DESTINO */

      const destino =
        document.createElement(
          "div"
        );


      destino.className =
        "destination";


      destino.textContent =
        normalizarDestino(
          partida.destino ||
          partida.destinoOriginal
        );



      /* VIA */

      const via =
        document.createElement(
          "div"
        );


      via.className =
        "platform";


      via.textContent =
        obterVia(
          partida
        );



      linha.appendChild(
        hora
      );


      linha.appendChild(
        destino
      );


      linha.appendChild(
        via
      );


      container.appendChild(
        linha
      );

    }
  );



  /*
    Mantém sempre o mesmo número
    visual de linhas.
  */

  for (
    let i = partidas.length;
    i < limite;
    i++
  ) {


    const linha =
      document.createElement(
        "div"
      );


    linha.className =
      "departure";


    linha.innerHTML =
      `
        <div></div>
        <div></div>
        <div></div>
      `;


    container.appendChild(
      linha
    );

  }

}



/* ==================================================
   CACHE
================================================== */

function guardarCache(
  lista
) {

  try {


    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify({

        guardadoEm:
          Date.now(),

        lista:
          lista

      })

    );


  }

  catch (
    erro
  ) {

  }

}



function carregarCache() {

  try {


    const bruto =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!bruto) {

      return false;

    }


    const cache =
      JSON.parse(
        bruto
      );


    if (
      !cache ||
      !Array.isArray(
        cache.lista
      ) ||
      !cache.guardadoEm
    ) {

      return false;

    }


    const idade =
      Date.now() -
      cache.guardadoEm;


    if (
      idade >
      CACHE_MAX_AGE
    ) {

      return false;

    }


    mostrarPartidas(
      cache.lista
    );


    return true;


  }

  catch (
    erro
  ) {


    return false;

  }

}



/* ==================================================
   CARREGAR API
================================================== */

async function carregarPartidas() {

  const footer =
    document.getElementById(
      "footer"
    );


  try {


    const response =
      await fetch(
        API_URL,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {


      throw new Error(
        "HTTP " +
        response.status
      );


    }


    const dados =
      await response.json();


    const lista =
      Array.isArray(
        dados
      )

      ? dados

      : (

        Array.isArray(
          dados.partidas
        )

        ? dados.partidas

        : []

      );


    if (
      lista.length > 0
    ) {


      mostrarPartidas(
        lista
      );


      guardarCache(
        lista
      );


      footer.textContent =
        "INFORMAÇÃO EM TEMPO REAL";


    }


    else {


      footer.textContent =
        "SEM PARTIDAS";


    }


  }

  catch (
    erro
  ) {


    console.error(
      "Erro:",
      erro
    );


    footer.textContent =
      "LIGAÇÃO TEMPORARIAMENTE INDISPONÍVEL";


  }

}



/* ==================================================
   ARRANQUE
================================================== */

const temCache =
  carregarCache();


if (
  !temCache
) {

  mostrarPartidas(
    []
  );

}


carregarPartidas();


setInterval(
  carregarPartidas,
  REFRESH_INTERVAL
);



/*
  Se rodarmos o iPhone,
  recalcula o número de linhas.
*/

window.addEventListener(
  "resize",
  function () {

    carregarPartidas();

  }
);

</script>


</body>
</html>
