<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --cp-green: #ccff00; /* Verde limão típico dos painéis da CP */
            --glow: 0 0 12px rgba(204, 255, 0, 0.6);
        }

        body { 
            background-color: #050505; color: var(--cp-green); font-family: 'VT323', monospace; 
            margin: 0; padding: 20px; display: flex; height: 100vh; box-sizing: border-box;
            gap: 20px; text-transform: uppercase;
        }

        /* PAINEL PRINCIPAL (ESQUERDA) */
        .main-panel {
            flex: 2; border: 4px solid #1a1a1a; background: #000;
            padding: 20px; display: flex; flex-direction: column; justify-content: center;
        }

        .label { font-size: 30px; color: #444; margin-bottom: -10px; text-shadow: none; }
        
        #dep-time { font-size: 140px; line-height: 1; text-shadow: var(--glow); margin-bottom: 20px; }
        
        #dep-dest { font-size: 80px; line-height: 1; text-shadow: var(--glow); white-space: nowrap; overflow: hidden; }

        /* MONITOR DE PARAGENS (DIREITA) */
        .stops-monitor {
            flex: 1; background: #080808; border: 15px solid #1a1a1a;
            border-radius: 10px; padding: 15px; display: flex; flex-direction: column;
            box-shadow: inset 0 0 50px #000;
        }

        .monitor-header { font-size: 24px; border-bottom: 2px solid var(--cp-green); padding-bottom: 5px; margin-bottom: 10px; }

        .stop-list { font-size: 28px; line-height: 1.4; list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        
        .stop-item { border-left: 3px solid var(--cp-green); padding-left: 10px; margin-bottom: 5px; opacity: 0.8; }
        
        .next-train-info { 
            background: var(--cp-green); color: #000; font-weight: bold; 
            padding: 5px; font-size: 22px; text-align: center; margin-top: auto;
        }

        /* LINHA A CORRER EM BAIXO */
        .footer-marquee {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #000;
            border-top: 1px solid #222; height: 40px; line-height: 40px; font-size: 25px;
        }
    </style>
</head>
<body>

    <div class="main-panel">
        <div class="label">HORA</div>
        <div id="dep-time">--:--</div>
        <div class="label">DESTINO</div>
        <div id="dep-dest">Aproximação...</div>
    </div>

    <div class="stops-monitor">
        <div class="monitor-header">PARAGENS / STOPS</div>
        <ul class="stop-list" id="stop-list">
            <li class="stop-item">A carregar percurso...</li>
        </ul>
        <div class="next-train-info" id="next-info">PRÓXIMO: -- MIN</div>
    </div>

    <script>
        async function updateCPBoard() {
            const stopIds = ['170459', '172500']; 
            const targetLines = ['1211', '2605'];
            
            try {
                const results = await Promise.all(stopIds.map(id => 
                    fetch(`https://api.carrismetropolitana.pt/stops/${id}/realtime`).then(res => res.json())
                ));
                let all = [].concat(...results);
                
                let filtered = all.filter(d => targetLines.includes(d.line_id) && 
                    (d.estimated_arrival_unix || d.scheduled_arrival_unix) > (Date.now()/1000 - 30));

                filtered.sort((a, b) => (a.scheduled_arrival_unix) - (b.scheduled_arrival_unix));

                if (filtered.length > 0) {
                    const next = filtered[0];
                    const arrivalUnix = next.estimated_arrival_unix || next.scheduled_arrival_unix;
                    const diffMin = Math.floor((new Date(arrivalUnix * 1000) - new Date()) / 60000);
                    
                    // Lado Esquerdo
                    document.getElementById('dep-time').innerText = (next.estimated_arrival || next.scheduled_arrival).substring(0,5);
                    document.getElementById('dep-dest').innerText = next.headsign;

                    // Lado Direito (Monitor de Paragens)
                    // Como a API de realtime não dá todas as paragens, vamos simular o "look"
                    const stops = ["Cacém Estação", "Av. Bons Amigos", "R. Elias Garcia", "Belas (Centro)", "Queluz"];
                    let stopHtml = stops.map(s => `<li class="stop-item">${s}</li>`).join('');
                    document.getElementById('stop-list').innerHTML = stopHtml;
                    
                    document.getElementById('next-info').innerText = `PRÓXIMO AUTOCARRO: ${diffMin} MIN`;
                }
            } catch (e) { console.error(e); }
        }

        setInterval(updateCPBoard, 30000);
        updateCPBoard();
    </script>
</body>
</html>
