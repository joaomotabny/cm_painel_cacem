<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Painel VELEC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}


/* ==================================================
   PAINEL
================================================== */

.panel {
  position: relative;

  width: min(98vw, 1500px);
  aspect-ratio: 3.08 / 1;

  background:
    linear-gradient(
      145deg,
      #17222c,
      #0b1117 55%,
      #18232c
    );

  border: 2px solid #293640;
  border-radius: 7px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.92),
    inset 0 0 30px rgba(255,255,255,.025);

  padding:
    2.7% 4.2% 2.9%;
}


/* ==================================================
   SUPORTES
================================================== */

.mount {
  position: absolute;

  top: -17%;

  width: 4.8%;
  height: 18%;

  background:
    linear-gradient(
      90deg,
      #080a0c,
      #323b42,
      #080a0c
    );

  border-radius: 8px 8px 0 0;
}

.mount.left {
  left: 23%;
}

.mount.center {
  left: 48%;

  background:
    linear-gradient(
      90deg,
      #777,
      #d4d0c5,
      #888
    );
}

.mount.right {
  right: 18%;
}


/* ==================================================
   ECRÃS
================================================== */

.screens {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    65% 31%;

  gap: 4%;
}


/* ==================================================
   PAINEL ESQUERDO
================================================== */

.left-display {
  position: relative;
  overflow: hidden;

  border: 7px solid #070a0b;
  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      #344c4b 0%,
      #233633 35%,
      #101b19 100%
    );

  box-shadow:
    inset 0 0 35px rgba(0,0,0,.88),
    inset 0 0 8px rgba(255,255,255,.14);
}


/* Reflexo no vidro */

.left-display::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 20;
  pointer-events: none;

  background:
    linear-gradient(
      108deg,
      transparent 33%,
      rgba(255,255,255,.025) 40%,
      rgba(255,255,255,.09) 48%,
      transparent 59%
    );
}


/* ==================================================
   LABELS
================================================== */

.hora-label,
.destino-label {
  position: absolute;

  left: 7%;

  color: #deddb6;

  font-weight: 700;
  letter-spacing: .01em;

  font-size:
    clamp(18px, 2.8vw, 50px);

  z-index: 5;
}

.hora-label {
  top: 7%;
}

.destino-label {
  top: 47%;
}


/* ==================================================
   HORA
================================================== */

.hora {
  position: absolute;

  left: 7%;
  top: 23%;

  display: flex;
  align-items: center;

  gap:
    clamp(5px, .7vw, 14px);

  z-index: 5;
}


.hora-grupo {
  display: flex;
  align-items: center;

  gap:
    clamp(2px, .22vw, 5px);

  --dot:
    clamp(2px, .54vw, 8px);

  --dot-gap:
    clamp(.6px, .08vw, 1.8px);
}


.h-separator {
  color: #d8d5b3;

  font-family: Arial, sans-serif;
  font-weight: 400;

  font-size:
    clamp(20px, 2.7vw, 45px);
}


/* ==================================================
   DESTINO
================================================== */

.destino {
  position: absolute;

  left: 7%;

  /*
    Mais espaço até ao limite direito.
  */
  right: 2%;

  /*
    Ligeiramente mais baixo.
  */
  top: 63%;

  overflow: hidden;

  z-index: 5;
}


.destino-grupo {
  display: flex;
  align-items: center;

  /*
    Muito ligeiramente menor
    que a hora, mas mantém
    completamente a proporção.
  */
  --dot:
    clamp(1.9px, .51vw, 7.6px);

  --dot-gap:
    clamp(.55px, .075vw, 1.7px);

  gap:
    clamp(1px, .18vw, 4px);

  width: 100%;

  /*
    Sem compressão horizontal.
  */
  transform: none;
}


/* ==================================================
   MATRIZ FLIP-DOT 5x7
================================================== */

.dot-character {
  flex: 0 0 auto;

  display: grid;

  grid-template-columns:
    repeat(5, var(--dot));

  grid-template-rows:
    repeat(7, var(--dot));

  gap:
    var(--dot-gap);

  padding:
    calc(var(--dot-gap) * 1.25);

  border:
    1px solid rgba(0,0,0,.9);

  border-radius:
    calc(var(--dot) * .4);

  background:
    linear-gradient(
      180deg,
      #161c17,
      #070a07
    );

  box-shadow:
    inset
    0 0
    calc(var(--dot) * .8)
    rgba(0,0,0,.95),

    0
    calc(var(--dot) * .2)
    calc(var(--dot) * .4)
    rgba(0,0,0,.7);
}


/* Dot apagado */

.dot {
  width: var(--dot);
  height: var(--dot);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #252b25 0%,
      #141914 48%,
      #060806 100%
    );
}


/* Dot aceso */

.dot.on {
  background:
    radial-gradient(
      circle at 38% 32%,
      #fff864 0%,
      #f4df18 33%,
      #bd9f00 70%,
      #685700 100%
    );

  box-shadow:
    0 0
    calc(var(--dot) * .75)
    rgba(255,225,20,.45);
}


/* ==================================================
   LINHA 3
================================================== */

.via {
  position: absolute;

  right: 5%;
  top: 9%;

  width: 20%;
  aspect-ratio: 1 / 1;

  display: flex;
  align-items: center;
  justify-content: center;

  border:
    clamp(3px, .5vw, 8px)
    solid #d9f343;

  border-radius: 7%;

  color: #d9f343;

  font-family: Arial, sans-serif;
  font-weight: 500;

  font-size:
    clamp(55px, 9.5vw, 160px);

  line-height: 1;

  text-shadow:
    0 0 12px
    rgba(200,255,50,.35);

  box-shadow:
    inset
    0 0 15px
    rgba(190,255,50,.07),

    0 0 6px
    rgba(190,255,50,.15);

  z-index: 5;
}


/* ==================================================
   CRT EXTERIOR
================================================== */

.crt-frame {
  position: relative;

  background: #040505;

  border-radius: 6px;

  padding: 4%;

  box-shadow:
    inset 0 0 20px #000;
}


/* ==================================================
   CRT
================================================== */

.crt {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 10%;

  padding:
    6% 7% 5%;

  background:
    radial-gradient(
      ellipse at center,
      #17341c 0%,
      #0d2412 52%,
      #030904 100%
    );

  color: #c9ef35;

  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  letter-spacing: .015em;

  text-shadow:
    0 0 3px
    rgba(200,239,53,.34);

  box-shadow:
    inset
    0 0 30px
    rgba(0,0,0,.95),

    inset
    0 0 65px
    rgba(0,0,0,.65);
}


/* Vinheta CRT */

.crt::before {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  z-index: 8;

  background:
    radial-gradient(
      ellipse at center,
      transparent 48%,
      rgba(0,0,0,.12) 70%,
      rgba(0,0,0,.45) 100%
    );
}


/* Scanlines CRT */

.crt::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 10;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    );

  opacity: .45;
}


/* ==================================================
   PARAGENS
================================================== */

.stops {
  position: relative;

  z-index: 2;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  column-gap: 8%;

  height: 75%;
}


.stop-column {
  display: flex;
  flex-direction: column;
}


.stop {
  height: 10%;

  white-space: nowrap;
  overflow: hidden;

  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  font-size:
    clamp(14px, 1.45vw, 29px);

  line-height: .9;

  letter-spacing: .01em;

  text-shadow:
    0 0 4px
    rgba(200,239,53,.3);
}


/* ==================================================
   COMBOIO SEGUINTE
================================================== */

.next-train {
  position: absolute;

  z-index: 3;

  left: 7%;
  right: 7%;
  bottom: 6%;

  display: grid;

  grid-template-columns:
    auto minmax(0, 1fr) auto;

  align-items: baseline;

  column-gap: 4%;
}


.next-label {
  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  font-size:
    clamp(8px, .72vw, 15px);

  line-height: 1;

  white-space: nowrap;
}


.next-destination,
.next-time {
  font-family:
    "VT323",
    monospace;

  font-weight: 400;

  font-size:
    clamp(18px, 1.9vw, 36px);

  line-height: .9;

  white-space: nowrap;
}


.next-destination {
  overflow: hidden
