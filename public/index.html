<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Partidas para Lisboa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --green: #c9ef43;
      --green-text: #c8ed3d;
      --green-glow: rgba(200, 237, 61, .25);

      --screen: #081006;
      --screen-dark: #020402;

      --frame: #101110;

      --font:
        "VT323",
        "Courier New",
        monospace;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }


    body {

      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at center,
          #191a17 0%,
          #070807 55%,
          #000 100%
        );

      font-family: var(--font);
    }


    /*
    ===============================
    MONITOR
    ===============================
    */

    .monitor {

      width: min(96vw, 1120px);

      aspect-ratio: 4 / 3;

      padding:
        clamp(10px, 2vw, 28px);

      background:
        linear-gradient(
          145deg,
          #252625,
          #0b0c0b 40%,
          #050605 70%,
          #181918
        );

      border-radius:
        clamp(16px, 3vw, 36px);

      border:
        2px solid #292a29;

      box-shadow:
        0 30px 90px rgba(0,0,0,.9),
        inset 0 0 25px rgba(255,255,255,.025);
    }


    /*
    ===============================
    ECRÃ
    ===============================
    */

    .screen {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      padding:
        clamp(26px, 5vw, 70px)
        clamp(22px, 6vw, 80px);

      border-radius:
        clamp(14px, 2.3vw, 28px);

      background:
        radial-gradient(
          ellipse at 50% 45%,
          #10180c 0%,
          #080d06 55%,
          #020402 100%
        );

      border:
        2px solid rgba(255,255,255,.06);

      box-shadow:
        inset 0 0 35px rgba(0,0,0,.95),
        inset 0 0 100px rgba(0,0,0,.65);
    }


    /*
    Scanlines
    */

    .screen::before {

      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 5;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.02) 0px,
          rgba(255,255,255,.02) 1px,
          transparent 1px,
          transparent 4px
        );

      opacity: .35;
    }


    /*
    Vinheta CRT
    */

    .screen::after {

      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 6;

      background:
        radial-gradient(
          ellipse at center,
          transparent 58%,
          rgba(0,0,0,.22) 78%,
          rgba(0,0,0,.60) 100%
        );
    }


    /*
    ===============================
    CONTEÚDO
    ===============================
    */

    .content {

      position: relative;

      z-index: 2;

      width: 100%;
    }


    /*
    ===============================
    CABEÇALHO
    ===============================
    */

    .title-box {

      display: inline-block;

      background:
        var(--green);

      color:
        #111709;

      padding:
        .02em .24em .07em .24em;

      font-size:
        clamp(27px, 4vw, 54px);

      line-height:
        .9;

      letter-spacing:
        .015em;

      text-transform:
        uppercase;

      white-space:
        nowrap;

      margin-bottom:
        clamp(8px, 1.4vw, 18px);

      box-shadow:
        0 0 5px rgba(200,237,61,.20);
    }


    /*
    ===============================
    GRID
    ===============================
    */

    .columns,
    .departure {

      display: grid;

      grid-template-columns:
        24% 60% 16%;

      width: 100%;

      align-items: center;
    }


    .columns {

      color:
        var(--green-text);

      font-size:
        clamp(27px, 4vw, 53px);

      line-height:
        .85;

      margin-bottom:
        clamp(5px, .7vw, 9px);

      text-shadow:
        0 0 4px var(--green-glow);
    }


    .departure {

      color:
        var(--green-text);

      font-size:
        clamp(30px, 4.3vw, 58px);

      line-height:
        .93;

      min-height:
        clamp(39px, 5.7vw, 68px);

      text-shadow:
        0 0 4px var(--green-glow);
    }


    /*
    ===============================
    POSIÇÃO DAS COLUNAS
    ===============================
    */

    .destination {
      padding-left: .05em;
    }


    .via,
    .via-label {
      text-align: right;
      padding-right: .3em;
    }


    /*
    ===============================
    PIXELIZAÇÃO SUAVE
    ===============================
    */

    .crt-text {

      filter:
        contrast(1.05);

      -webkit-font-smoothing:
        none;

      font-smooth:
        never;
    }


    /*
    ===============================
    MENSAGENS
    ===============================
    */

    .message {

      color:
        var(--green-text);

      font-size:
        clamp(28px, 4vw, 52px);

      margin-top:
        clamp(10px, 2vw, 25px);

      text-shadow:
        0 0 4px var(--green-glow);
    }


    /*
    ===============================
    REFLEXO
    ===============================
    */

    .reflection {

      position: absolute;

      top: -20%;
      left: -18%;

      width: 42%;
      height: 160%;

      transform:
        rotate(11deg);

      pointer-events: none;

      z-index: 4;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.025),
          transparent
        );

      filter:
        blur(10px);
    }


    /*
    ===============================
    iPAD / TABLET
    ===============================
    */

    @media
    (max-width: 900px) {

      .monitor {

        width:
          min(98vw, 900px);

        padding:
          12px;
      }


      .screen {

        padding:
          6vw 6vw;
      }

    }


    /*
    ===============================
    iPAD MINI VERTICAL
    ===============================
    */

    @media
    (max-width: 700px) {

      body {
        align-items:
          center;
      }


      .monitor {

        width:
          100vw;

        max-width:
          none;

        padding:
          8px;

        border-radius:
          0;
      }


      .screen {

        border-radius:
          18px;

        padding:
          7vw 5vw;
      }


      .columns,
      .departure {

        grid-template-columns:
          25% 59% 16%;
      }


      .title-box {

        font-size:
          clamp(24px, 6vw, 38px);
      }


      .columns {

        font-size:
          clamp(24px, 6vw, 37px);
      }


      .departure {

        font-size:
          clamp(27px, 6.2vw, 40px);

        min-height:
          clamp(36px, 8vw, 50px);
      }

    }


    /*
    ===============================
    MUITO PEQUENO
    ===============================
    */

    @media
    (max-width: 430px) {

      .screen {

        padding:
          8vw 4vw;
      }


      .columns,
      .departure {

        grid-template-columns:
          26% 58% 16%;
      }


      .destination {
        white-space:
          nowrap;
      }

    }

  </style>

</head>


<body>

  <main class="monitor">

    <section class="screen">

      <div class="reflection"></div>


      <div class="content crt-text">


        <div class="title-box">
          PARTIDAS PARA LISBOA
        </div>


        <div class="columns">

          <div>
            HORA
          </div>

          <div>
            DESTINO
          </div>

          <div class="via-label">
            VIA
          </div>

        </div>


        <div id="departures">

          <div class="message">
            SINCRONIZANDO
          </div>

        </div>


      </div>

    </section>

  </main>



<script>

  /*
  ==================================================
  CONFIG
  ==================================================
  */

  const API_URL =
    "/api/partidas";

  const MAX_PARTIDAS =
    6;

  const REFRESH_INTERVAL =
    30000;



  /*
  ==================================================
  DESTINOS
  ==================================================
  */

  function normalizarDestino(destino) {

    if (!destino) {
      return "";
    }


    const texto =
      String(destino)
        .toUpperCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .trim();



    if (
      texto.includes(
        "ORIENTE"
      )
    ) {

      return "LISBOA-ORIENTE";

    }



    if (
      texto.includes(
        "ALVERCA"
      )
    ) {

      return "ALVERCA";

    }



    if (

      texto.includes(
        "SANTA APOLONIA"
      )

      ||

      texto.includes(
        "S.APOLONIA"
      )

      ||

      texto.includes(
        "S. APOLONIA"
      )

      ||

      texto.includes(
        "LISBOA-S.A"
      )

    ) {

      return "LISBOA-S.A";

    }



    return "";

  }



  /*
  ==================================================
  VIA
  ==================================================
  */

  function obterVia(destino) {

    if (
      destino ===
      "LISBOA-S.A"
    ) {

      return "04";

    }


    if (

      destino ===
      "LISBOA-ORIENTE"

      ||

      destino ===
      "ALVERCA"

    ) {

      return "03";

    }


    return "--";

  }



  /*
  ==================================================
  ESCAPE HTML
  ==================================================
  */

  function escapeHTML(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      );

  }



  /*
  ==================================================
  MOSTRAR PARTIDAS
  ==================================================
  */

  function mostrarPartidas(lista) {

    const departures =
      document.getElementById(
        "departures"
      );


    const permitidas =
      lista

      .map(
        comboio => {

          const destino =
            normalizarDestino(

              comboio.destino

              ||

              comboio.destination

              ||

              comboio.destinoOriginal

            );


          return {

            ...comboio,

            destinoPainel:
              destino

          };

        }
      )

      .filter(
        comboio =>

        comboio.destinoPainel ===
        "LISBOA-ORIENTE"

        ||

        comboio.destinoPainel ===
        "ALVERCA"

        ||

        comboio.destinoPainel ===
        "LISBOA-S.A"

      )

      .slice(
        0,
        MAX_PARTIDAS
      );



    if (
      permitidas.length === 0
    ) {

      departures.innerHTML =
        `

        <div class="message">
          SEM PARTIDAS
        </div>

        `;

      return;

    }



    departures.innerHTML =
      permitidas

      .map(
        comboio => {

          const hora =
            escapeHTML(
              comboio.hora ||
              "--:--"
            );


          const destino =
            escapeHTML(
              comboio.destinoPainel
            );


          const via =
            obterVia(
              comboio.destinoPainel
            );


          return `

            <div class="departure">

              <div class="time">
                ${hora}
              </div>

              <div class="destination">
                ${destino}
              </div>

              <div class="via">
                ${via}
              </div>

            </div>

          `;

        }
      )

      .join("");

  }



  /*
  ==================================================
  CARREGAR API
  ==================================================
  */

  async function carregarPartidas() {

    try {

      const response =
        await fetch(

          API_URL +
          "?t=" +
          Date.now(),

          {
            cache:
              "no-store"
          }

        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      console.log(
        "Partidas:",
        data
      );


      const lista =
        Array.isArray(data)
        ?
        data
        :
        data.partidas ||
        [];


      mostrarPartidas(
        lista
      );

    }


    catch (
      error
    ) {

      console.error(
        "Erro:",
        error
      );


      document
        .getElementById(
          "departures"
        )
        .innerHTML =
        `

        <div class="message">
          SEM LIGACAO
        </div>

        `;

    }

  }



  /*
  ==================================================
  ARRANQUE
  ==================================================
  */

  carregarPartidas();


  setInterval(

    carregarPartidas,

    REFRESH_INTERVAL

  );

</script>


</body>
</html>
