<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000; 
            color: #ff8000; /* Laranja "Amber" clássico de painel LED */
            font-family: 'DotGothic16', sans-serif; 
            margin: 0; 
            padding: 30px;
            overflow: hidden;
        }

        .header { 
            font-size: 50px; 
            border-bottom: 5px solid #4d2600; 
            padding-bottom: 15px;
            margin-bottom: 30px; 
            display: flex; 
            justify-content: space-between;
        }

        .row { 
            display: flex; 
            align-items: center; 
            border-bottom: 2px solid #261300; 
            height: 140px; /* Ainda maior para o Mac */
            line-height: 140px;
        }

        .col-line { 
            width: 20%; 
            font-size: 110px; 
            font-weight: bold;
        }

        .col-dest { 
            width: 45%; 
            font-size: 70px; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-time { 
            width: 35%; 
            text-align: right; 
            font-size: 75px; 
        }

        .diff-min {
            font-size: 50px;
            margin-right: 15px;
            opacity: 0.8;
        }

        @keyframes blinker { 50% { opacity: 0; } }
        .blink { animation: blinker 1s linear infinite; color: #ff0000; }
    </style>
</head>
<body>
    <div class="header">
        <span>Cacém - Bons Amigos</span>
        <span id="clock">00:00:00</span>
    </div>
    <div id="list">A carregar...</div>

    <script>
        function setClock() {
            var now = new Date();
            document.getElementById('clock').innerHTML = ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2) + ":" + ("0" + now.getSeconds()).slice(-2);
        }

        function formatCMTime(timeStr) {
            if (!timeStr) return "--:--";
            let parts = timeStr.split(':');
            let hour = parseInt(parts[0]);
            if (hour >= 24) hour -= 24;
            return ("0" + hour).slice(-2) + ":" + parts[1];
        }

        async function updateBoard() {
            const stopIds = ['170459', '172500']; 
            const targetLines = ['1211', '2605'];

            try {
                const results = await Promise.all(stopIds.map(id => 
                    fetch(`https://api.carrismetropolitana.pt/stops/${id}/realtime`).then(res => res.json())
                ));
                
                let all = [].concat(...results);
                const now = new Date();

                let filtered = all.filter(d => {
                    return targetLines.includes(d.line_id) && 
                           (d.estimated_arrival_unix || d.scheduled_arrival_unix) > (Math.floor(Date.now() / 1000) - 60);
                });

                filtered.sort((a, b) => (a.scheduled_arrival_unix) - (b.scheduled_arrival_unix));

                let html = '';
                filtered.slice(0, 5).forEach(d => {
                    const arrivalUnix = d.estimated_arrival_unix || d.scheduled_arrival_unix;
                    const diffMin = Math.floor((new Date(arrivalUnix * 1000) - now) / 60000);
                    let displayTime = formatCMTime(d.estimated_arrival || d.scheduled_arrival);

                    let timeDisplay = diffMin <= 0 ? `<span class="blink">A chegar</span>` : `<span class="diff-min">${diffMin}m</span><span>${displayTime}</span>`;

                    html += `<div class="row">
                        <span class="col-line">${d.line_id}</span>
                        <span class="col-dest">${d.headsign}</span>
                        <span class="col-time">${timeDisplay}</span>
                    </div>`;
                });

                document.getElementById('list').innerHTML = html || '<div class="row">Sem serviços</div>';
            } catch (e) {
                document.getElementById('list').innerHTML = "Erro de rede";
            }
        }

        setClock(); updateBoard();
        setInterval(setClock, 1000);
        setInterval(updateBoard, 30000);
    </script>
</body>
</html>
