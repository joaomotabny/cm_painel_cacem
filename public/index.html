<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Partidas Retro - CP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonte ao estilo dot-matrix / retro CRT -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --crt-green: #bbf01a;
      --crt-green-glow: rgba(187, 240, 26, 0.4);
      --crt-bg: #0c120a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'VT323', monospace;
    }

    /* Moldura externa da televisão/monitor */
    .crt-monitor {
      background: #111413;
      padding: 30px;
      border-radius: 40px;
      box-shadow: 
        inset 0 0 15px rgba(255,255,255,0.05),
        0 20px 50px rgba(0,0,0,0.9);
      border: 4px solid #1a1e1c;
      max-width: 900px;
      width: 95%;
    }

    /* Ecrã de Fósforo CRT */
    .crt-screen {
      background-color: var(--crt-bg);
      border-radius: 20px;
      padding: 40px 50px;
      position: relative;
      overflow: hidden;
      color: var(--crt-green);
      text-shadow: 0 0 6px var(--crt-green-glow);
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
      border: 2px solid #1c2718;
    }

    /* Efeito de Scanlines (linhas horizontais CRT) */
    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    /* Bloco do Título 'PARTIDAS' */
    .header-box {
      text-align: center;
      margin-bottom: 30px;
    }

    .header-title {
      display: inline-block;
      background-color: var(--crt-green);
      color: var(--crt-bg);
      font-size: 3.5rem;
      letter-spacing: 8px;
      padding: 2px 30px;
      text-shadow: none;
      font-weight: bold;
      border-radius: 2px;
    }

    /* Tabela do Painel */
    .board-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 2.8rem;
      line-height: 1.2;
      letter-spacing: 3px;
    }

    .board-table th {
      text-align: left;
      font-weight: normal;
      padding-bottom: 15px;
    }

    .board-table td {
      padding: 4px 0;
    }

    .col-hora { width: 22%; }
    .col-destino { width: 58%; }
    .col-linha { width: 20%; text-align: right; }
    .board-table th.col-linha { text-align: right; }
  </style>
</head>
<body>

  <div class="crt-monitor">
    <div class="crt-screen">
      <div class="header-box">
        <div class="header-title">PARTIDAS</div>
      </div>

      <table class="board-table">
        <thead>
          <tr>
            <th class="col-hora">HORA</th>
            <th class="col-destino">DESTINO</th>
            <th class="col-linha">LINHA</th>
          </tr>
        </thead>
        <tbody id="departures-body">
          <tr>
            <td class="col-hora">16:20</td>
            <td class="col-destino">LISBOA-ORIENTE</td>
            <td class="col-linha">3</td>
          </tr>
          <tr>
            <td class="col-hora">16:25</td>
            <td class="col-destino">LISBOA-ROSSIO</td>
            <td class="col-linha">4</td>
          </tr>
          <tr>
            <td class="col-hora">16:35</td>
            <td class="col-destino">LISBOA-ORIENTE</td>
            <td class="col-linha">3</td>
          </tr>
          <tr>
            <td class="col-hora">16:42</td>
            <td class="col-destino">ALVERCA</td>
            <td class="col-linha">2</td>
          </tr>
          <tr>
            <td class="col-hora">16:50</td>
            <td class="col-destino">LISBOA-ORIENTE</td>
            <td class="col-linha">3</td>
          </tr>
          <tr>
            <td class="col-hora">17:05</td>
            <td class="col-destino">LISBOA-ROSSIO</td>
            <td class="col-linha">4</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
