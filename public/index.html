  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

  <title>Partidas para Lisboa</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #050505;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #20201d 0%,
          #0b0b0a 55%,
          #000 100%
        );
    }


    /* =========================
       CAIXA DO PAINEL
       ========================= */

    .monitor {

      position: relative;

      width: min(94vw, 1100px);

      aspect-ratio: 4 / 3;

      padding:
        clamp(20px, 2.3vw, 38px);

      background:
        linear-gradient(
          145deg,
          #252525 0%,
          #111 30%,
          #050505 70%,
          #181818 100%
        );

      border-radius:
        clamp(16px, 2vw, 32px);

      border:
        2px solid #262626;

      box-shadow:
        0 35px 90px rgba(0,0,0,.9),
        inset 0 0 25px rgba(255,255,255,.025);
    }


    /* =========================
       ECRÃ
       ========================= */

    .screen {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius:
        clamp(12px, 1.5vw, 24px);

      background:
        radial-gradient(
          ellipse at center,
          #11180d 0%,
          #080d07 58%,
          #020302 100%
        );

      border:
        2px solid rgba(255,255,255,.08);

      box-shadow:
        inset 0 0 22px rgba(0,0,0,.95),
        inset 0 0 70px rgba(0,0,0,.8),
        inset 0 0 5px rgba(196,235,65,.08);
    }


    /* scanlines */

    .screen::before {

      content: "";

      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.018) 0px,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 3px
        );

      opacity: .5;
    }


    /* vinheta */

    .screen::after {

      content: "";

      position: absolute;
      inset: 0;

      z-index: 5;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 58%,
          rgba(0,0,0,.2) 77%,
          rgba(0,0,0,.64) 100%
        );
    }


    canvas {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      image-rendering: pixelated;

      z-index: 2;
    }


    /* Reflexo discreto */

    .reflection {

      position: absolute;

      left: -12%;
      top: -35%;

      width: 38%;
      height: 160%;

      transform: rotate(12deg);

      z-index: 6;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.025),
          transparent
        );

      filter: blur(10px);
    }


    @media (max-width: 700px) {

      .monitor {

        width: 100vw;

        max-width: none;

        border-radius: 0;

        padding: 8px;
      }

      .screen {
        border-radius: 14px;
      }
    }

  </style>
</head>


<body>

  <div class="monitor">

    <div class="screen">

      <canvas id="board"></canvas>

      <div class="reflection"></div>

    </div>

  </div>

/*
===========================================================
CANVAS
===========================================================
*/

const canvas =
  document.getElementById("board");

const ctx =
  canvas.getContext("2d");

let partidas = [];

let mensagem =
  "SINCRONIZANDO";


/*
===========================================================
DESTINOS
===========================================================
*/

function normalizarDestino(destino) {

  if (!destino) {
    return "";
  }

  const texto =
    destino
    .toUpperCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();


  if (
    texto.includes("ORIENTE")
  ) {

    return "LISBOA-ORIENTE";

  }


  if (
    texto.includes("ALVERCA")
  ) {

    return "ALVERCA";

  }


  if (
    texto.includes("SANTA APOLONIA") ||
    texto.includes("S.APOLONIA") ||
    texto.includes("S. APOLONIA") ||
    texto.includes("LISBOA-S.A")
  ) {

    return "LISBOA-S.A";

  }


  return "";

}


/*
===========================================================
VIA
===========================================================
*/

function obterVia(destino) {

  if (
    destino === "LISBOA-S.A"
  ) {

    return "04";

  }


  if (
    destino === "LISBOA-ORIENTE" ||
    destino === "ALVERCA"
  ) {

    return "03";

  }


  return "--";

}


/*
===========================================================
TAMANHO DE TEXTO
===========================================================
*/

function larguraTexto(
  texto,
  pixel,
  gap = 1
) {

  return (
    texto.length *
    (5 + gap) *
    pixel
    -
    gap * pixel
  );

}


/*
===========================================================
CARÁCTER
===========================================================
*/

function desenharCaracter(
  char,
  x,
  y,
  pixel,
  cor,
  brilho = true
) {

  const pattern =
    FONT[char] ||
    FONT[" "];


  ctx.save();


  ctx.fillStyle =
    cor;


  if (brilho) {

    ctx.shadowColor =
      "rgba(200,235,55,.25)";

    ctx.shadowBlur =
      pixel * .55;

  }


  const margem =
    Math.max(
      .35,
      pixel * .09
    );


  for (
    let linha = 0;
    linha < 7;
    linha++
  ) {

    for (
      let coluna = 0;
      coluna < 5;
      coluna++
    ) {

      if (
        pattern[linha][coluna]
        ===
        "1"
      ) {

        ctx.fillRect(

          x +
          coluna * pixel +
          margem,

          y +
          linha * pixel +
          margem,

          pixel -
          margem * 2,

          pixel -
          margem * 2

        );

      }

    }

  }


  ctx.restore();

}


/*
===========================================================
TEXTO
===========================================================
*/

function desenharTexto(
  texto,
  x,
  y,
  pixel,
  opcoes = {}
) {

  const {

    color = GREEN,

    glow = true,

    gap = 1

  } = opcoes;


  let cursor =
    x;


  texto =
    texto.toUpperCase();


  for (
    const char of texto
  ) {

    desenharCaracter(

      char,

      cursor,

      y,

      pixel,

      color,

      glow

    );


    cursor +=
      (5 + gap) *
      pixel;

  }

}


/*
===========================================================
MATRIZ DE FUNDO
===========================================================
*/

function desenharMatrizFundo(
  largura,
  altura
) {

  const spacing =
    Math.max(
      4,
      largura / 240
    );


  ctx.save();

  ctx.fillStyle =
    DIM;


  for (
    let y = spacing;
    y < altura;
    y += spacing
  ) {

    for (
      let x = spacing;
      x < largura;
      x += spacing
    ) {

      ctx.fillRect(
        x,
        y,
        .55,
        .55
      );

    }

  }


  ctx.restore();

}


/*
===========================================================
CABEÇALHO VERDE
===========================================================
*/

function desenharCabecalho(
  largura,
  pixel,
  x,
  y
) {

  const texto =
    "PARTIDAS PARA LISBOA";


  const textWidth =
    larguraTexto(
      texto,
      pixel
    );


  const paddingX =
    pixel * 2.5;

  const paddingY =
    pixel * 1.5;


  const boxWidth =
    textWidth +
    paddingX * 2;


  const boxHeight =
    pixel * 7 +
    paddingY * 2;


  /*
  Cabeçalho compacto
  semelhante ao painel real.
  */

  ctx.save();

  ctx.fillStyle =
    GREEN_HEADER;

  ctx.shadowColor =
    "rgba(200,235,55,.18)";

  ctx.shadowBlur =
    pixel;


  ctx.fillRect(
    x,
    y,
    boxWidth,
    boxHeight
  );

  ctx.restore();


  desenharTexto(

    texto,

    x + paddingX,

    y + paddingY,

    pixel,

    {
      color:
        DARK_HEADER,

      glow:
        false
    }

  );


  return {
    width:
      boxWidth,

    height:
      boxHeight
  };

}


/*
===========================================================
RENDER
===========================================================
*/

function render() {

  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    Math.round(
      rect.width *
      dpr
    );

  canvas.height =
    Math.round(
      rect.height *
      dpr
    );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  const largura =
    rect.width;

  const altura =
    rect.height;


  ctx.clearRect(
    0,
    0,
    largura,
    altura
  );


  desenharMatrizFundo(
    largura,
    altura
  );


  /*
  Escala geral
  */

  const escala =
    Math.min(
      largura / 1000,
      altura / 750
    );


  /*
  Layout inspirado na fotografia
  */

  const margemEsquerda =
    largura * .10;

  const topo =
    altura * .12;


  const headerPixel =
    Math.max(
      4,
      5.2 * escala
    );


  const header =
    desenharCabecalho(

      largura,

      headerPixel,

      margemEsquerda,

      topo

    );


  /*
  Tamanho principal da matriz
  */

  const pixel =
    Math.max(
      4.4,
      5.9 * escala
    );


  /*
  Colunas
  */

  const horaX =
    largura * .105;

  const destinoX =
    largura * .34;

  const viaX =
    largura * .80;


  const colunasY =
    topo +
    header.height +
    altura * .025;


  desenharTexto(
    "HORA",
    horaX,
    colunasY,
    pixel
  );


  desenharTexto(
    "DESTINO",
    destinoX,
    colunasY,
    pixel
  );


  desenharTexto(
    "VIA",
    viaX,
    colunasY,
    pixel
  );


  /*
  Linhas de comboios
  */

  const primeiraLinhaY =
    colunasY +
    pixel * 9.5;


  const espacamento =
    pixel * 9.1;


  /*
  Sem dados
  */

  if (
    partidas.length === 0
  ) {

    desenharTexto(

      mensagem,

      horaX,

      primeiraLinhaY,

      pixel * .82

    );

    return;

  }


  partidas
    .slice(
      0,
      MAX_PARTIDAS
    )
    .forEach(
      (
        comboio,
        index
      ) => {

        const y =
          primeiraLinhaY +
          index *
          espacamento;


        /*
        HORA
        */

        desenharTexto(

          comboio.hora ||
          "--:--",

          horaX,

          y,

          pixel

        );


        /*
        DESTINO
        */

        desenharTexto(

          comboio.destinoPainel,

          destinoX,

          y,

          pixel

        );


        /*
        VIA
        */

        desenharTexto(

          obterVia(
            comboio.destinoPainel
          ),

          viaX,

          y,

          pixel

        );

      }
    );

}


/*
===========================================================
CARREGAR PARTIDAS
===========================================================
*/

async function carregarPartidas() {

  try {

    const resposta =
      await fetch(

        API_URL +
        "?t=" +
        Date.now(),

        {
          cache:
            "no-store"
        }

      );


    if (
      !resposta.ok
    ) {

      throw new Error(
        "HTTP " +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    console.log(
      "API:",
      dados
    );


    const lista =
      Array.isArray(dados)
      ?
      dados
      :
      dados.partidas ||
      [];


    partidas =
      lista

      .map(
        comboio => {

          const destino =
            normalizarDestino(

              comboio.destino ||

              comboio.destination ||

              comboio.destinoOriginal

            );


          return {

            ...comboio,

            destinoPainel:
              destino

          };

        }
      )

      .filter(
        comboio =>

        comboio.destinoPainel
        ===
        "LISBOA-ORIENTE"

        ||

        comboio.destinoPainel
        ===
        "ALVERCA"

        ||

        comboio.destinoPainel
        ===
        "LISBOA-S.A"

      )

      .slice(
        0,
        MAX_PARTIDAS
      );


    mensagem =
      partidas.length
      ?
      ""
      :
      "SEM PARTIDAS";


    render();

  }

  catch (
    erro
  ) {

    console.error(
      erro
    );


    partidas =
      [];


    mensagem =
      "SEM LIGACAO";


    render();

  }

}


/*
===========================================================
ARRANQUE
===========================================================
*/

window.addEventListener(
  "resize",
  render
);


render();

carregarPartidas();


setInterval(

  carregarPartidas,

  REFRESH_INTERVAL

);

</script>
