<!-- Importar fontes pixel perfeitas -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --crt-green: #cbe91e;
    --crt-green-glow: rgba(203, 233, 30, 0.5);
    --crt-bg: #0b1108;
  }

  /* ... restante estrutura ... */

  /* Aplicação da fonte pixel/matriz */
  .crt-screen {
    font-family: 'Silkscreen', 'Press Start 2P', monospace;
    font-weight: 700;
  }

  /* Bloco PARTIDAS com textura de pontos recortados */
  .header-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 2.8rem;
    letter-spacing: 6px;
    background-color: var(--crt-green);
    color: var(--crt-bg);
    padding: 6px 25px;
  }

  /* Grelha de Pontos (Dot Matrix effect em CSS) sobre a letra */
  .board-table {
    font-family: 'Press Start 2P', monospace;
    font-size: 2.1rem;
    letter-spacing: 4px;
    line-height: 1.6;
    background-image: radial-gradient(rgba(0,0,0,0.75) 20%, transparent 20%);
    background-size: 4px 4px; /* Simula os furos da matriz de pontos */
  }
</style>
