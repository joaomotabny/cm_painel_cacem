<!DOCTYPE html>
<html lang="pt">

<head>

<meta

>

>

>

<style>

/* ==================================================
   RESET
================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {
  width: 100%;
  height: 100%;

  min-height: 100%;

  overflow: hidden;

  background: #050505;
}


body {
  display: flex;

  align-items: center;
  justify-content: center;

  font-family:
    Arial,
    sans-serif;
}



/* ==================================================
   PAINEL
================================================== */

.panel {
  position: relative;

  width: 98vw;
  height: 34vw;

  max-width: 1500px;
  max-height: 520px;

  background:
    linear-gradient(
      145deg,
      #17222c,
      #0b1117 55%,
      #18232c
    );

  border:
    2px solid #293640;

  border-radius: 7px;

  box-shadow:

    0 30px 90px
    rgba(0,0,0,.92),

    inset 0 0 30px
    rgba(255,255,255,.025);

  padding:
    2.5% 2.2% 2.6%;
}



/* ==================================================
   SUPORTES
================================================== */

.mount {
  position: absolute;

  top: -17%;

  width: 4.8%;
  height: 18%;

  background:
    linear-gradient(
      90deg,
      #080a0c,
      #323b42,
      #080a0c
    );

  border-radius:
    8px 8px 0 0;
}


.mount.left {
  left: 23%;
}


.mount.center {
  left: 48%;

  background:
    linear-gradient(
      90deg,
      #777,
      #d4d0c5,
      #888
    );
}


.mount.right {
  right: 18%;
}



/* ==================================================
   ECRÃS
================================================== */

.screens {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    64% 34%;

  grid-column-gap: 2%;
}



/* ==================================================
   PAINEL ESQUERDO
================================================== */

.left-display {
  position: relative;

  overflow: hidden;

  border:
    4px solid #070a0b;

  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      #344c4b 0%,
      #233633 35%,
      #101b19 100%
    );

  box-shadow:

    inset 0 0 35px
    rgba(0,0,0,.88),

    inset 0 0 8px
    rgba(255,255,255,.14);
}



.left-display::after {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 20;

  pointer-events: none;

  background:
    linear-gradient(
      108deg,
      transparent 33%,
      rgba(255,255,255,.025) 40%,
      rgba(255,255,255,.09) 48%,
      transparent 59%
    );
}



/* ==================================================
   LABELS
================================================== */

.hora-label,
.destino-label {

  position: absolute;

  left: 7%;

  color:
    #deddb6;

  font-weight:
    700;

  letter-spacing:
    .01em;

  font-size:
    3vw;

  z-index:
    5;

}


.hora-label {
  top: 7%;
}


.destino-label {
  top: 46%;
}



/* ==================================================
   HORA
================================================== */

.hora {
  position: absolute;

  left: 7%;
  top: 23%;

  display: flex;

  align-items: center;

  z-index: 5;
}


.hora-grupo {

  display: flex;

  align-items: center;

  --dot:
    5px;

  --dot-gap:
    1px;

}


.hora .hora-grupo:first-child {
  margin-right:
    10px;
}


.hora .hora-grupo:last-child {
  margin-left:
    10px;
}


.h-separator {

  color:
    #d8d5b3;

  font-family:
    Arial,
    sans-serif;

  font-weight:
    400;

  font-size:
    3vw;

}



/* ==================================================
   DESTINO
================================================== */

.destino {

  position: absolute;

  left: 7%;
  right: 2%;

  top: 63%;

  overflow: hidden;

  z-index: 5;

}


.destino-grupo {

  display: flex;

  align-items: center;

  --dot:
    4.2px;

  --dot-gap:
    .85px;

  width:
    100%;

}



/* ==================================================
   MATRIZ 5x7
================================================== */

.dot-character {

  flex:
    0 0 auto;

  display:
    grid;

  grid-template-columns:
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot);

  grid-template-rows:
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot)
    var(--dot);

  grid-gap:
    var(--dot-gap);

  padding:
    1px;

  margin-right:
    3px;

  border:
    1px solid
    rgba(0,0,0,.9);

  border-radius:
    2px;

  background:
    linear-gradient(
      180deg,
      #161c17,
      #070a07
    );

  box-shadow:

    inset
    0 0 4px
    rgba(0,0,0,.95),

    0 1px 2px
    rgba(0,0,0,.7);

}


.destino-grupo
.dot-character {

  margin-right:
    2px;

}


.dot-character:last-child {

  margin-right:
    0;

}



.dot {

  width:
    var(--dot);

  height:
    var(--dot);

  border-radius:
    50%;

  background:
    radial-gradient(
      circle at 40% 35%,
      #252b25 0%,
      #141914 48%,
      #060806 100%
    );

}



.dot.on {

  background:
    radial-gradient(
      circle at 38% 32%,
      #fff864 0%,
      #f4df18 33%,
      #bd9f00 70%,
      #685700 100%
    );

  box-shadow:

    0 0 4px
    rgba(255,225,20,.48);

}



/* ==================================================
   LINHA 3
================================================== */

.via {

  position: absolute;

  right: 5%;
  top: 9%;

  width: 20%;
  height: 42%;

  display: flex;

  align-items: center;
  justify-content: center;

  border:

    5px solid
    #d9f343;

  border-radius:
    7%;

  color:
    #d9f343;

  font-family:
    Arial,
    sans-serif;

  font-weight:
    500;

  font-size:
    10vw;

  line-height:
    1;

  text-shadow:

    0 0 12px
    rgba(200,255,50,.35);

  box-shadow:

    inset
    0 0 15px
    rgba(190,255,50,.07),

    0 0 6px
    rgba(190,255,50,.15);

  z-index:
    5;

}



/* ==================================================
   CRT EXTERIOR
================================================== */

.crt-frame {

  position: relative;

  background:
    #040505;

  border-radius:
    6px;

  padding:
    3%;

  box-shadow:

    inset
    0 0 20px
    #000;

}



/* ==================================================
   CRT
================================================== */

.crt {

  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius:
    10%;

  padding:
    5.5% 6% 5%;

  background:

    radial-gradient(
      ellipse at center,
      #17341c 0%,
      #0d2412 52%,
      #030904 100%
    );

  color:
    #d7f04b;

  font-family:
    "VT323",
    monospace;

  font-weight:
    400;

  letter-spacing:
    .01em;

  text-shadow:

    0 0 4px
    rgba(210,245,60,.40);

  box-shadow:

    inset
    0 0 30px
    rgba(0,0,0,.95),

    inset
    0 0 65px
    rgba(0,0,0,.65);

}



/* ==================================================
   CURVATURA CRT
================================================== */

.crt::before {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 8;

  background:

    radial-gradient(
      ellipse at center,
      transparent 48%,
      rgba(0,0,0,.12) 70%,
      rgba(0,0,0,.45) 100%
    );

}



/* ==================================================
   SCANLINES
================================================== */

.crt::after {

  content: "";

  position: absolute;

  inset: 0;

  z-index: 10;

  pointer-events: none;

  background:

    repeating-linear-gradient(
      to bottom,

      rgba(255,255,255,.025) 0,

      rgba(255,255,255,.025) 1px,

      transparent 1px,

      transparent 3px
    );

  opacity:
    .45;

}



/* ==================================================
   PARAGENS

   AGORA MAIORES + HÍFEN
================================================== */

.stops {

  position: relative;

  z-index:
    2;

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  grid-column-gap:
    4%;

  /*
    Dá mais espaço vertical
    às estações.
  */

  height:
    73%;

}


.stop-column {

  display:
    flex;

  flex-direction:
    column;

}


.stop {

  /*
    Reduz espaço vazio entre linhas.
  */

  height:
    auto;

  margin-bottom:
    .06em;

  white-space:
    nowrap;

  overflow:
    hidden;

  font-family:
    "VT323",
    monospace;

  font-weight:
    400;

  /*
    MUITO MAIOR
  */

  font-size:
    3vw;

  line-height:
    .88;

  letter-spacing:
    .005em;

  color:
    #d7f04b;

  text-shadow:

    0 0 4px
    rgba(220,255,60,.55),

    0 0 9px
    rgba(150,255,70,.16);

}



/* ==================================================
   ALVERCA

   Tem muitas paragens.
   Continua maior que antes,
   mas reduz o suficiente para caber.
================================================== */

.stops.muitas
.stop {

  font-size:
    2.42vw;

  line-height:
    .86;

  margin-bottom:
    .025em;

}



/* ==================================================
   COMBOIO SEGUINTE
================================================== */

.next-train {

  position: absolute;

  z-index:
    3;

  left:
    6%;

  right:
    6%;

  bottom:
    5%;

  display:
    grid;

  grid-template-columns:
    auto minmax(0,1fr) auto;

  grid-column-gap:
    3%;

  align-items:
    end;

}



/* ==================================================
   COMB.SEGUINTE

   Continua pequeno, como no real.
================================================== */

.next-label {

  font-family:
    "VT323",
    monospace;

  font-weight:
    400;

  font-size:
    .75vw;

  line-height:
    1;

  white-space:
    nowrap;

  opacity:
    .9;

  padding-bottom:
    .15em;

}



/* ==================================================
   DESTINO SEGUINTE

   AGORA MUITO MAIOR
================================================== */

.next-destination {

  font-family:
    "VT323",
    monospace;

  font-weight:
    400;

  font-size:
    3vw;

  line-height:
    .82;

  white-space:
    nowrap;

  overflow:
    hidden;

  text-align:
    left;

  color:
    #d7f04b;

  text-shadow:

    0 0 4px
    rgba(220,255,60,.58),

    0 0 10px
    rgba(150,255,70,.18);

}



/* ==================================================
   HORA SEGUINTE

   AGORA GRANDE COMO NO CRT REAL
================================================== */

.next-time {

  font-family:
    "VT323",
    monospace;

  font-weight:
    400;

  font-size:
    3.2vw;

  line-height:
    .82;

  white-space:
    nowrap;

  text-align:
    right;

  color:
    #d7f04b;

  text-shadow:

    0 0 4px
    rgba(220,255,60,.60),

    0 0 10px
    rgba(150,255,70,.18);

}



/* ==================================================
   IPAD LANDSCAPE
================================================== */

@media (min-width: 900px) {

  .panel {

    width:
      98vw;

    height:
      33vw;

  }


  .hora-label,
  .destino-label {

    font-size:
      2.8vw;

  }


  .h-separator {

    font-size:
      2.7vw;

  }


  .hora-grupo {

    --dot:
      6px;

    --dot-gap:
      1.2px;

  }


  .destino-grupo {

    --dot:
      5.3px;

    --dot-gap:
      1px;

  }


  .dot-character {

    margin-right:
      4px;

  }


  .destino-grupo
  .dot-character {

    margin-right:
      3px;

  }


  /*
    PARAGENS AINDA MAIORES
    em landscape.
  */

  .stop {

    font-size:
      2.75vw;

    line-height:
      .88;

  }


  .stops.muitas
  .stop {

    font-size:
      2.15vw;

    line-height:
      .86;

  }


  .next-label {

    font-size:
      .62vw;

  }


  .next-destination {

    font-size:
      2.75vw;

  }


  .next-time {

    font-size:
      2.95vw;

  }


  .via {

    font-size:
      9vw;

  }

}



/* ==================================================
   IPAD PORTRAIT
================================================== */

@media (max-width: 899px) {

  .panel {

    width:
      99vw;

    height:
      35vw;

    padding:
      2.3% 1.8% 2.4%;

  }


  .screens {

    grid-template-columns:
      64% 34%;

    grid-column-gap:
      2%;

  }


  .hora-label,
  .destino-label {

    font-size:
      3.2vw;

  }


  .h-separator {

    font-size:
      3.1vw;

  }


  .via {

    border-width:
      4px;

    font-size:
      10vw;

  }


  /*
    PARAGENS GRANDES
  */

  .stop {

    font-size:
      3.15vw;

    line-height:
      .88;

  }


  /*
    ALVERCA
  */

  .stops.muitas
  .stop {

    font-size:
      2.45vw;

    line-height:
      .84;

  }


  /*
    COMB.SEGUINTE discreto
  */

  .next-label {

    font-size:
      .8vw;

  }


  /*
    Destino seguinte grande
  */

  .next-destination {

    font-size:
      3.15vw;

  }


  /*
    Hora ligeiramente maior
  */

  .next-time {

    font-size:
      3.4vw;

  }

}

</style>

</head>


<body>


<div class="panel">


  <div class="mount left"></div>

  <div class="mount center"></div>

  <div class="mount right"></div>


  <div class="screens">


    <!-- ============================================

    ============================================= -->

    <section class="left-display">


      <div class="hora-label">

      </div>


      <div class="hora">


        <div
          class="hora-grupo"

<script>

/* ==================================================
   CONFIG

   NÃO MEXER NAS APIs
================================================== */

const API_URL =
  "/api/partidas";


const REFRESH_INTERVAL =
  30000;


const CACHE_KEY =
  "velec-ipad-partidas-final-v1";


const CACHE_MAX_AGE =
  10 * 60 * 1000;


let temDadosVisiveis =
  false;



/* ==================================================
   PARAGENS
================================================== */

const PARAGENS = {


  "LISBOA-ORIENTE": [

    "MASSAMA",

    "MONTE ABRAÃO",

    "QUELUZ BELAS",

    "AMADORA",

    "REBOLEIRA",

    "S.CR-DAMAIA",

    "BENFICA",

    "SETE RIOS",

    "ENTRECAMPOS",

    "ROMA-AREEIRO",

    "BRAÇO PRATA"

  ],


  "ALVERCA": [

    "MASSAMA",

    "MONTE ABRAÃO",

    "QUELUZ BELAS",

    "AMADORA",

    "REBOLEIRA",

    "S.CR-DAMAIA",

    "BENFICA",

    "SETE RIOS",

    "ENTRECAMPOS",

    "ROMA-AREEIRO",

    "BRAÇO PRATA",

    "LISBOA-ORIENTE",

    "MOSCAVIDE",

    "SACAVEM",

    "BOBADELA",

    "S.IRIA",

    "PÓVOA"

  ],


  "LISBOA-S.A": [

    "SETE RIOS",

    "ENTRECAMPOS"

  ]

};



/* ==================================================
   MATRIZ 5x7
================================================== */

const FONT = {


"A":["01110","10001","10001","11111","10001","10001","10001"],

"B":["11110","10001","10001","11110","10001","10001","11110"],

"C":["01111","10000","10000","10000","10000","10000","01111"],

"D":["11110","10001","10001","10001","10001","10001","11110"],

"E":["11111","10000","10000","11110","10000","10000","11111"],

"F":["11111","10000","10000","11110","10000","10000","10000"],

"G":["01111","10000","10000","10111","10001","10001","01111"],

"H":["10001","10001","10001","11111","10001","10001","10001"],

"I":["11111","00100","00100","00100","00100","00100","11111"],

"J":["00111","00010","00010","00010","10010","10010","01100"],

"K":["10001","10010","10100","11000","10100","10010","10001"],

"L":["10000","10000","10000","10000","10000","10000","11111"],

"M":["10001","11011","10101","10101","10001","10001","10001"],

"N":["10001","11001","10101","10011","10001","10001","10001"],

"O":["01110","10001","10001","10001","10001","10001","01110"],

"P":["11110","10001","10001","11110","10000","10000","10000"],

"Q":["01110","10001","10001","10001","10101","10010","01101"],

"R":["11110","10001","10001","11110","10100","10010","10001"],

"S":["01111","10000","10000","01110","00001","00001","11110"],

"T":["11111","00100","00100","00100","00100","00100","00100"],

"U":["10001","10001","10001","10001","10001","10001","01110"],

"V":["10001","10001","10001","10001","10001","01010","00100"],

"W":["10001","10001","10001","10101","10101","10101","01010"],

"X":["10001","10001","01010","00100","01010","10001","10001"],

"Y":["10001","10001","01010","00100","00100","00100","00100"],

"Z":["11111","00001","00010","00100","01000","10000","11111"],


"0":["01110","10001","10011","10101","11001","10001","01110"],

"1":["00100","01100","00100","00100","00100","00100","01110"],

"2":["01110","10001","00001","00010","00100","01000","11111"],

"3":["11110","00001","00001","01110","00001","00001","11110"],

"4":["00010","00110","01010","10010","11111","00010","00010"],

"5":["11111","10000","10000","11110","00001","00001","11110"],

"6":["01110","10000","10000","11110","10001","10001","01110"],

"7":["11111","00001","00010","00100","01000","01000","01000"],

"8":["01110","10001","10001","01110","10001","10001","01110"],

"9":["01110","10001","10001","01111","00001","00001","01110"],


"-":["00000","00000","00000","11111","00000","00000","00000"],


" ":["00000","00000","00000","00000","00000","00000","00000"]

};



/* ==================================================
   DESENHAR FLIP-DOT
================================================== */

function desenharDotText(
  elemento,
  texto
) {


  const fragmento =
    document.createDocumentFragment();


  elemento.innerHTML =
    "";


  texto =
    String(texto)
      .toUpperCase();


  for (
    let i = 0;
    i < texto.length;
    i++
  ) {


    const caracter =
      texto.charAt(i);


    const pattern =
      FONT[caracter]
      ||
      FONT[" "];


    const character =
      document.createElement(
        "div"
      );


    character.className =
      "dot-character";


    for (
      let linha = 0;
      linha < 7;
      linha++
    ) {


      for (
        let coluna = 0;
        coluna < 5;
        coluna++
      ) {


        const dot =
          document.createElement(
            "div"
          );


        dot.className =

          pattern[linha][coluna] === "1"

          ? "dot on"

          : "dot";


        character.appendChild(
          dot
        );


      }


    }


    fragmento.appendChild(
      character
    );


  }


  elemento.appendChild(
    fragmento
  );

}



/* ==================================================
   NORMALIZAR DESTINO
================================================== */

function normalizarDestino(
  destino
) {


  if (!destino) {

    return "";

  }


  const texto =

    String(destino)

      .toUpperCase()

      .normalize("NFD")

      .replace(
        /[\u0300-\u036f]/g,
        ""
      )

      .trim();



  if (
    texto.includes(
      "ORIENTE"
    )
  ) {

    return "LISBOA-ORIENTE";

  }



  if (
    texto.includes(
      "ALVERCA"
    )
  ) {

    return "ALVERCA";

  }



  if (

    texto.includes(
      "SANTA APOLONIA"
    )

    ||

    texto.includes(
      "S.APOLONIA"
    )

    ||

    texto.includes(
      "S. APOLONIA"
    )

    ||

    texto.includes(
      "LISBOA-S.A"
    )

  ) {

    return "LISBOA-S.A";

  }


  return "";

}



/* ==================================================
   HORA
================================================== */

function mostrarHora(
  hora
) {


  const horas =
    document.getElementById(
      "horaHoras"
    );


  const minutos =
    document.getElementById(
      "horaMinutos"
    );


  if (!hora) {


    desenharDotText(
      horas,
      "--"
    );


    desenharDotText(
      minutos,
      "--"
    );


    return;

  }


  const partes =
    String(hora)
      .trim()
      .split(":");


  desenharDotText(

    horas,

    partes[0] || "--"

  );


  desenharDotText(

    minutos,

    partes[1] || "--"

  );

}



/* ==================================================
   CRT
================================================== */

function limitarCRT(
  texto
) {


  return String(texto)

    .toUpperCase()

    .slice(
      0,
      10
    );

}



function limitarProximoDestino(
  texto
) {


  return String(texto)

    .toUpperCase()

    .slice(
      0,
      11
    );

}



/* ==================================================
   PARAGENS

   NOVO:
   adiciona "- " antes de cada estação.
================================================== */

function mostrarParagens(
  destino
) {


  const lista =
    PARAGENS[destino]
    ||
    [];


  const coluna1 =
    document.getElementById(
      "coluna1"
    );


  const coluna2 =
    document.getElementById(
      "coluna2"
    );


  const stops =
    document.getElementById(
      "stops"
    );


  if (
    lista.length > 12
  ) {


    stops.className =
      "stops muitas";


  }

  else {


    stops.className =
      "stops";


  }


  coluna1.innerHTML =
    "";


  coluna2.innerHTML =
    "";


  const corte =
    Math.ceil(
      lista.length / 2
    );


  const esquerda =
    lista.slice(
      0,
      corte
    );


  const direita =
    lista.slice(
      corte
    );



  esquerda.forEach(
    function (
      paragem
    ) {


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "stop";


      linha.textContent =

        "- " +
        limitarCRT(
          paragem
        );


      coluna1.appendChild(
        linha
      );


    }
  );



  direita.forEach(
    function (
      paragem
    ) {


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "stop";


      linha.textContent =

        "- " +
        limitarCRT(
          paragem
        );


      coluna2.appendChild(
        linha
      );


    }
  );

}



/* ==================================================
   ATUALIZAR PAINEL
================================================== */

function atualizarPainel(
  lista
) {


  const comboios =

    lista

      .map(
        function (
          comboio
        ) {


          const destino =
            normalizarDestino(

              comboio.destino

              ||

              comboio.destination

              ||

              comboio.destinoOriginal

            );


          return {

            ...comboio,

            destinoPainel:
              destino

          };


        }
      )

      .filter(
        function (
          comboio
        ) {


          return Boolean(
            comboio.destinoPainel
          );


        }
      );



  if (
    comboios.length === 0
  ) {


    if (
      !temDadosVisiveis
    ) {


      mostrarHora(
        null
      );


      desenharDotText(

        document.getElementById(
          "destinoAtual"
        ),

        "SEM PARTIDAS"

      );


    }


    return;


  }



  /* COMBOIO ATUAL */

  const atual =
    comboios[0];


  mostrarHora(
    atual.hora
  );


  desenharDotText(

    document.getElementById(
      "destinoAtual"
    ),

    atual.destinoPainel

  );


  mostrarParagens(
    atual.destinoPainel
  );



  /* PRÓXIMO COMBOIO */

  const seguinte =
    comboios[1];


  if (
    seguinte
  ) {


    document
      .getElementById(
        "proximoDestino"
      )
      .textContent =

        limitarProximoDestino(
          seguinte.destinoPainel
        );


    document
      .getElementById(
        "proximaHora"
      )
      .textContent =

        seguinte.hora

        ||

        "--:--";


  }

  else {


    document
      .getElementById(
        "proximoDestino"
      )
      .textContent =
        "----";


    document
      .getElementById(
        "proximaHora"
      )
      .textContent =
        "--:--";


  }


  temDadosVisiveis =
    true;

}



/* ==================================================
   CACHE
================================================== */

function carregarCacheLocal() {


  try {


    const bruto =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!bruto) {

      return;

    }


    const cache =
      JSON.parse(
        bruto
      );


    if (

      !cache

      ||

      !Array.isArray(
        cache.lista
      )

      ||

      !cache.guardadoEm

    ) {


      return;


    }


    const idade =

      Date.now()

      -

      cache.guardadoEm;


    if (
      idade >
      CACHE_MAX_AGE
    ) {


      return;


    }


    atualizarPainel(
      cache.lista
    );


  }

  catch (
    erro
  ) {


    console.log(
      "Cache ignorado"
    );


  }

}



function guardarCacheLocal(
  lista
) {


  try {


    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify({

        guardadoEm:
          Date.now(),

        lista:
          lista

      })

    );


  }

  catch (
    erro
  ) {

  }

}



/* ==================================================
   API
================================================== */

async function carregarPartidas() {


  try {


    const resposta =
      await fetch(
        API_URL
      );


    if (
      !resposta.ok
    ) {


      throw new Error(
        "HTTP " +
        resposta.status
      );


    }


    const dados =
      await resposta.json();


    const lista =

      Array.isArray(
        dados
      )

      ?

      dados

      :

      (

        Array.isArray(
          dados.partidas
        )

        ?

        dados.partidas

        :

        []

      );


    if (
      lista.length > 0
    ) {


      guardarCacheLocal(
        lista
      );


    }


    atualizarPainel(
      lista
    );


  }

  catch (
    erro
  ) {


    console.error(
      "Erro API:",
      erro
    );


    /*
      Mantém cache visível
      se existir.
    */

    if (
      !temDadosVisiveis
    ) {


      mostrarHora(
        null
      );


      desenharDotText(

        document.getElementById(
          "destinoAtual"
        ),

        "SEM LIGACAO"

      );


    }


  }

}



/* ==================================================
   ARRANQUE
================================================== */

carregarCacheLocal();


if (
  !temDadosVisiveis
) {


  mostrarHora(
    null
  );


  desenharDotText(

    document.getElementById(
      "destinoAtual"
    ),

    "----------"

  );


}


carregarPartidas();


setInterval(

  carregarPartidas,

  REFRESH_INTERVAL

);

</script>
