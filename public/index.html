<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Partidas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010201;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          ellipse at center,
          #111512 0%,
          #050706 58%,
          #000 100%
        );
    }

    /*
    ==============================
    MOLDURA EXTERIOR
    ==============================
    */

    .monitor {
      position: relative;

      width: min(96vw, 1600px);
      height: min(94vh, 1000px);

      padding:
        clamp(20px, 2.2vw, 45px);

      border-radius:
        clamp(35px, 5vw, 90px);

      background:
        linear-gradient(
          145deg,
          #252b29 0%,
          #111513 18%,
          #050706 50%,
          #151a17 82%,
          #080a09 100%
        );

      border: 2px solid #262c29;

      box-shadow:
        0 35px 100px rgba(0, 0, 0, .95),
        inset 0 0 5px rgba(255,255,255,.08),
        inset 0 0 35px rgba(255,255,255,.02);
    }

    /*
    ==============================
    VIDRO / CRT
    ==============================
    */

    .screen {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius:
        clamp(28px, 4vw, 70px);

      background:
        radial-gradient(
          ellipse at 50% 42%,
          #111b0e 0%,
          #091008 46%,
          #040704 77%,
          #010201 100%
        );

      border:
        2px solid rgba(255,255,255,.055);

      box-shadow:
        inset 0 0 30px rgba(0,0,0,.95),
        inset 0 0 100px rgba(0,0,0,.70),
        inset 0 0 8px rgba(190,255,35,.05);
    }

    /*
    scanlines
    */

    .screen::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 3;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.025) 0px,
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 4px
        );

      opacity: .45;
    }

    /*
    vidro + vinheta
    */

    .screen::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 4;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0,0,0,.18) 70%,
          rgba(0,0,0,.62) 100%
        );
    }

    /*
    ==============================
    CANVAS
    ==============================
    */

    #board {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 2;

      image-rendering: pixelated;
    }

    /*
    ==============================
    REFLEXO MUITO SUAVE
    ==============================
    */

    .reflection {
      position: absolute;

      width: 45%;
      height: 170%;

      left: -22%;
      top: -40%;

      transform: rotate(13deg);

      z-index: 5;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.018),
          rgba(255,255,255,.035),
          transparent
        );

      filter: blur(10px);
    }

    /*
    ==============================
    FLICKER
    ==============================
    */

    .screen {
      animation:
        crtFlicker 7s infinite;
    }

    @keyframes crtFlicker {
      0% {
        filter: brightness(1);
      }

      48% {
        filter: brightness(1);
      }

      49% {
        filter: brightness(.985);
      }

      50% {
        filter: brightness(1.015);
      }

      51% {
        filter: brightness(1);
      }

      100% {
        filter: brightness(1);
      }
    }

    /*
    ==============================
    MOBILE
    ==============================
    */

    @media (max-width: 700px) {

      .monitor {
        width: 100vw;
        height: 100vh;

        padding: 10px;

        border-radius: 0;
      }

      .screen {
        border-radius: 25px;
      }

    }
  </style>
</head>

    /*
    ==========================================================
    CANVAS
    ==========================================================
    */

    const canvas =
      document.getElementById("board");

    const ctx =
      canvas.getContext("2d");


    let partidas = [];

    let mensagem = "SINCRONIZANDO";


    /*
    ==========================================================
    CORES
    ==========================================================
    */

    const GREEN =
      "#c8f52a";

    const GREEN_DIM =
      "rgba(200,245,42,0.16)";

    const DARK =
      "#10180c";


    /*
    ==========================================================
    NORMALIZAÇÃO
    ==========================================================
    */

    function normalizarDestino(destino) {

      if (!destino) {
        return "";
      }

      const texto =
        destino
          .toUpperCase()
          .normalize("NFD")
          .replace(
            /[\u0300-\u036f]/g,
            ""
          )
          .trim();


      if (
        texto.includes("ORIENTE")
      ) {
        return "LISBOA-ORIENTE";
      }


      if (
        texto.includes("ALVERCA")
      ) {
        return "ALVERCA";
      }


      if (
        texto.includes("SANTA APOLONIA") ||
        texto.includes("S.APOLONIA") ||
        texto.includes("S. APOLONIA") ||
        texto.includes("LISBOA-S.A")
      ) {
        return "LISBOA-S.A";
      }


      return "";

    }


    /*
    ==========================================================
    LINHA
    ==========================================================

    Regra definida para este painel:

    Oriente       -> 3
    Alverca        -> 3
    Santa Apolónia -> 4
    */

    function obterLinha(destino) {

      if (
        destino === "LISBOA-S.A"
      ) {
        return "4";
      }

      if (
        destino === "LISBOA-ORIENTE" ||
        destino === "ALVERCA"
      ) {
        return "3";
      }

      return "";
    }


    /*
    ==========================================================
    DIMENSÕES DE TEXTO
    ==========================================================
    */

    function larguraTexto(texto, pixel, gap = 1) {

      const characterWidth =
        (5 + gap) * pixel;

      return (
        texto.length * characterWidth
        -
        gap * pixel
      );

    }


    /*
    ==========================================================
    DESENHA UM CARÁCTER
    ==========================================================
    */

    function desenharCaracter(
      char,
      x,
      y,
      pixel,
      cor = GREEN,
      glow = true
    ) {

      const pattern =
        FONT[char] || FONT[" "];


      ctx.save();


      if (glow) {

        ctx.shadowColor =
          "rgba(200,245,42,.55)";

        ctx.shadowBlur =
          pixel * 1.15;

      }


      ctx.fillStyle = cor;


      for (
        let row = 0;
        row < 7;
        row++
      ) {

        for (
          let col = 0;
          col < 5;
          col++
        ) {

          if (
            pattern[row][col] === "1"
          ) {

            /*
            Pequeno espaço entre píxeis.
            */

            const inset =
              Math.max(
                .4,
                pixel * .10
              );


            ctx.fillRect(

              x +
              col * pixel +
              inset,

              y +
              row * pixel +
              inset,

              pixel -
              inset * 2,

              pixel -
              inset * 2

            );

          }

        }

      }


      ctx.restore();

    }


    /*
    ==========================================================
    DESENHA TEXTO
    ==========================================================
    */

    function desenharTexto(
      texto,
      x,
      y,
      pixel,
      options = {}
    ) {

      const {
        color = GREEN,
        glow = true,
        gap = 1
      } = options;


      texto =
        texto.toUpperCase();


      let cursorX = x;


      for (
        const char of texto
      ) {

        desenharCaracter(
          char,
          cursorX,
          y,
          pixel,
          color,
          glow
        );


        cursorX +=
          (5 + gap) * pixel;

      }

    }


    /*
    ==========================================================
    BARRA PARTIDAS
    ==========================================================
    */

    function desenharCabecalho(
      width,
      top,
      left,
      right,
      pixel
    ) {

      const barHeight =
        9 * pixel;


      /*
      Matriz verde inteira
      */

      for (
        let y = top;
        y < top + barHeight;
        y += pixel
      ) {

        for (
          let x = left;
          x < width - right;
          x += pixel
        ) {

          const inset =
            Math.max(
              .45,
              pixel * .09
            );


          ctx.save();

          ctx.fillStyle =
            GREEN;

          ctx.shadowColor =
            "rgba(200,245,42,.40)";

          ctx.shadowBlur =
            pixel;


          ctx.fillRect(
            x + inset,
            y + inset,
            pixel - inset * 2,
            pixel - inset * 2
          );

          ctx.restore();

        }

      }


      /*
      PARTIDAS em negativo
      */

      const titulo =
        "PARTIDAS";

      const tituloPixel =
        pixel;


      const titleWidth =
        larguraTexto(
          titulo,
          tituloPixel
        );


      const titleX =
        (width - titleWidth) / 2;


      const titleY =
        top + pixel;


      /*
      Fundo verde contínuo atrás
      das letras para limpar
      alguns pontos da matriz.
      */

      ctx.fillStyle = GREEN;

      ctx.fillRect(
        titleX - pixel,
        titleY - pixel / 2,
        titleWidth + pixel * 2,
        pixel * 8
      );


      desenharTexto(
        titulo,
        titleX,
        titleY,
        tituloPixel,
        {
          color: DARK,
          glow: false
        }
      );

    }


    /*
    ==========================================================
    FUNDO EM MATRIZ QUASE INVISÍVEL
    ==========================================================
    */

    function desenharMatrizFundo(
      width,
      height
    ) {

      const spacing =
        Math.max(
          5,
          width / 240
        );


      ctx.save();

      ctx.fillStyle =
        GREEN_DIM;


      for (
        let y = spacing;
        y < height;
        y += spacing
      ) {

        for (
          let x = spacing;
          x < width;
          x += spacing
        ) {

          ctx.fillRect(
            x,
            y,
            .55,
            .55
          );

        }

      }


      ctx.restore();

    }


    /*
    ==========================================================
    DESENHO COMPLETO DO PAINEL
    ==========================================================
    */

    function render() {

      const rect =
        canvas.getBoundingClientRect();


      const dpr =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.round(
          rect.width * dpr
        );

      canvas.height =
        Math.round(
          rect.height * dpr
        );


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );


      const width =
        rect.width;

      const height =
        rect.height;


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      desenharMatrizFundo(
        width,
        height
      );


      /*
      Escala baseada na largura.

      A referência foi feita
      aproximadamente para 1500px.
      */

      const scale =
        Math.min(
          width / 1500,
          height / 900
        );


      const marginX =
        Math.max(
          45,
          width * .105
        );


      /*
      ==========================
      PARTIDAS
      ==========================
      */

      const headerPixel =
        Math.max(
          5,
          8 * scale
        );


      const headerTop =
        height * .115;


      desenharCabecalho(
        width,
        headerTop,
        marginX,
        marginX,
        headerPixel
      );


      /*
      ==========================
      COLUNAS
      ==========================
      */

      const textPixel =
        Math.max(
          5.5,
          7.2 * scale
        );


      const columnY =
        headerTop +
        headerPixel * 12;


      /*
      Posições semelhantes
      à imagem de referência.
      */

      const horaX =
        width * .13;

      const destinoX =
        width * .345;

      const linhaX =
        width * .77;


      desenharTexto(
        "HORA",
        horaX,
        columnY,
        textPixel
      );


      desenharTexto(
        "DESTINO",
        destinoX,
        columnY,
        textPixel
      );


      desenharTexto(
        "LINHA",
        linhaX,
        columnY,
        textPixel
      );


      /*
      ==========================
      PARTIDAS
      ==========================
      */

      const firstRowY =
        columnY +
        textPixel * 11;


      const rowGap =
        textPixel * 10.4;


      if (
        partidas.length === 0
      ) {

        desenharTexto(
          mensagem,
          destinoX,
          firstRowY,
          textPixel * .85
        );

        return;

      }


      partidas
        .slice(
          0,
          MAX_PARTIDAS
        )
        .forEach(
          (
            comboio,
            index
          ) => {

            const y =
              firstRowY +
              index * rowGap;


            /*
            Hora
            */

            desenharTexto(
              comboio.hora ||
              "--:--",

              horaX,
              y,
              textPixel
            );


            /*
            Destino
            */

            desenharTexto(
              comboio.destinoPainel,

              destinoX,
              y,
              textPixel
            );


            /*
            Linha
            */

            desenharTexto(
              obterLinha(
                comboio.destinoPainel
              ),

              linhaX +
              textPixel * 3,

              y,
              textPixel
            );

          }
        );

    }


    /*
    ==========================================================
    DADOS DA API
    ==========================================================
    */

    async function carregarPartidas() {

      try {

        const response =
          await fetch(
            API_URL +
            "?t=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const dados =
          await response.json();


        console.log(
          "Resposta API:",
          dados
        );


        const lista =
          Array.isArray(dados)
            ? dados
            : dados.partidas || [];


        partidas =
          lista

            .map(
              comboio => {

                const destino =
                  normalizarDestino(
                    comboio.destino ||
                    comboio.destination ||
                    comboio.destinoOriginal
                  );


                return {

                  ...comboio,

                  destinoPainel:
                    destino

                };

              }
            )

            .filter(
              comboio =>

                comboio.destinoPainel ===
                  "LISBOA-ORIENTE"

                ||

                comboio.destinoPainel ===
                  "ALVERCA"

                ||

                comboio.destinoPainel ===
                  "LISBOA-S.A"

            )

            .slice(
              0,
              MAX_PARTIDAS
            );


        mensagem =
          partidas.length
            ? ""
            : "SEM PARTIDAS";


        render();

      }

      catch (erro) {

        console.error(
          "Erro ao carregar partidas:",
          erro
        );


        partidas = [];

        mensagem =
          "SEM LIGACAO";


        render();

      }

    }


    /*
    ==========================================================
    ARRANQUE
    ==========================================================
    */

    window.addEventListener(
      "resize",
      render
    );


    render();

    carregarPartidas();


    setInterval(
      carregarPartidas,
      REFRESH_INTERVAL
    );

  </script>
