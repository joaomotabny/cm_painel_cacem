<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">

<title>Partidas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
  rel="stylesheet"
>

<style>

/* ==================================================
   RESET
================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "VT323", monospace;
}


/* ==================================================
   CARCAÇA VELEC
================================================== */

.monitor {
  position: relative;

  width: min(96vw, 1000px);

  aspect-ratio: 4 / 3;

  padding: 3.4%;

  background:
    linear-gradient(
      145deg,
      #181916 0%,
      #090a08 50%,
      #181916 100%
    );

  border: 2px solid #252722;

  border-radius: 2.5%;

  box-shadow:
    0 25px 80px rgba(0,0,0,.95),
    inset 0 0 20px rgba(255,255,255,.05);
}


/* ==================================================
   MOLDURA INTERIOR
================================================== */

.monitor::before {
  content: "";

  position: absolute;

  inset: 2%;

  border-radius: 2%;

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.95);

  pointer-events: none;
}


/* ==================================================
   TUBO CRT
================================================== */

.crt {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 8% / 10%;

  padding:
    8% 9% 7%;

  background:
    radial-gradient(
      ellipse at 48% 46%,
      #4a5145 0%,
      #30392f 38%,
      #172018 72%,
      #070a07 100%
    );

  color: #d8f34b;

  box-shadow:
    inset 0 0 38px rgba(0,0,0,.65),
    inset 0 0 90px rgba(0,0,0,.72);

  animation:
    crtFlicker 7s infinite;
}


/* ==================================================
   REFLEXO / VIDRO
================================================== */

.crt::before {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 20;

  pointer-events: none;

  background:

    linear-gradient(
      108deg,
      rgba(255,255,255,.04) 0%,
      transparent 24%,
      transparent 67%,
      rgba(255,255,255,.025) 76%,
      transparent 100%
    ),

    radial-gradient(
      ellipse at center,
      transparent 40%,
      rgba(0,0,0,.08) 65%,
      rgba(0,0,0,.48) 100%
    );
}


/* ==================================================
   SCANLINES
================================================== */

.crt::after {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 30;

  pointer-events: none;

  opacity: .38;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.035) 0,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 3px
    );
}


/* ==================================================
   CONTEÚDO
================================================== */

.screen-content {
  position: relative;

  z-index: 5;

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  filter:
    blur(.15px);
}


/* ==================================================
   FAIXA PARTIDAS
================================================== */

.title-bar {
  width: 100%;

  height: 11%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #d6ef45;

  color: #29351d;

  font-size:
    clamp(24px, 4.2vw, 54px);

  line-height: .8;

  letter-spacing: .025em;

  text-shadow: none;

  box-shadow:
    0 0 9px rgba(220,255,60,.35);
}


.title-text {
  display: inline-block;

  transform: scaleY(1.13);

  transform-origin: center;
}


/* ==================================================
   CABEÇALHO HORA DESTINO VIA
================================================== */

.header-bar {
  width: 100%;

  height: 10%;

  display: grid;

  grid-template-columns:
    24% 60% 16%;

  align-items: center;

  padding:
    0 2%;

  background: #d6ef45;

  color: #29351d;

  font-size:
    clamp(21px, 3.8vw, 48px);

  line-height: .8;

  box-shadow:
    0 0 9px rgba(220,255,60,.30);
}


.header-item {
  display: inline-block;

  transform: scaleY(1.12);

  transform-origin: center;
}


.header-destination {
  text-align: left;
}


.header-platform {
  text-align: right;
}


/* ==================================================
   ESPAÇO ENTRE CABEÇALHO E PARTIDAS
================================================== */

.list-gap {
  height: 2.2%;
  flex: 0 0 auto;
}


/* ==================================================
   LISTA
================================================== */

.departures {
  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: stretch;
}


/* ==================================================
   LINHA INDIVIDUAL
================================================== */

.departure {
  width: 100%;

  display: grid;

  grid-template-columns:
    24% 60% 16%;

  align-items: center;

  padding:
    0 2%;

  min-height: 8.7%;

  font-size:
    clamp(25px, 4.5vw, 58px);

  line-height: .76;

  letter-spacing: -.015em;

  color: #d4ef47;

  text-shadow:
    0 0 4px rgba(211,239,71,.48);
}


/* ligeira irregularidade de CRT */

.departure:nth-child(2n) {
  opacity: .96;
}

.departure:nth-child(3n) {
  opacity: .92;
}


/* ==================================================
   HORA
================================================== */

.time {
  white-space: nowrap;
}


/* ==================================================
   DESTINO
================================================== */

.destination {
  white-space: nowrap;

  overflow: hidden;

  text-overflow: clip;
}


/* ==================================================
   VIA
================================================== */

.platform {
  text-align: right;

  white-space: nowrap;
}


/* ==================================================
   LETRAS MAIS ALTAS COMO NO VELEC
================================================== */

.time span,
.destination span,
.platform span {
  display: inline-block;

  transform:
    scaleY(1.16);

  transform-origin:
    left center;
}


/* ==================================================
   FLICKER
================================================== */

@keyframes crtFlicker {

  0% {
    opacity: 1;
  }

  94% {
    opacity: 1;
  }

  95% {
    opacity: .988;
  }

  96% {
    opacity: 1;
  }

  98% {
    opacity: .993;
  }

  100% {
    opacity: 1;
  }

}


/* ==================================================
   IPHONE EM PÉ
================================================== */

@media
(max-width: 700px)
and
(orientation: portrait) {

  .monitor {
    width: 97vw;

    aspect-ratio: 4 / 3;

    padding: 3%;
  }


  .crt {
    padding:
      8% 8% 7%;
  }


  .title-bar {
    font-size:
      clamp(24px, 7vw, 42px);
  }


  .header-bar {
    font-size:
      clamp(20px, 5.7vw, 34px);

    grid-template-columns:
      25% 59% 16%;
  }


  .departure {
    grid-template-columns:
      25% 59% 16%;

    font-size:
      clamp(24px, 7.2vw, 43px);

    min-height: 8.6%;
  }

}


/* ==================================================
   IPHONE DEITADO
================================================== */

@media
(max-height: 500px)
and
(orientation: landscape) {

  .monitor {
    height: 96vh;

    width: auto;

    aspect-ratio: 4 / 3;

    padding: 2.5%;
  }


  .crt {
    padding:
      7% 8% 6%;
  }


  .title-bar {
    font-size:
      clamp(20px, 4vw, 34px);
  }


  .header-bar {
    font-size:
      clamp(17px, 3vw, 27px);
  }


  .departure {
    font-size:
      clamp(20px, 4vw, 34px);
  }

}

</style>

</head>

<body>


<div class="monitor">

  <div class="crt">

    <div class="screen-content">


      <!-- PRIMEIRA FAIXA -->

      <div class="title-bar">

        <span class="title-text">
          PARTIDAS
        </span>

      </div>


      <!-- SEGUNDA FAIXA -->

      <div class="header-bar">

        <div>
          <span class="header-item">
            HORA
          </span>
        </div>


        <div class="header-destination">

          <span class="header-item">
            DESTINO
          </span>

        </div>


        <div class="header-platform">

          <span class="header-item">
            VIA
          </span>

        </div>

      </div>


      <div class="list-gap"></div>


      <!-- PARTIDAS -->

      <div
        class="departures"
        id="departures"
      ></div>


    </div>

  </div>

</div>


<script>

/* ==================================================
   CONFIG
================================================== */

const API_URL =
  "/api/partidas-todas";


const REFRESH_INTERVAL =
  30000;


const CACHE_KEY =
  "velec-crt-geral-v4";


const CACHE_MAX_AGE =
  5 * 60 * 1000;


/* ==================================================
   NORMALIZAR DESTINO
================================================== */

function normalizarDestino(
  destino
) {

  if (!destino) {
    return "--------";
  }


  const original =
    String(destino)
      .toUpperCase()
      .trim();


  const texto =
    original
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      );


  if (
    texto.includes("ROSSIO")
  ) {

    return "LIS-ROSSIO";

  }


  if (
    texto.includes("ORIENTE")
  ) {

    return "LIS-ORIENTE";

  }


  if (
    texto.includes("SANTA APOLONIA") ||
    texto.includes("S.APOLONIA") ||
    texto.includes("S. APOLONIA") ||
    texto.includes("LIS-S.APOL")
  ) {

    return "LIS-S.APOL";

  }


  if (
    texto.includes("MELECAS")
  ) {

    return "MELEÇAS";

  }


  if (
    texto.includes("SINTRA")
  ) {

    return "SINTRA";

  }


  if (
    texto.includes("ALVERCA")
  ) {

    return "ALVERCA";

  }


  if (
    texto.includes("CALDAS")
  ) {

    return "CALDAS RAINHA";

  }


  return original;

}


/* ==================================================
   VIA
================================================== */

function obterVia(
  partida
) {

  let via = "";


  if (
    partida.via !== undefined &&
    partida.via !== null
  ) {

    via =
      String(
        partida.via
      )
      .trim();

  }


  if (!via) {

    const destino =
      normalizarDestino(
        partida.destino ||
        partida.destinoOriginal
      );


    const vias = {

      "SINTRA":
        "2",

      "MELEÇAS":
        "1",

      "LIS-ORIENTE":
        "3",

      "ALVERCA":
        "3",

      "LIS-ROSSIO":
        "4",

      "LIS-S.APOL":
        "3",

      "CALDAS RAINHA":
        "1"

    };


    via =
      vias[destino] ||
      "-";

  }


  /*
    VELEC antigo:
    01, 02, 03, 04
  */

  if (
    /^\d+$/.test(via)
  ) {

    via =
      via.padStart(
        2,
        "0"
      );

  }


  return via;

}


/* ==================================================
   HORA SEM :
================================================== */

function formatarHora(
  hora
) {

  if (!hora) {

    return "----";

  }


  return String(hora)
    .replace(
      ":",
      ""
    );

}


/* ==================================================
   QUANTAS LINHAS
================================================== */

function numeroLinhas() {

  /*
    Como no painel real:
    poucas linhas, agrupadas no topo.
  */

  return 7;

}


/* ==================================================
   CRIAR SPAN
================================================== */

function textoCRT(
  texto
) {

  const span =
    document.createElement(
      "span"
    );


  span.textContent =
    texto;


  return span;

}


/* ==================================================
   MOSTRAR PARTIDAS
================================================== */

function mostrarPartidas(
  lista
) {

  const container =
    document.getElementById(
      "departures"
    );


  container.innerHTML =
    "";


  const partidas =
    lista.slice(
      0,
      numeroLinhas()
    );


  partidas.forEach(
    partida => {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "departure";


      /* HORA */

      const hora =
        document.createElement(
          "div"
        );


      hora.className =
        "time";


      hora.appendChild(

        textoCRT(

          formatarHora(
            partida.hora
          )

        )

      );


      /* DESTINO */

      const destino =
        document.createElement(
          "div"
        );


      destino.className =
        "destination";


      destino.appendChild(

        textoCRT(

          normalizarDestino(
            partida.destino ||
            partida.destinoOriginal
          )

        )

      );


      /* VIA */

      const via =
        document.createElement(
          "div"
        );


      via.className =
        "platform";


      via.appendChild(

        textoCRT(

          obterVia(
            partida
          )

        )

      );


      row.appendChild(
        hora
      );


      row.appendChild(
        destino
      );


      row.appendChild(
        via
      );


      container.appendChild(
        row
      );

    }
  );

}


/* ==================================================
   CACHE
================================================== */

function guardarCache(
  lista
) {

  try {

    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify({

        guardadoEm:
          Date.now(),

        lista:
          lista

      })

    );

  }

  catch (
    erro
  ) {}

}


/* ==================================================
   CARREGAR CACHE
================================================== */

function carregarCache() {

  try {

    const bruto =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!bruto) {

      return false;

    }


    const cache =
      JSON.parse(
        bruto
      );


    if (
      !cache ||
      !Array.isArray(
        cache.lista
      ) ||
      !cache.guardadoEm
    ) {

      return false;

    }


    if (
      Date.now() -
      cache.guardadoEm >
      CACHE_MAX_AGE
    ) {

      return false;

    }


    mostrarPartidas(
      cache.lista
    );


    return true;

  }

  catch (
    erro
  ) {

    return false;

  }

}


/* ==================================================
   API
================================================== */

async function carregarPartidas() {

  try {

    const resposta =
      await fetch(
        API_URL,
        {
          cache:
            "no-store"
        }
      );


    if (
      !resposta.ok
    ) {

      throw new Error(
        "HTTP " +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    const lista =
      Array.isArray(
        dados
      )

      ? dados

      : (

        Array.isArray(
          dados.partidas
        )

        ? dados.partidas

        : []

      );


    if (
      lista.length > 0
    ) {

      mostrarPartidas(
        lista
      );


      guardarCache(
        lista
      );

    }

  }

  catch (
    erro
  ) {

    console.error(
      "Erro API:",
      erro
    );

  }

}


/* ==================================================
   ARRANQUE
================================================== */

const temCache =
  carregarCache();


if (
  !temCache
) {

  mostrarPartidas(
    []
  );

}


carregarPartidas();


setInterval(
  carregarPartidas,
  REFRESH_INTERVAL
);

</script>

</body>
</html>
