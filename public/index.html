<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#020803">

<title>Partidas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020302;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "VT323", monospace;
}


/* ==================================================
   MONITOR
================================================== */

.monitor {
  position: relative;

  width: min(98vw, 1200px);
  height: min(94vh, 760px);

  padding: clamp(10px, 2vw, 26px);

  background:
    linear-gradient(
      145deg,
      #151b18 0%,
      #080b09 45%,
      #030403 100%
    );

  border: 2px solid #262d29;
  border-radius: clamp(12px, 2vw, 28px);

  box-shadow:
    0 35px 110px rgba(0,0,0,.95),
    inset 0 0 30px rgba(255,255,255,.035);
}


/* ==================================================
   CRT
================================================== */

.crt {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 7% / 10%;

  padding: 7% 7% 5%;

  color: #c9ef35;

  background:
    radial-gradient(
      ellipse at center,
      #16361d 0%,
      #0b2512 52%,
      #020803 100%
    );

  box-shadow:
    inset 0 0 45px rgba(0,0,0,.92),
    inset 0 0 110px rgba(0,0,0,.75);

  animation: flicker 7s infinite;
}


/* VINHETA */

.crt::before {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 20;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 42%,
      rgba(0,0,0,.10) 65%,
      rgba(0,0,0,.60) 100%
    );
}


/* SCANLINES */

.crt::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 30;
  pointer-events: none;

  opacity: .44;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 4px
    );
}


/* ==================================================
   CONTEÚDO
================================================== */

.content {
  position: relative;
  z-index: 5;

  width: 100%;
  height: 100%;
}


/* ==================================================
   TÍTULO
================================================== */

.title {
  text-align: left;

  font-size: clamp(22px, 3.3vw, 48px);

  line-height: .9;
  letter-spacing: .04em;

  margin-bottom: clamp(7px, 1.2vh, 14px);
}


/* ==================================================
   CABEÇALHO
================================================== */

.header {
  display: grid;

  grid-template-columns:
    23% 61% 16%;

  align-items: center;

  padding-bottom: clamp(2px, .4vh, 5px);

  border-bottom:
    1px solid rgba(201,239,53,.42);

  font-size: clamp(15px, 2.1vw, 31px);

  line-height: 1;
}

.header .via {
  text-align: right;
}


/* ==================================================
   LISTA

   IMPORTANTE:
   já NÃO ocupa automaticamente toda a altura.
================================================== */

.departures {
  display: block;

  width: 100%;

  padding-top:
    clamp(5px, .8vh, 10px);
}


/* ==================================================
   LINHAS

   Agora ficam compactas, como no CRT verdadeiro.
================================================== */

.departure {
  display: grid;

  grid-template-columns:
    23% 61% 16%;

  align-items: baseline;

  width: 100%;

  font-size:
    clamp(23px, 3.5vw, 52px);

  line-height: .92;

  letter-spacing: .005em;

  margin-bottom:
    clamp(2px, .55vh, 7px);

  text-shadow:
    0 0 6px rgba(200,239,53,.36);
}


.departure .time {
  white-space: nowrap;
}


.departure .destination {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
}


.departure .platform {
  text-align: right;
  white-space: nowrap;
}


/* ==================================================
   FLICKER
================================================== */

@keyframes flicker {

  0%   { opacity: 1; }
  96%  { opacity: 1; }
  97%  { opacity: .992; }
  98%  { opacity: 1; }
  99%  { opacity: .986; }
  100% { opacity: 1; }

}


/* ==================================================
   IPHONE LANDSCAPE
================================================== */

@media
(max-height: 500px)
and
(orientation: landscape) {

  .monitor {
    width: 100vw;
    height: 100vh;

    padding: 7px 10px;

    border: 0;
    border-radius: 0;
  }


  .crt {
    padding: 5% 6% 4%;
    border-radius: 6% / 13%;
  }


  .title {
    font-size:
      clamp(18px, 3vw, 27px);

    margin-bottom: 5px;
  }


  .header {
    font-size:
      clamp(11px, 1.8vw, 16px);

    grid-template-columns:
      22% 62% 16%;
  }


  .departure {
    grid-template-columns:
      22% 62% 16%;

    font-size:
      clamp(18px, 3vw, 27px);

    line-height: .91;

    margin-bottom: 2px;
  }


  .departures {
    padding-top: 4px;
  }

}


/* ==================================================
   IPHONE PORTRAIT
================================================== */

@media
(max-width: 700px)
and
(orientation: portrait) {

  .monitor {
    width: 96vw;
    height: 80vh;

    padding: 10px;
  }


  .crt {
    padding:
      8% 8% 7%;
  }


  /*
    Sem AGUALVA-CACÉM.
    PARTIDAS fica mais perto do topo.
  */

  .title {
    font-size:
      clamp(22px, 6.7vw, 38px);

    margin-bottom:
      clamp(7px, 1vh, 11px);
  }


  /*
    As colunas ficam mais próximas
    do painel VELEC real.
  */

  .header {
    grid-template-columns:
      23% 62% 15%;

    font-size:
      clamp(13px, 3.8vw, 22px);
  }


  .departure {
    grid-template-columns:
      23% 62% 15%;

    /*
      Letras grandes mas linhas juntas.
    */

    font-size:
      clamp(24px, 6.4vw, 38px);

    line-height: .90;

    /*
      ESTE é o grande ajuste:
      praticamente não existe o enorme
      espaço vertical da versão anterior.
    */

    margin-bottom:
      clamp(2px, .5vh, 5px);
  }


  .departures {
    padding-top:
      clamp(7px, 1vh, 11px);
  }

}

</style>

</head>


<body>

<div class="monitor">

  <div class="crt">

    <div class="content">


      <div class="title">
        PARTIDAS
      </div>


      <div class="header">

        <div>
          HORA
        </div>

        <div>
          DESTINO
        </div>

        <div class="via">
          VIA
        </div>

      </div>


      <div
        class="departures"
        id="departures"
      ></div>


    </div>

  </div>

</div>


<script>

/* ==================================================
   CONFIG
================================================== */

const API_URL =
  "/api/partidas-todas";


const REFRESH_INTERVAL =
  30000;


const CACHE_KEY =
  "crt-partidas-agualva-v3";


const CACHE_MAX_AGE =
  5 * 60 * 1000;


/* ==================================================
   NÚMERO DE LINHAS
================================================== */

function numeroLinhas() {

  if (
    window.innerHeight < 500 &&
    window.innerWidth > window.innerHeight
  ) {

    return 8;

  }

  return 10;

}


/* ==================================================
   NORMALIZAR DESTINO
================================================== */

function normalizarDestino(
  destino
) {

  if (!destino) {
    return "--------";
  }


  const texto =
    String(destino)
      .toUpperCase()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .trim();


  if (
    texto.includes("ROSSIO")
  ) {
    return "LIS-ROSSIO";
  }


  if (
    texto.includes("ORIENTE")
  ) {
    return "LIS-ORIENTE";
  }


  if (
    texto.includes("SANTA APOLONIA") ||
    texto.includes("S.APOLONIA") ||
    texto.includes("S. APOLONIA") ||
    texto.includes("LIS-S.APOL")
  ) {
    return "LIS-S.APOL";
  }


  if (
    texto.includes("MELECAS")
  ) {
    return "MELEÇAS";
  }


  if (
    texto.includes("SINTRA")
  ) {
    return "SINTRA";
  }


  if (
    texto.includes("ALVERCA")
  ) {
    return "ALVERCA";
  }


  if (
    texto.includes("CALDAS")
  ) {
    return "CALDAS RAINHA";
  }


  return String(destino)
    .toUpperCase();

}


/* ==================================================
   VIA
================================================== */

function obterVia(
  partida
) {

  if (
    partida.via !== undefined &&
    partida.via !== null &&
    String(partida.via).trim() !== ""
  ) {

    return String(
      partida.via
    );

  }


  const destino =
    normalizarDestino(
      partida.destino ||
      partida.destinoOriginal
    );


  const vias = {

    "SINTRA":
      "2",

    "MELEÇAS":
      "1",

    "LIS-ORIENTE":
      "3",

    "ALVERCA":
      "3",

    "LIS-ROSSIO":
      "4",

    "LIS-S.APOL":
      "3",

    "CALDAS RAINHA":
      "1"

  };


  return vias[destino] || "-";

}


/* ==================================================
   MOSTRAR PARTIDAS
================================================== */

function mostrarPartidas(
  lista
) {

  const container =
    document.getElementById(
      "departures"
    );


  container.innerHTML =
    "";


  const limite =
    numeroLinhas();


  const partidas =
    lista.slice(
      0,
      limite
    );


  partidas.forEach(
    partida => {


      const linha =
        document.createElement(
          "div"
        );


      linha.className =
        "departure";


      /* HORA */

      const hora =
        document.createElement(
          "div"
        );


      hora.className =
        "time";


      hora.textContent =
        partida.hora ||
        "--:--";


      /* DESTINO */

      const destino =
        document.createElement(
          "div"
        );


      destino.className =
        "destination";


      destino.textContent =
        normalizarDestino(
          partida.destino ||
          partida.destinoOriginal
        );


      /* VIA */

      const via =
        document.createElement(
          "div"
        );


      via.className =
        "platform";


      via.textContent =
        obterVia(
          partida
        );


      linha.appendChild(
        hora
      );


      linha.appendChild(
        destino
      );


      linha.appendChild(
        via
      );


      container.appendChild(
        linha
      );

    }
  );

}


/* ==================================================
   CACHE
================================================== */

function guardarCache(
  lista
) {

  try {

    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify({

        guardadoEm:
          Date.now(),

        lista:
          lista

      })

    );

  }

  catch (
    erro
  ) {}

}



function carregarCache() {

  try {

    const bruto =
      localStorage.getItem(
        CACHE_KEY
      );


    if (!bruto) {
      return false;
    }


    const cache =
      JSON.parse(
        bruto
      );


    if (
      !cache ||
      !Array.isArray(
        cache.lista
      ) ||
      !cache.guardadoEm
    ) {

      return false;

    }


    if (
      Date.now() -
      cache.guardadoEm >
      CACHE_MAX_AGE
    ) {

      return false;

    }


    mostrarPartidas(
      cache.lista
    );


    return true;

  }

  catch (
    erro
  ) {

    return false;

  }

}


/* ==================================================
   API
================================================== */

async function carregarPartidas() {

  try {

    const response =
      await fetch(
        API_URL,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const dados =
      await response.json();


    const lista =
      Array.isArray(
        dados
      )

      ? dados

      : (

        Array.isArray(
          dados.partidas
        )

        ? dados.partidas

        : []

      );


    if (
      lista.length > 0
    ) {

      mostrarPartidas(
        lista
      );


      guardarCache(
        lista
      );

    }

  }

  catch (
    erro
  ) {

    console.error(
      "Erro:",
      erro
    );

  }

}


/* ==================================================
   ARRANQUE
================================================== */

const temCache =
  carregarCache();


if (
  !temCache
) {

  mostrarPartidas(
    []
  );

}


carregarPartidas();


setInterval(
  carregarPartidas,
  REFRESH_INTERVAL
);


window.addEventListener(
  "resize",
  carregarPartidas
);

</script>

</body>
</html>
