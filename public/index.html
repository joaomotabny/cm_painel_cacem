<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000; 
            color: #ff9900; 
            font-family: 'VT323', monospace; 
            margin: 0; 
            padding: 20px;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        .header { 
            font-size: 40px; 
            border-bottom: 3px solid #663300; 
            padding-bottom: 10px;
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between;
        }

        #clock { font-weight: bold; }

        .row { 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid #331a00; 
            height: 90px; 
            line-height: 90px;
        }

        .col-line { 
            width: 15%; 
            font-size: 75px; 
            font-weight: bold;
        }

        .col-dest { 
            width: 50%; 
            font-size: 55px; 
            overflow: hidden; 
            white-space: nowrap; 
            text-overflow: ellipsis;
            padding-left: 15px;
        }

        .col-time { 
            width: 35%; 
            text-align: right; 
            font-size: 55px; 
            font-weight: bold;
        }

        .diff-min {
            font-size: 40px;
            margin-right: 10px;
            opacity: 0.8;
        }

        .live-icon { font-size: 25px; margin-left: 5px; vertical-align: middle; }
        
        @keyframes blinker { 50% { opacity: 0; } }
        .blink { animation: blinker 1s linear infinite; color: #ff3333; }
    </style>
</head>
<body>
    <div class="header">
        <span>Cacém - Av. Bons Amigos (Belas)</span>
        <span id="clock">00:00:00</span>
    </div>
    <div id="list">A calcular tempos...</div>

    <script>
        function setClock() {
            var now = new Date();
            document.getElementById('clock').innerHTML = ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2) + ":" + ("0" + now.getSeconds()).slice(-2);
        }

        function formatCMTime(timeStr) {
            if (!timeStr) return "--:--";
            let parts = timeStr.split(':');
            let hour = parseInt(parts[0]);
            if (hour >= 24) hour -= 24;
            return ("0" + hour).slice(-2) + ":" + parts[1];
        }

        async function updateBoard() {
            const stopIds = ['170459', '172500']; 
            try {
                const results = await Promise.all(stopIds.map(id => 
                    fetch(`https://api.carrismetropolitana.pt/stops/${id}/realtime`)
                    .then(res => res.json())
                ));
                
                let all = [].concat(...results);
                const now = new Date();

                let filtered = all.filter(d => {
                    const timeUnix = (d.estimated_arrival_unix || d.scheduled_arrival_unix);
                    return timeUnix > (Math.floor(Date.now() / 1000) - 60);
                });

                filtered.sort((a, b) => (a.scheduled_arrival_unix) - (b.scheduled_arrival_unix));

                let html = '';
                filtered.slice(0, 7).forEach(d => {
                    const arrivalUnix = d.estimated_arrival_unix || d.scheduled_arrival_unix;
                    const arrivalDate = new Date(arrivalUnix * 1000);
                    
                    // Cálculo da diferença
                    const diffMs = arrivalDate - now;
                    const diffMin = Math.floor(diffMs / 60000);
                    
                    let rawTime = d.estimated_arrival || d.scheduled_arrival;
                    let displayTime = formatCMTime(rawTime);
                    const isLive = d.estimated_arrival ? '<span class="live-icon">📡</span>' : '';

                    let timeDisplay = "";
                    if (diffMin <= 0) {
                        timeDisplay = `<span class="blink">A chegar</span>`;
                    } else {
                        // Mostra os minutos que faltam e a hora exata
                        timeDisplay = `<span class="diff-min">${diffMin}min</span> <span>${displayTime}</span>`;
                    }

                    html += `<div class="row">
                        <span class="col-line">${d.line_id}</span>
                        <span class="col-dest">${d.headsign}</span>
                        <span class="col-time">${timeDisplay}${isLive}</span>
                    </div>`;
                });

                document.getElementById('list').innerHTML = html || '<div class="row">Sem serviços previstos</div>';
            } catch (e) {
                document.getElementById('list').innerHTML = "Erro de rede";
            }
        }

        setClock(); updateBoard();
        setInterval(setClock, 1000);
        setInterval(updateBoard, 30000);
    </script>
</body>
</html>
