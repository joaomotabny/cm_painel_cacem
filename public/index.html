<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000; 
            color: #ff9900; /* Tudo Laranja */
            font-family: 'VT323', monospace; 
            margin: 0; 
            padding: 20px;
            /* Efeito de scanline subtil para estilo retro */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        .header { 
            font-size: 35px; 
            border-bottom: 3px solid #663300; 
            padding-bottom: 10px;
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between;
        }

        #clock { font-weight: bold; }

        .row { 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid #331a00; 
            height: 80px; /* Linhas mais altas */
            line-height: 80px;
        }

        /* TAMANHOS DE FONTE AUMENTADOS */
        .col-line { 
            width: 18%; 
            font-size: 65px; 
            font-weight: bold; 
            color: #ff9900;
        }

        .col-dest { 
            width: 60%; 
            font-size: 50px; 
            overflow: hidden; 
            white-space: nowrap; 
            text-overflow: ellipsis;
            padding-left: 10px;
        }

        .col-time { 
            width: 22%; 
            text-align: right; 
            font-size: 60px; 
            font-weight: bold;
        }

        .live-icon { font-size: 25px; margin-left: 10px; opacity: 0.8; }
        
        @keyframes blinker { 50% { opacity: 0; } }
        .blink { animation: blinker 1s linear infinite; color: #ff0000; } /* A chegar mantém vermelho para alerta */
    </style>
</head>
<body>
    <div class="header">
        <span>Cacém - Av. Bons Amigos (Belas)</span>
        <span id="clock">00:00:00</span>
    </div>
    <div id="list" style="font-size: 40px;">A sintonizar...</div>

    <script>
        function setClock() {
            var now = new Date();
            document.getElementById('clock').innerHTML = ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2) + ":" + ("0" + now.getSeconds()).slice(-2);
        }

        function formatCMTime(timeStr) {
            if (!timeStr) return "--:--";
            let parts = timeStr.split(':');
            let hour = parseInt(parts[0]);
            if (hour >= 24) hour -= 24;
            return ("0" + hour).slice(-2) + ":" + parts[1];
        }

        async function updateBoard() {
            const stopIds = ['170459', '172500']; 
            try {
                const results = await Promise.all(stopIds.map(id => 
                    fetch(`https://api.carrismetropolitana.pt/stops/${id}/realtime`)
                    .then(res => res.json())
                ));
                
                let all = [].concat(...results);
                const nowUnix = Math.floor(Date.now() / 1000);

                let filtered = all.filter(d => {
                    const time = (d.estimated_arrival_unix || d.scheduled_arrival_unix);
                    const isFuture = time > nowUnix - 60;
                    const isNotOdivelas = !d.headsign.toLowerCase().includes("odivelas");
                    return isFuture && isNotOdivelas;
                });

                filtered.sort((a, b) => (a.scheduled_arrival_unix) - (b.scheduled_arrival_unix));

                let html = '';
                // No Mac com fonte grande, 7-8 linhas costumam caber bem no ecrã total
                filtered.slice(0, 8).forEach(d => {
                    let rawTime = d.estimated_arrival || d.scheduled_arrival;
                    let displayTime = formatCMTime(rawTime);
                    const isLive = d.estimated_arrival ? '<span class="live-icon">📡</span>' : '';

                    html += `<div class="row">
                        <span class="col-line">${d.line_id}</span>
                        <span class="col-dest">${d.headsign}</span>
                        <span class="col-time">${displayTime}${isLive}</span>
                    </div>`;
                });

                document.getElementById('list').innerHTML = html || '<div class="row">Sem mais serviços hoje</div>';
            } catch (e) {
                document.getElementById('list').innerHTML = "Erro de ligação";
            }
        }

        setClock(); updateBoard();
        setInterval(setClock, 1000);
        setInterval(updateBoard, 30000);
    </script>
</body>
</html>
